# DAGON MCU definition (format: targets/README.md). Addresses match
# src/layout.rs; never move them.
format = 1
id = "rp2040"
name = "RP2040"
wire_id = 0x0001
port = "self-boot"
gpio_count = 30
# SRAM0-5 (RP2040 datasheet section 2.6.2): 256 KiB striped, then the 4 KiB
# SRAM4 and SRAM5 banks.
ram = { at = 0x2000_0000, size = 0x4_2000 }

# The first flash map is the MCU's default.
[[flash_map]]
name = "rp2040-4m"
# Images run from flash in place at base.
xip = true
base = 0x1000_0000
bytes = 0x40_0000

[layout]
stage0 = { at = 0x1000_0000, size = 0x4000 }
bootcore_log = { faces = [0x1000_4000, 0x1000_5000], face_size = 0x1000 }
app_log = { faces = [0x1000_6000, 0x1000_7000], face_size = 0x1000 }

[[slot]]
image = "bootcore"
binding = "a"
header = "inline"
at = 0x1000_8000
size = 0x2_0000

[[slot]]
image = "bootcore"
binding = "b"
header = "inline"
at = 0x1002_8000
size = 0x2_0000

[[slot]]
image = "app"
binding = "a"
header = "inline"
at = 0x1004_8000
size = 0x10_0000

[[slot]]
image = "app"
binding = "b"
header = "inline"
at = 0x1014_8000
size = 0x10_0000

# First write: rescue.uf2 copied to the boot ROM drive (BOOT held at plug-in).
[writer]
kind = "uf2-drive"
family = 0xE48B_FF56
sector = 0x1000
info_file = "INFO_UF2.TXT"
info_header = "UF2 Bootloader"
board_id = "RPI-RP2"

# Parts built from this package besides the app (sub: package folder).
[[part]]
name = "stage0"
sub = "stage0"

[[part]]
name = "bootcore"
sub = "bootcore"

# What the coordinator (hub) rules check on this MCU.
[coordinator]
pio_state_machines = 8
pio_uart_state_machines = 2
uart0_tx = [0, 12, 16, 28]
uart0_rx = [1, 13, 17, 29]

# The UART the UART links run on (src/links.rs): embassy-rp 0.10's PIO
# UART program, 8 PIO cycles a bit, its divider clk_sys / (8 * baud) in
# whole numbers (pio_programs/uart.rs, u32 division). clk_sys is 125 MHz:
# embassy_rp::init's default ClockConfig::crystal(12 MHz), 12 MHz * 125 / 6
# / 2 (RP2040 datasheet section 2.18, PLL).
[link_uart]
clock_hz = 125_000_000
clocks_per_bit = 8
frac_bits = 0
# Bit rates the firmware runs the link at: a link's baud is one of these on both ends.
bauds = [115_200, 230_400]

# Link kinds the firmware implements (src/kinds.rs LINK_KINDS).
[links]
up = ["usb-cdc"]
down = ["i2c", "uart"]

[watchdog]
kind = "rp-watchdog"
trial_ms = 8_000
confirmed_ms = 8_000
# The boot core starts a pending image this many times before it rolls back.
trial_attempts = 3
# The lockup fuse's watchdog-reset flag: WATCHDOG REASON is cleared by a
# RUN-pin reset, so the MCU package keeps the flag itself. To be verified
# on the hardware.
flag = { unverified = "package" }

# Flash operations run from RAM with XIP off; the flash driver masks
# interrupts and pauses core 1 for each. DAGON erases one 4 KiB sector per
# operation. Its maximum erase time is the board's QSPI flash part's
# (sector erase tSE in that part's datasheet): the part is the board's, not
# named here, so the value is not yet verified. The masking budget of
# DAGON's own code is to be measured on the board.
[execution]
masked_max_us = "unmeasured"
flash_op = "xip-off-masked"
erase_unit = 0x1000
erase_unit_max_ms = { unverified = 400 }

# Protection hardware: the Cortex-M0+ ARMv6-M MPU, 8 regions of at least
# 256 bytes (RP2040 datasheet section 2.4), read back from MPU_TYPE at boot.
# No fault status or address registers: faults are HardFaults attributed by
# the open call.
[isolation]
level = "mpu"
kind = "armv6m-mpu"
boot_extensions = true
ext_ram_max = 32_768

[isolation.capabilities]
mpu_regions = 8
min_region = 256
subregions_from = 256
critical_section = "primask"
reset_cleanup = "peripheral-reset"
background_privileged = true
unwind = "cortex-m-exception"
timer = "systick"
fault_address = false

# Boot record and lockup fuse: SRAM4, outside every image's RAM (the
# memory.x fragments `dagon gen` writes end at SRAM4). The boot ROM uses
# SRAM5 for boot2 and its stack.
[boot.record]
kind = "noinit-ram"
at = 0x2004_0000
size = 0x800
survives = "reset-random"
# The ring oscillator's RANDOMBIT (RP2040 datasheet section 2.17), sampled
# repeatedly; its min-entropy is to be measured on the board.
entropy = { source = "ring-osc", min_bits = "unmeasured" }
rings = [
    { writer = "stage0", at = 0x2004_0000, size = 0x200 },
    { writer = "bootcore", at = 0x2004_0200, size = 0x600 },
]
fuse = { cells = [
    { image = "bootcore", at = 0x2004_0800, size = 0x100 },
    { image = "app", at = 0x2004_0900, size = 0x100 },
] }

[[core]]
id = "core0"

[[core]]
id = "core1"

# Every register block (RP2040 datasheet section 2.2, address map). APB
# blocks are 16 KiB with their atomic set/clear/xor aliases.
[[peripheral]]
