# DAGON components and compatibility contracts: the single list of both.
# The rules that use it are in docs/versioning.md.
#
# [formats]
#   <contract> = <number>: every compatibility contract (a file format, a
#   protocol, an API) and the format number it is at in this tree. The
#   comment beside each says where the number is written and which code
#   constant holds it.
#
# [[component]] (one entry per long-lived component)
#   name      The component's name; also its commit scope (feat(<name>):)
#             and its tag prefix (<name>-v<version>).
#   version   Its SemVer version. A new component starts at 0.1.0.
#   paths     The files it owns. A file belongs to the component with the
#             longest matching path; a file outside every component needs
#             no release.
#   packages  The Cargo packages whose own Cargo.toml carries this version
#             (all of them the same). The "cli" entry also stands for the
#             page it serves: web/package.json carries the same version.
#   formats   <contract> = [numbers]: the format numbers it reads and
#             writes, for each contract it uses.
#
# Adding a component or a contract means editing this file (and, for a
# contract, the CLI's list of format numbers in
# crates/dagon-cli/src/versions.rs). The CLI's tests check this file
# against the code constants, the package manifests and web/package.json,
# and that every Cargo package outside these entries stays 0.0.0.
# dagon --version, status, doctor and GET /v1/hello read it;
# scripts/bump_check.py and scripts/changelog.py read it for releases.

[formats]
wire = 1            # frames and payloads between host, hub and nodes: byte 2 of every frame, HELLO proto_ver (dagon-proto PROTO_VERSION)
image-header = 1    # signed 512-byte image header: offset 0x004 (dagon-format header::HDR_VERSION)
state-log = 1       # boot core and app state log faces: offset 0x004 (dagon-format statelog::FORMAT_VERSION)
manifest = 1        # release manifest: offset 4 (dagon-format manifest::MF_VERSION)
bundle = 1          # release file .dgb: offset 4 (dagon-format bundle::BN_VERSION)
topology-bin = 1    # compiled topology: offset 4 (dagon-format topology::TP_VERSION)
topology-yaml = 1   # topology source: its `dagon:` key (dagon-topology SCHEMA_VERSION)
definitions = 1     # dagon-mcu.toml / dagon-board.toml / [board.<id>]: `format` key, left out = 1 (dagon-topology defs::FORMAT)
serve-api = 1       # dagon serve HTTP API: GET /v1/hello `api` (dagon-cli versions::SERVE_API)

[[component]]
name = "cli"
version = "0.1.0"
packages = ["dagon-cli"]
paths = ["crates/dagon-cli", "crates/dagon-wasm", "web"]
formats = { wire = [1], image-header = [1], state-log = [1], manifest = [1], bundle = [1], topology-bin = [1], topology-yaml = [1], definitions = [1], serve-api = [1] }

