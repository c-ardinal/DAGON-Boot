# Generated by `dagon gen`: how node {{node}}'s boot core builds. Do not edit.
[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
# Compact SHA-256 and SHA-512 rounds (one round per loop step; the unrolled
# SHA-512 alone takes about 26 KB) keep the boot core small: it must fit the smallest
# boot core slot of the MCU definition ([[slot_layout]] target "bootcore",
# capacity).
rustflags = ["-C", "link-arg=--nmagic", "-C", "link-arg=-Tlink.x", "--cfg", 'sha2_backend_soft="compact"']

[env]
# This folder: the node, its board and its trusted extensions (Cargo.toml).
DAGON_BOOT_CRATE = { value = ".", relative = true }
# The node's tag: the boot core accepts only images tagged with it.
DAGON_TARGET_TAG = "{{tag}}"
