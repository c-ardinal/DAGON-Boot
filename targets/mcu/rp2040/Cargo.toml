[package]
name = "dagon-mcu-rp2040"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.0.0"
publish = false
build = "build.rs"

# DAGON MCU package for the RP2040. Without features it is host-testable:
#   cargo test --no-default-features --target <host triple>
[workspace]

[package.metadata.dagon]
mcu = "rp2040"

[features]
# The 親機 relay by default: a generated node names this package without
# features (RP2040 nodes are 親機).
default = ["relay"]
# The embassy-rp parts: flash port, watchdog guard, slot store, link
# drivers, sub-MCU control lines, and the verifying key from DAGON_PUBKEY.
hal = ["dep:embassy-rp", "dep:embassy-time", "dep:dagon-agent", "dep:static_cell", "dep:portable-atomic"]
# DAGON over USB CDC (device, frame link, agent serving loop) and DAGON's
# high-priority executor (SWI_IRQ_0).
usb = ["hal", "embassy-rp?/rt", "dep:embassy-usb", "dep:embassy-executor"]
# The 親機 relay (PC link, sub-node links, ROM recovery path).
relay = ["usb", "dep:embassy-sync", "dep:embassy-futures"]
# The final binary's memory.x comes from this package: an APP slot body
# (slot A, or B with `slot-b`) unless it is a boot image.
slot-b = []
image-stage0 = []
image-bootcore = []
# A panic blinks the last step code on the LED named by `arm::led::select`.
diag-panic = []

[dependencies]
dagon-core = { path = "../../../crates/dagon-core" }
dagon-format = { path = "../../../crates/dagon-format" }
dagon-port = { path = "../../../crates/dagon-port" }
dagon-proto = { path = "../../../crates/dagon-proto" }
dagon-mcu-common = { path = "../common" }
dagon-agent = { path = "../../../crates/dagon-agent", optional = true }
# boot2-none: stage0 holds boot2; every other image starts after a header.
embassy-rp = { version = "0.10.0", default-features = false, features = ["rp2040", "boot2-none"], optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-usb = { version = "0.6.0", optional = true }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-interrupt"], optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-futures = { version = "0.1", optional = true }
heapless = "0.9"
static_cell = { version = "2", optional = true }
# static_cell needs CAS, which thumbv6m only has through a critical section.
portable-atomic = { version = "1", features = ["critical-section"], optional = true }

[build-dependencies]
dagon-mcu-build = { path = "../build" }
# build.rs includes src/layout.rs (one source for addresses and memory.x).
dagon-core = { path = "../../../crates/dagon-core" }

[dev-dependencies]
dagon-sim = { path = "../../../crates/dagon-sim" }
ed25519-compact = { version = "2.6", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7"
