[package]
name = "dagon-catalog"
edition.workspace = true
license.workspace = true
version = "0.0.0"
publish = false
description = "Every DAGON state machine's catalog in one registry, and the generated Events and Ports pages of the documentation"

[dependencies]
dagon-agent = { path = "../dagon-agent" }
dagon-boot = { path = "../dagon-boot" }
# It prints the catalogs' docs.
dagon-events = { path = "../dagon-events", features = ["catalog-docs"] }

[dev-dependencies]
# The port traits the catalog names, checked by the build (tests/docs.rs).
dagon-core = { path = "../dagon-core" }
dagon-format = { path = "../dagon-format" }
dagon-host = { path = "../dagon-host", features = ["std"] }
dagon-port = { path = "../dagon-port" }
dagon-sign = { path = "../dagon-sign" }
serde_json = "1"
toml = "0.8"
