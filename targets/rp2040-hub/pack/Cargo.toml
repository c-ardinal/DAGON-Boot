[package]
name = "rp2040-hub-pack"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.0.0"
publish = false

# Host tool. Run from the repository root (the hub's .cargo config targets
# thumbv6m): cargo run --manifest-path targets/rp2040-hub/pack/Cargo.toml -- ...
[workspace]

[dependencies]
dagon-format = { path = "../../../crates/dagon-format" }
dagon-port = { path = "../../../crates/dagon-port" }
rp2040-common ={ path = "../../rp2040-bootcore/common" }
ed25519-compact = { version = "2.6", default-features = false }
