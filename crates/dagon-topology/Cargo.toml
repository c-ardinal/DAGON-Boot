[package]
name = "dagon-topology"
edition.workspace = true
license.workspace = true
version = "0.1.0"

[dependencies]
dagon-format = { path = "../dagon-format" }
# The erase planner and the node timings the definitions describe.
dagon-port = { path = "../dagon-port" }
dagon-proto = { path = "../dagon-proto" }
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
# The definition format (dagon-mcu.toml, dagon-board.toml); already in the
# lock file through dagon-cli. display: an inline [board.<id>] keeps its
# TOML text for the JSON form.
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# The definitions' JSON form for the browser (Registry::to_json); already in
# the lock file through dagon-cli.
serde_json = "1"
# The node folder's definition hashes (defs.sha256): one format and one
# check for the MCU packages' builds and this crate's.
dagon-mcu-build = { path = "../../targets/mcu/build" }

[build-dependencies]
# Reads which text files a builtin MCU definition names (build.rs).
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
# Parity tests: the definitions match the built-in tables (these crates depend
# on this one; the cycle is through dev-dependencies only).
dagon-host = { path = "../dagon-host", features = ["defs"] }
dagon-romlink = { path = "../dagon-romlink" }
dagon-sign = { path = "../dagon-sign" }
# tests/defs_layout.rs compiles the MCU packages' build helper
# (targets/mcu/build), which hashes the node's definitions; already in the
# lock file through dagon-format.
sha2 = { version = "0.11", default-features = false }
