.dg-g{fill:#2f6fb0;font:700 12px system-ui,'Segoe UI','Noto Sans JP',sans-serif;letter-spacing:1px}
@media (prefers-color-scheme:dark){.dg-bg{fill:#0f151c}.dg-band{fill:#1a232e;stroke:#37455a}
