# DAGON MCU definition (format: targets/README.md). Addresses match
# src/layout.rs (sectors 16K x4, 64K, 128K x3); never move them.
format = 1
id = "stm32f401re"
name = "STM32F401RE"
wire_id = 0x0002
port = "self-boot"
# Pins are named by port (PB4), not numbered.
gpio_count = 0
# SRAM1 (ST RM0368 section 2.3).
ram = { at = 0x2000_0000, size = 0x1_8000 }

[[flash_map]]
name = "f401-default"
# Images run from flash in place at base.
xip = true
base = 0x0800_0000
bytes = 0x8_0000

[layout]
app_log = { faces = [0x0800_8000, 0x0800_C000], face_size = 0x4000 }

# Boot core: sectors 0-1, its header in the trailer.
[[slot]]
image = "bootcore"
binding = "a"
header = "trailer"
at = 0x0800_0000
size = 0x8000

[[slot]]
image = "app"
binding = "a"
header = "inline"
at = 0x0802_0000
size = 0x2_0000

[[slot]]
image = "app"
binding = "b"
header = "inline"
at = 0x0804_0000
size = 0x2_0000

# First write: chip erase, flash.bin from the flash base, reset.
[writer]
kind = "probe-rs"
chip = "STM32F401RETx"

[[part]]
name = "bootcore"
sub = "bootcore"

# The system-memory I2C bootloader (ROM entry kind stm32-i2c-rom).
[rom_i2c]
name = "STM32 ROM bootloader"
addr = 0x39
max_hz = 400_000
# Boot core (0-1), state logs A/B (2-3), APP-A (5).
erase_sectors = [0, 1, 2, 3, 5]
pairs = [
    { controller = "i2c3", sda = "PB4", scl = "PA8" },
    { controller = "i2c1", sda = "PB7", scl = "PB6" },
    { controller = "i2c2", sda = "PB3", scl = "PB10" },
]

# Link kinds the firmware implements (src/links.rs LINK_KINDS).
[links]
up = ["i2c"]

[watchdog]
kind = "iwdg"
trial_ms = 4_000
confirmed_ms = 8_000

# Protection hardware: ARMv7-M PMSAv7 MPU, 8 regions (ST PM0214 section 4.2),
# read back from MPU_TYPE at boot.
[isolation]
level = "mpu"
kind = "armv7m-mpu"
boot_extensions = true
ext_ram_max = 24_576
root_protection = ["rdp1", "rdp2", "wrp"]

[isolation.capabilities]
mpu_regions = 8
min_region = 32
subregions_from = 256
critical_section = "basepri"
reset_cleanup = "peripheral-reset"
background_privileged = true
unwind = "cortex-m-exception"
timer = "systick"
fault_address = true

# Boot record and lockup fuse: the last 4 KiB of SRAM, outside every
# image's RAM (the memory.x fragments `dagon gen` writes leave it out).
[boot.record]
kind = "noinit-ram"
at = 0x2001_7000
size = 0x800
survives = "reset-random"
rings = [{ writer = "bootcore", at = 0x2001_7000, size = 0x800 }]
fuse = { cells = [
    { image = "bootcore", at = 0x2001_7800, size = 0x100 },
    { image = "app", at = 0x2001_7900, size = 0x100 },
] }

[[core]]
id = "cpu0"

# Every register block (ST RM0368 section 2.3, memory map). The GPIO ports
