# DAGON MCU definition (format: targets/README.md). The firmware's layout
# is generated from it; these addresses never move (a project moves its
# slots by overriding them).
format = 2
id = "rp2040"
name = "RP2040"
wire_id = 0x0001
port = "self-boot"
gpio_count = 30
# SRAM0-5 (RP2040 datasheet section 2.6.2): 256 KiB striped, then the 4 KiB
# SRAM4 and SRAM5 banks.
ram = { at = 0x2000_0000, size = 0x4_2000 }

# The first flash map is the MCU's default.
[[flash_map]]
name = "rp2040-4m"
# Images run from flash in place at base.
xip = true
base = 0x1000_0000
bytes = 0x40_0000

[layout]
stage0 = { at = 0x1000_0000, size = 0x4000 }
bootcore_log = { faces = [0x1000_4000, 0x1000_5000], face_size = 0x1000 }
app_log = { faces = [0x1000_6000, 0x1000_7000], face_size = 0x1000 }

# Stage0 checks a boot core's signature under the key built into its own
# flash; its 16 KiB region holds the 256-byte boot2 too.
[stage0]
key = "flash"
region_bytes = 0x4000

# The ring oscillator stage0 starts on: nominal 6.5 MHz at reset, anywhere
# from 1.8 to 12 MHz (RP2040 datasheet section 2.17.1).
[[stage0.clock]]
source = "internal"
out_hz = 6_500_000

# A 12 MHz crystal through the system PLL: 12 MHz / 1 x 125 = 1500 MHz VCO,
# / 6 / 2 = 125 MHz (RP2040 datasheet section 2.18.2).
[[stage0.clock]]
source = "crystal"
in_hz = 12_000_000
out_hz = 125_000_000
pll = { refdiv = 1, fbdiv = 125, postdiv1 = 6, postdiv2 = 2 }

# The boot loader runs on stage0's setups: the ring oscillator as it runs,
# or a 12 MHz crystal through the system PLL to 125 MHz.
[[bootcore.clock]]
source = "internal"
out_hz = 6_500_000

[[bootcore.clock]]
source = "crystal"
in_hz = 12_000_000
out_hz = 125_000_000
pll = { refdiv = 1, fbdiv = 125, postdiv1 = 6, postdiv2 = 2 }

# The app runs on the same setups; from a crystal it also runs the USB PLL
# for the 48 MHz its USB link needs (RP2040 datasheet section 4.1): 12 MHz /
# 1 x 120 = 1440 MHz VCO, / 6 / 5 = 48 MHz. On the ring oscillator it has no
# USB clock.
[[app.clock]]
source = "internal"
out_hz = 6_500_000

[[app.clock]]
source = "crystal"
in_hz = 12_000_000
out_hz = 125_000_000
pll = { refdiv = 1, fbdiv = 125, postdiv1 = 6, postdiv2 = 2, usb_refdiv = 1, usb_fbdiv = 120, usb_postdiv1 = 6, usb_postdiv2 = 5 }

[[slot]]
image = "bootcore"
binding = "a"
header = "inline"
at = 0x1000_8000
size = 0x2_0000

[[slot]]
image = "bootcore"
binding = "b"
header = "inline"
at = 0x1002_8000
size = 0x2_0000

[[slot]]
image = "app"
binding = "a"
header = "inline"
at = 0x1004_8000
size = 0x10_0000

[[slot]]
image = "app"
binding = "b"
header = "inline"
at = 0x1014_8000
size = 0x10_0000

# What writes each image kind: the app's agent writes the app slot it is
# not running from and either boot core slot.
[writers]
app = ["app"]
bootcore = ["app"]

# What the node receives into: each slot above (header inline at its
# start).
[[slot_layout]]
target = "bootcore"
slot = "a"
start = 0x1000_8000
capacity = 0x1_FE00
header = "inline"

[[slot_layout]]
target = "bootcore"
slot = "b"
start = 0x1002_8000
capacity = 0x1_FE00
header = "inline"

[[slot_layout]]
target = "app"
slot = "a"
start = 0x1004_8000
capacity = 0xF_FE00
header = "inline"

[[slot_layout]]
target = "app"
slot = "b"
start = 0x1014_8000
capacity = 0xF_FE00
header = "inline"

# First write: rescue.uf2 copied to the boot ROM drive (BOOT held at plug-in).
[writer]
kind = "uf2-drive"
family = 0xE48B_FF56
sector = 0x1000
info_file = "INFO_UF2.TXT"
info_header = "UF2 Bootloader"
board_id = "RPI-RP2"

# Parts built from this package besides the app (sub: package folder).
[[part]]
name = "stage0"
sub = "stage0"

[[part]]
name = "bootcore"
sub = "bootcore"

# What the coordinator (hub) rules check on this MCU.
[coordinator]
pio_state_machines = 8
pio_uart_state_machines = 2
uart0_tx = [0, 12, 16, 28]
uart0_rx = [1, 13, 17, 29]

# The UART the UART links run on (src/links.rs): embassy-rp 0.10's PIO
# UART program, 8 PIO cycles a bit, its divider clk_sys / (8 * baud) in
# whole numbers (pio_programs/uart.rs, u32 division). The PIO runs on
# clk_sys, the core clock of the node's [[app.clock]] setup.
[link_uart]
clock = "app"
clocks_per_bit = 8
frac_bits = 0
# Bit rates the firmware runs the link at: a link's baud is one of these on both ends.
bauds = [115_200, 230_400]

# Bus speeds the firmware runs DAGON's I2C link at (template/src/board.rs
# i2c::Config.frequency): standard mode 100 kHz and fast mode 400 kHz (RP2040
# datasheet 4.3, I2C). A bus's speed_hz is one of these on every node on it.
[link_i2c]
hzs = [100_000, 400_000]

# Link kinds the firmware implements (src/kinds.rs LINK_KINDS).
[links]
up = ["usb-cdc"]
down = ["i2c", "uart"]

# The interfaces a topology link end names (RP2040 datasheet: USB, I2C0/1,
# UART0/1; pio-uart is the PIO UART program src/links.rs runs).

[[link_port]]
index = 0
name = "usb"
kind = "usb-cdc"

[[link_port]]
index = 1
name = "i2c0"
kind = "i2c"

[[link_port]]
index = 2
name = "i2c1"
kind = "i2c"

[[link_port]]
index = 3
name = "uart0"
kind = "uart"

[[link_port]]
index = 4
name = "uart1"
kind = "uart"

[[link_port]]
index = 5
name = "pio-uart"
kind = "uart"

# The links a node of this MCU relays over (src/relay.rs serves them): I2C0
# with the DAGON mailbox, a node at its seven-bit address, and the PIO UART
# to its one peer at the protocol's UART address. The ids are RELAY's link
# byte on the wire.
[[relay_link]]
id = 1
port = "i2c0"
addressing = "seven-bit"
max_payload = 256

[[relay_link]]
id = 2
port = "pio-uart"
addressing = { fixed = 0xFF }
max_payload = 1024

[watchdog]
kind = "rp-watchdog"
trial_ms = 8_000
confirmed_ms = 8_000
# The periods the watchdog can run: its 24-bit LOAD counts down twice a
# microsecond (RP2040 datasheet section 4.7, erratum RP2040-E1), so at most
# 0xFFFFFF / 2 us = 8,388 ms; embassy-rp 0.10 `Watchdog::feed` refuses
# longer. DAGON arms whole milliseconds, from 1.
range_ms = { min = 1, max = 8_388 }
# The boot core starts a pending image this many times before it rolls back.
trial_attempts = 3
# The lockup fuse's watchdog-reset flag: WATCHDOG REASON is cleared by a
# RUN-pin reset, so the MCU package keeps the flag itself. To be verified
# on the hardware.
flag = { unverified = "package" }

# Flash operations run from RAM with XIP off; the flash driver masks
# interrupts and pauses core 1 for each. DAGON erases one 4 KiB sector per
# operation over all of the flash map: the sector erase every candidate
# part has. The flash is the board's part (a board names it in [flash]);
# this default is the largest 4 KiB sector erase time (tSE max) of the
# candidate parts:
# - Winbond W25Q80JV, datasheet Revision C: tSE max 400 ms (the part
#   pico-sdk 2.1.1's boot2_w25q080 is written for)
# - Winbond W25X10CL, datasheet Revision G: tSE max 300 ms
# - Renesas (Adesto) AT25SF128A, DS-AT25SF/QF128A-168 Rev. Q: tSE max
#   300 ms at 85 C and at 105 C
# - Winbond W25Q16JV (the Raspberry Pi Pico's part, Pico datasheet
#   Release 21), datasheet Revision H: tSE max 400 ms
# - the flash of the Espressif ESP32-S3-WROOM-1/1U (datasheet v1.8, Table
#   6-8), ESP32-S3-WROOM-2 (v1.7, Table 6-7) and ESP32-S3-MINI-1/1U (v1.7,
#   Table 6-8) modules, which name no part: tSE max 500 ms
# ISSI IS25LP080D (pico-sdk's boot2_is25lp080) is not counted: its datasheet
# could not be obtained, and it is to be checked against this value.
# The value is the largest of these, 500 ms.
# Unverified until checked on hardware. The masking budget of DAGON's own
# code is to be measured on the board.
[execution]
masked_max_us = "unmeasured"
flash_op = "xip-off-masked"
erase_regions = [
    { start = 0x1000_0000, len = 0x40_0000, unit = 0x1000, unit_max_ms = { unverified = 500 } },
]

# Protection hardware: the Cortex-M0+ ARMv6-M MPU, 8 regions of at least
# 256 bytes (RP2040 datasheet section 2.4), read back from MPU_TYPE at boot.
# No fault status or address registers: faults are HardFaults attributed by
# the open call.
[isolation]
level = "mpu"
kind = "armv6m-mpu"
boot_extensions = true
ext_ram_max = 32_768

[isolation.capabilities]
mpu_regions = 8
min_region = 256
subregions_from = 256
critical_section = "primask"
reset_cleanup = "peripheral-reset"
background_privileged = true
unwind = "cortex-m-exception"
timer = "systick"
fault_address = false

# Boot record and lockup fuse: SRAM4, outside every image's RAM (the
# memory.x fragments `dagon gen` writes end at SRAM4). The boot ROM uses
# SRAM5 for boot2 and its stack.
[boot.record]
kind = "noinit-ram"
at = 0x2004_0000
size = 0x800
survives = "reset-random"
# The ring oscillator's RANDOMBIT (RP2040 datasheet section 2.17), sampled
# repeatedly; its min-entropy is to be measured on the board.
entropy = { source = "ring-osc", min_bits = "unmeasured" }
rings = [
    { writer = "stage0", at = 0x2004_0000, size = 0x200 },
    { writer = "bootcore", at = 0x2004_0200, size = 0x600 },
]
fuse = { cells = [
    { image = "bootcore", at = 0x2004_0800, size = 0x100 },
    { image = "app", at = 0x2004_0900, size = 0x100 },
] }

[[core]]
id = "core0"

[[core]]
id = "core1"

