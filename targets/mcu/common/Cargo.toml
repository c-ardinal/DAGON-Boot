[package]
name = "dagon-mcu-common"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false

# MCU-independent driver helpers of the DAGON MCU packages, host-testable:
#   cargo test --target <host triple>
# They depend on the port, protocol and format crates only; the node's
# services (agent, slot store, guard) are dagon-node's (../node).
[workspace]

[dependencies]
dagon-format = { path = "../../../crates/dagon-format" }
dagon-port = { path = "../../../crates/dagon-port" }
dagon-proto = { path = "../../../crates/dagon-proto" }
# SharedFlash: a lock taken without masking interrupts for the operation.
embassy-sync = "0.8"

[features]
# verify_time: a stage0 built to measure its signature check (both the
# records and, on a Cortex-M target, the SysTick cycle counter).
verify-time = []
# boot_time: a boot core built to measure its listen window or its boot
# decision.
boot-time = []

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }
# uart's tests run their futures on the simulator's executor.
dagon-sim = { path = "../../../crates/dagon-sim" }
