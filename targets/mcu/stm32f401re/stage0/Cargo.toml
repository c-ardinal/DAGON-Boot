[package]
name = "dagon-stm32f401re-stage0"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false

# Firmware clippy runs in CI (scripts/ci_crates.py --firmware-lint). The
# boot folder (DAGON_BOOT_CRATE) only names the board, so the lint uses the
# boot core's lint folder (a node without a board).
[package.metadata.dagon]
lint = { features = [""], env = { DAGON_BOOT_CRATE = "../bootcore/lint" } }

# Standalone: built for thumbv7em only, so it stays out of the host workspace.
# Its memory.x comes from dagon-mcu-stm32f401re (`image-stage0`).
[workspace]

[dependencies]
dagon-mcu-stm32f401re = { path = "..", default-features = false, features = ["image-stage0"] }
dagon-mcu-common = { path = "../../common" }
dagon-core = { path = "../../../../crates/dagon-core" }
dagon-ed25519 = { path = "../../../../crates/dagon-ed25519" }
dagon-format = { path = "../../../../crates/dagon-format" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1"

[features]
# Built to measure: stage0 times each signature check, shows the longest on
# the board's diagnostic output in tenths of a second and starts no core
# (lifecycle-events, "Stage0's clock and its verify time").
verify-time = ["dagon-mcu-common/verify-time"]

[build-dependencies]
# The diagnostic output from the board definition's boot LED and halt
# pattern, and the clock setup the definitions choose for the node.
dagon-topology = { path = "../../../../crates/dagon-topology" }
# Writes that clock setup for stage0 (clock.rs).
dagon-mcu-build = { path = "../../build" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
