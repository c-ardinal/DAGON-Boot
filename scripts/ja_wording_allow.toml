# Findings scripts/ja_wording.py leaves alone. An entry names one finding: path (a
# glob, as in ja_wording_scopes.toml), text (the words around it on the line), kind
# and word (as the report prints them), and reason (why the wording rule does not
# apply). Only a finding of that kind and word inside that text is left alone; any
# other finding on the line still fails. An entry missing a key fails the check.

