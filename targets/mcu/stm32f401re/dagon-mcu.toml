size = 0x400
window_eligible = true
dma_requests = [
    { signal = "ch1", controller = "dma1", stream = 0, channel = 2 },
    { signal = "ch2", controller = "dma1", stream = 3, channel = 2 },
    { signal = "up", controller = "dma1", stream = 6, channel = 2 },
    { signal = "ch3", controller = "dma1", stream = 7, channel = 2 },
]

[[peripheral]]
