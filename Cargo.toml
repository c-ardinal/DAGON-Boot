[workspace]
resolver = "2"
# f401-node: host-testable logic of the F401 app (the app itself is thumb-only).
members = ["crates/*", "targets/f401-node"]
exclude = ["targets/esp32s3-*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.0.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
