# DAGON MCU definition (format: targets/README.md). Slots come from
# partitions.csv; addresses are flash offsets (images are MMU-mapped).
format = 1
id = "esp32s3"
name = "ESP32-S3"
wire_id = 0x0003
port = "vendor-stage2"
gpio_count = 49
partitions = "partitions.csv"

[[flash_map]]
name = "esp32s3-16m"
# Addresses are flash offsets; images run MMU-mapped.
xip = false
base = 0x0
bytes = 0x100_0000

# Images run from either OTA partition (binding any; load names ota_0).
# Headers are detached into the dagon partition.
[[slot]]
image = "app"
binding = "any"
header = "detached"
partition = "ota_0"
header_partition = "dagon"
header_offset = 0x0

[[slot]]
image = "agent"
binding = "any"
header = "detached"
partition = "factory"
header_partition = "dagon"
header_offset = 0x2000

# First write: the bundled ESP-IDF 2nd stage, the partition table, the
# board's factory agent, slot A and otadata. usb_hint labels the candidates
# the writer reports; it never filters them.
[writer]
kind = "espflash"
chip = "esp32s3"
flash_size = "16mb"
table_at = 0x8000
bootloader = "vendor/bootloader.bin"
checksums = "vendor/SHA256SUMS"
usb_hint = { vid = 0x303A, pid = 0x1001 }

# Link kinds the firmware implements (src/links.rs LINK_KINDS).
[links]
up = ["uart", "usb-cdc"]

[watchdog]
kind = "rtc-wdt"
trial_ms = 4_000
confirmed_ms = 4_000
# The ESP-IDF 2nd stage with app rollback (vendor/sdkconfig.defaults) aborts
# an image left on trial at its next boot: one boot.
trial_attempts = 1

# The flash cache is off during an operation; the flash driver masks
# interrupts for each (handlers outside IRAM cannot run). DAGON erases at
# most one 64 KiB block per operation; 2 s is the SPI flash's 64 KiB block
# erase maximum (tBE2 of the quad SPI NOR parts the module carries).
[execution]
masked_max_us = 50
flash_op = "cache-off-masked"
erase_unit = 0x1_0000
erase_unit_max_ms = 2_000

# The last 4 KiB of the dagon partition: after the three header sectors,
# used by nothing.
[conformance]
scratch = { at = 0x71_F000, size = 0x1000 }

# Protection hardware: the Permission Control and World Controller (ESP32-S3
# TRM, "Permission Control" and "World Controller" chapters). DAGON does not
# program them, so the level is none: extensions run unguarded.
[isolation]
level = "none"
kind = "esp-pms"
boot_extensions = false
ext_ram_max = 32_768
root_protection = ["esp-secure-boot", "esp-flash-encryption"]
cache = "id-cache"

[isolation.capabilities]
worlds = 2
gdma_channels = 5
critical_section = "xtensa-level"
reset_cleanup = "peripheral-reset"
background_privileged = true
unwind = "xtensa-world"
timer = "timer-group"
fault_address = true

[[core]]
id = "cpu0"

[[core]]
id = "cpu1"

# Every register block (ESP32-S3 TRM, "System and Memory", peripheral
# address map). The Wi-Fi and Bluetooth MACs are bus masters DAGON never
# enables.
[[peripheral]]
id = "uart0"
base = 0x6000_0000
size = 0x1000
privileged_why = "shared"

[[peripheral]]
