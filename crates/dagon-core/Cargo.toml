[package]
name = "dagon-core"
edition.workspace = true
license.workspace = true
version = "0.1.0"

[dependencies]
dagon-format = { path = "../dagon-format" }
dagon-proto = { path = "../dagon-proto" }
dagon-port = { path = "../dagon-port" }

[dev-dependencies]
dagon-ed25519 = { path = "../dagon-ed25519", features = ["compact"] }
ed25519-compact = { version = "2.6", default-features = false }

[lints.rust]
# `cfg(kani)`: the proofs of stage0's decision (src/proofs.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
