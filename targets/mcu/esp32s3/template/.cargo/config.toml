[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# Literals next to the code: a function larger than l32r's reach (the Ed25519
# field arithmetic inlined at opt-level "s") otherwise fails to link.
rustflags = [
    "-C", "link-arg=-nostartfiles", "-C", "link-arg=-Tlinkall.x",
    "-C", "llvm-args=--mtext-section-literals",
]

[unstable]
build-std = ["core"]

[env]
# The folder `dagon gen` writes this node's MCU definition into
# (`mcu.toml`): the app builds from the definition every image of the
# node builds from, the project's overrides included.
DAGON_BOOT_CRATE = { value = "../../boot/{{node}}", relative = true, force = true }
