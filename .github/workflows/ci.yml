# Runs on every push and pull request: the checks that keep the places
# holding one fact in step (parity tests), plus the usual lint and test
# gates. No secrets; the token is read-only.
#
# The standalone Cargo packages with host tests (boards, MCUs, samples) are
# not listed here: scripts/ci_crates.py derives them from the repository.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The firmware packages embed a release key; tests use the public test key.
  DAGON_ALLOW_TEST_KEY: "1"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows too: path, home and process handling differ there
        # (crates/dagon-cli, dagon-topology, dagon-sign have per-OS tests).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test the workspace
        run: cargo test --workspace --locked
      - name: Generated catalogs up to date (docs/events.md, docs/ports.md)
        run: cargo test -p dagon-catalog --test docs --locked
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  plan:
    name: standalone packages
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
      lints: ${{ steps.list.outputs.lints }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: list
        run: |
          echo "dirs=$(python scripts/ci_crates.py --json)" >> "$GITHUB_OUTPUT"
          echo "lints=$(python scripts/ci_crates.py --firmware-lint)" >> "$GITHUB_OUTPUT"

  standalone:
    name: ${{ matrix.dir }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.plan.outputs.dirs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Host tests of firmware packages: the host target, no firmware features
      # (the READMEs give the same command). +stable skips a package's own
      # toolchain file (the ESP one).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ matrix.dir }}
      - name: Format
        env:
          DIR: ${{ matrix.dir }}
        run: cargo +stable fmt --check --manifest-path "$DIR/Cargo.toml"
      - name: Clippy
        # The library; a package without one is linted whole.
        env:
          DIR: ${{ matrix.dir }}
        run: |
          host="$(rustc +stable -vV | sed -n 's/^host: //p')"
          if cargo metadata --no-deps --format-version 1 --manifest-path "$DIR/Cargo.toml" \
              | jq -e 'any(.packages[].targets[]; .kind | index("lib"))' > /dev/null; then
            scope=--lib
          else
            scope=--all-targets
          fi
          cargo +stable clippy --no-default-features $scope --target "$host" \
            --manifest-path "$DIR/Cargo.toml" -- -D warnings
      - name: Test on the host
        env:
          DIR: ${{ matrix.dir }}
        run: |
          host="$(rustc +stable -vV | sed -n 's/^host: //p')"
          cargo +stable test --no-default-features --target "$host" \
            --manifest-path "$DIR/Cargo.toml"

  # Clippy over the MCU packages' firmware code (node, relay, the ESP32-S3
  # link task), which the host-only clippy above does not compile: the
  # masking rule of the execution model is a clippy rule
  # (targets/mcu/clippy.toml). The runs come from each package's
  # `[package.metadata.dagon.lint]` (scripts/ci_crates.py --firmware-lint).
  firmware-lint:
    name: clippy ${{ matrix.lint.dir }} [${{ matrix.lint.features }}]
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lint: ${{ fromJSON(needs.plan.outputs.lints) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The ESP32-S3 package builds with Espressif's Xtensa toolchain (its
      # rust-toolchain.toml names `esp`).
      - name: Xtensa toolchain
        if: matrix.lint.toolchain == 'esp'
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          default: false
          buildtargets: esp32s3
          ldproxy: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ matrix.lint.dir }}
      - name: Clippy (firmware target)
        env:
          DIR: ${{ matrix.lint.dir }}
          TARGET: ${{ matrix.lint.target }}
          FEATURES: ${{ matrix.lint.features }}
        # In the package's folder: its rust-toolchain.toml and
        # .cargo/config.toml (the repository's, or its own) apply.
        run: |
          cd "$DIR"
          args=(clippy --release)
          if [ -n "$TARGET" ]; then
            rustup target add "$TARGET"
            args+=(--target "$TARGET")
          fi
          if [ -n "$FEATURES" ]; then
            args+=(--features "$FEATURES")
          fi
          cargo "${args[@]}" -- -D warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The page's WebAssembly is built by wasm-pack (npm test builds it first).
      - run: npm install --global wasm-pack@0.15.1
      - name: Tests (vitest)
        run: npm test
      - name: Types (svelte-check)
        run: npx svelte-check --tsconfig ./tsconfig.json

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Page up to date
        run: python scripts/page.py check
      - name: Script tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Plugin hook tests
        # The tests make real commits.
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: node --test plugin/hooks/guard.test.mjs
