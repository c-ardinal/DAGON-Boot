[package]
name = "dagon-mcu-rp2040"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false
build = "build.rs"

# DAGON MCU package for the RP2040. Without features it is host-testable:
#   cargo test --no-default-features --target <host triple>
[workspace]

[package.metadata.dagon]
mcu = "rp2040"
# Firmware clippy runs in CI (scripts/ci_crates.py --firmware-lint); the
# defaults are the relay.
lint = { target = "thumbv6m-none-eabi", features = [""] }

[features]
# The relay by default: a generated node names this package without
# features (RP2040 nodes relay).
default = ["relay"]
# The embassy-rp parts: flash port, watchdog guard, slot store, link
# drivers, sub-MCU control lines, and the verifying key from DAGON_PUBKEY.
hal = ["dep:embassy-rp", "dep:embassy-time", "dep:dagon-ed25519", "dep:static_cell", "dep:portable-atomic", "dep:embedded-io-async"]
# DAGON over USB CDC (device, frame link, agent serving loop) and DAGON's
# high-priority executor (SWI_IRQ_0).
usb = ["hal", "embassy-rp?/rt", "embassy-rp?/unstable-pac", "dep:embassy-usb", "dep:embassy-executor"]
# The relay (dagon-relay) on this MCU's PC link and node links, with the
# ROM recovery path.
relay = ["usb"]
# The final binary's memory.x comes from this package: an APP slot body
# (slot A, or B with `slot-b`) unless it is a boot image; the boot core
# links for boot core slot A, or B with `slot-b`.
slot-b = []
image-stage0 = []
image-bootcore = []
# A panic blinks the last step code on the LED named by `arm::led::select`.
diag-panic = []

[dependencies]
dagon-core = { path = "../../../crates/dagon-core" }
dagon-format = { path = "../../../crates/dagon-format" }
dagon-port = { path = "../../../crates/dagon-port" }
dagon-proto = { path = "../../../crates/dagon-proto" }
dagon-relay = { path = "../../../crates/dagon-relay" }
dagon-mcu-common = { path = "../common" }
# The session, and the boot core's receiving around it (boot_receive, host-tested).
dagon-agent = { path = "../../../crates/dagon-agent" }
embassy-futures = "0.1"
# The verifier the node's agent checks images with.
dagon-ed25519 = { path = "../../../crates/dagon-ed25519", features = ["compact"], optional = true }
dagon-events = { path = "../../../crates/dagon-events" }
# boot2-none: stage0 holds boot2; every other image starts after a header.
embassy-rp = { version = "0.10.0", default-features = false, features = ["rp2040", "boot2-none"], optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-usb = { version = "0.6.0", optional = true }
# The boot core's UART link (boot_links).
embedded-io-async = { version = "0.7", optional = true }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-interrupt"], optional = true }
heapless = "0.9"
static_cell = { version = "2", optional = true }
# static_cell needs CAS, which thumbv6m only has through a critical section.
portable-atomic = { version = "1", features = ["critical-section"], optional = true }

[build-dependencies]
dagon-mcu-build = { path = "../build" }
# build.rs: the inline header's size (memory.x puts the body after it).
dagon-format = { path = "../../../crates/dagon-format" }

[dev-dependencies]
# tests/bootcore_receive.rs: the boot core's session over the simulator's
# store, on the link kinds the definition lets the boot core receive on.
dagon-events = { path = "../../../crates/dagon-events" }
dagon-ed25519 = { path = "../../../crates/dagon-ed25519", features = ["compact"] }
ed25519-compact = { version = "2.6", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7"

# The relay firmware scripts/relay_ram.py builds and measures: what a
# generated node adds to this package (template/Cargo.toml.tpl).
[[example]]
name = "relay"
required-features = ["relay"]

# The host tests' simulator and the MCU definitions they read (both std),
# kept out of the firmware examples (an example builds with the
# dev-dependencies: dagon-topology's serde_json pulls std into thumbv6m).
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
dagon-sim = { path = "../../../crates/dagon-sim" }
dagon-topology = { path = "../../../crates/dagon-topology" }

[target.'cfg(target_os = "none")'.dev-dependencies]
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
cortex-m-rt = "0.7"
panic-halt = "1"
