# DAGON board definition (format: targets/README.md).
# No default_link: this board is the coordinator.
format = 1
id = "waveshare-rp2040-touch-lcd-1.28"
product = "Waveshare RP2040-Touch-LCD-1.28"
mcu = "rp2040"
flash_bytes = 0x40_0000
i2c_target = true
drawing = "round-lcd"
# The board a node naming only its MCU is checked against.
default = true

# label: the printed header name, left out until confirmed on the board.
header = [
    { pin = "GPIO16" },
    { pin = "GPIO17" },
    { pin = "GPIO18" },
    { pin = "GPIO26" },
    { pin = "GPIO27" },
    { pin = "GPIO28" },
]

# I2C1 is used on the board itself (GPIO6/7).
i2c = [{ controller = "i2c0", sda = "GPIO16", scl = "GPIO17" }]

# As the 親機: a new I2C bus is i2c0 on GPIO16/17 and a new PIO UART link
# GPIO26 (TX) / GPIO27 (RX), DAGON's link buses below.
[coordinator]
i2c = { controller = "i2c0", sda = 16, scl = 17 }
pio_uart = { tx = 26, rx = 27 }

# The boot stage's LED is the display backlight, blinking at 1 Hz when
# nothing can start.
[boot]
led = "GPIO25"
halt = { pattern = "blink", period_ms = 1000 }

[[pin]]
pin = "GPIO25"
name = "backlight"
boot = true

[[pin]]
pin = "GPIO9"
name = "lcd_cs"

[[pin]]
pin = "GPIO8"
name = "lcd_dc"

[[pin]]
pin = "GPIO13"
name = "lcd_rst"

# Touch controller reset, held high.
[[pin]]
pin = "GPIO22"
name = "touch_rst"

# Reset (open drain) and BOOT0 of an STM32 子機: its ROM recovery path.
[[pin]]
pin = "GPIO18"
name = "child_nrst"

[[pin]]
pin = "GPIO28"
name = "child_boot0"

[[bus]]
id = "lcd"
kind = "spi"
controller = "spi1"
sck = "GPIO10"
mosi = "GPIO11"
hz = 20_000_000

# DAGON's links to 子機.
[[bus]]
id = "child-i2c"
kind = "i2c"
controller = "i2c0"
sda = "GPIO16"
scl = "GPIO17"
hz = 400_000
dagon = true

[[bus]]
id = "child-uart"
kind = "uart"
controller = "pio0"
tx = "GPIO26"
rx = "GPIO27"
baud = 115_200
dagon = true
