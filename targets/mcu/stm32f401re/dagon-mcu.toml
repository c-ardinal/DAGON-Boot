    { signal = "ch3", controller = "dma1", stream = 0, channel = 6 },
    { signal = "up", controller = "dma1", stream = 0, channel = 6 },
    { signal = "ch4", controller = "dma1", stream = 1, channel = 6 },
    { signal = "trig", controller = "dma1", stream = 1, channel = 6 },
    { signal = "ch1", controller = "dma1", stream = 2, channel = 6 },
    { signal = "ch4", controller = "dma1", stream = 3, channel = 6 },
    { signal = "trig", controller = "dma1", stream = 3, channel = 6 },
    { signal = "ch2", controller = "dma1", stream = 4, channel = 6 },
    { signal = "up", controller = "dma1", stream = 6, channel = 6 },
]

