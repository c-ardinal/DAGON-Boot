[package]
name = "dagon-rp2040-bootcore"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false

# The boot core library a node's boot crate links: `dagon gen` renders
# template/ into boot/<id>/ of a project for every RP2040 node (`bootcore`).
# Firmware clippy runs in CI (scripts/ci_crates.py --firmware-lint): the
# masking rule of the execution model applies to the boot images too.
# DAGON_TARGET_TAG names which images this boot stage accepts and
# DAGON_BOOT_CRATE the node's boot folder; neither changes the code, so
# the lint uses a neutral tag and the boot folder in lint/.
[package.metadata.dagon]
bootcore = "rp2040"
lint = { features = ["", "slot-b", "listen-time", "decide-time"], env = { DAGON_TARGET_TAG = "lint", DAGON_BOOT_CRATE = "./lint" } }

# Standalone: built for thumbv6m only, so it stays out of the host workspace.
# Its memory.x and verifying key come from dagon-mcu-rp2040.
[workspace]

[features]
# Backlight patterns at each step and on panic (bring-up diagnostics).
diag = ["dagon-mcu-rp2040/diag-panic"]
# Test build that fails its own check, so its trial always goes back to the
# confirmed core.
no-confirm = []
# Linked for boot core slot B (a release carries a core for each slot).
slot-b = ["dagon-mcu-rp2040/slot-b"]
# Measuring builds, for a probe to read (dagon-mcu-common's boot_time):
# once the listen window has ended without a STAY, keeps the microseconds
# since the boot core's start in DAGON_LISTEN_US; once the boot decision is
# taken, the microseconds it took in DAGON_DECIDE_US. Either stays there
# (watchdog fed) instead of booting.
listen-time = ["dagon-mcu-common/boot-time"]
decide-time = ["dagon-mcu-common/boot-time"]

[dependencies]
# `usb`: update and recovery mode serve the session on the app's USB device.
dagon-mcu-rp2040 = { path = "..", default-features = false, features = ["usb", "image-bootcore"] }
# The update session (the boot core writer) and the loop that serves it.
dagon-agent = { path = "../../../../crates/dagon-agent" }
dagon-mcu-common = { path = "../../common" }
dagon-proto = { path = "../../../../crates/dagon-proto" }
# Byte-loop memory copy and fill keep the image small.
dagon-boot = { path = "../../../../crates/dagon-boot", features = ["small-mem"] }
dagon-core = { path = "../../../../crates/dagon-core" }
dagon-ed25519 = { path = "../../../../crates/dagon-ed25519" }
dagon-events = { path = "../../../../crates/dagon-events" }
dagon-format = { path = "../../../../crates/dagon-format" }
dagon-port = { path = "../../../../crates/dagon-port" }
embassy-rp = { version = "0.10.0", features = ["rp2040", "critical-section-impl", "boot2-none", "unstable-pac", "time-driver"] }
# No executor polls the boot core's futures (boot_receive's port uses its
# own waker): the generic timer queue takes any waker, the integrated one
# panics on it (image_check.py). That port's wakers are all equal, so they
# share one entry; 8 is the smallest size.
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
# Update and recovery mode: the links' futures polled together between
# sleeps (join).
embassy-futures = "0.1"
static_cell = "2"
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1"

[build-dependencies]
# The board facts and the linked extensions' check from the node's boot folder.
dagon-topology = { path = "../../../../crates/dagon-topology" }
# The node's MCU definition in its boot folder (its listen window).
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
