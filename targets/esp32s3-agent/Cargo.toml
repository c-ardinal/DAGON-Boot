[package]
name = "dagon-esp32s3-factory"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# DAGON's own factory firmware for the M5StopWatch: the recovery agent in the
# factory partition, built on dagon-mcu-esp32s3 and dagon-board-m5stopwatch.
# Standalone workspace, built with the espup Xtensa toolchain.
[workspace]

[features]
# ENTER_ROM method 2 through the board's power manager (unconfirmed values).
pmic-download = ["dagon-board-m5stopwatch/pmic-download"]

[[bin]]
name = "factory"
test = false

[dependencies]
dagon-board-m5stopwatch = { path = "../boards/m5stopwatch" }
dagon-mcu-esp32s3 = { path = "../mcu/esp32s3" }
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy"] }
embassy-executor = "0.10"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

# Size-tuned Ed25519: at "s" the field arithmetic is inlined into one
# function of several hundred KiB.
[profile.release.package.ed25519-compact]
opt-level = "z"

[profile.dev]
opt-level = "s"

# esp-bootloader-esp-idf computes `ota_seq - 1` for any counted seq, 0 included
# (otadata written by older tools); release builds already wrap.
[profile.dev.package.esp-bootloader-esp-idf]
overflow-checks = false
