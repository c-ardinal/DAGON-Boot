# Generated by `dagon gen`: how node {{node}}'s boot core builds. Do not edit.
[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
rustflags = ["-C", "link-arg=--nmagic", "-C", "link-arg=-Tlink.x"]

[env]
# This folder: the node, its board and its trusted extensions (Cargo.toml).
DAGON_BOOT_CRATE = { value = ".", relative = true }
# The node's tag: the boot core accepts only images tagged with it.
DAGON_TARGET_TAG = "{{tag}}"
