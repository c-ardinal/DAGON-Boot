[package]
name = "dagon-events"
edition.workspace = true
license.workspace = true
version = "0.1.0"
description = "DAGON lifecycle events: state machines whose transitions emit events, extensions, ports and the published event state"

[dependencies]
dagon-format = { path = "../dagon-format" }
embassy-sync = "0.8"
# The bus port speaks to any I2C driver through its traits.
embedded-hal = "1"

[dev-dependencies]
critical-section = { version = "1.1", features = ["std"] }
