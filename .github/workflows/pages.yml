# Builds the public site and publishes it to GitHub Pages:
#   <Pages URL>/doc/   the documentation (Starlight), with the Rust API at doc/api/
#   <Pages URL>/demo/  DAGON Console on the simulator (no files, devices or keys)
#   <Pages URL>/llms.txt
# It runs only when started by hand from the Actions tab. No secrets: the demo
# verifies its prepared release with the public RFC 8032 test key.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            web/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Reference pages up to date
        run: python site/scripts/gen.py --check
      - name: Documentation
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          npm ci
          npm run build
      - name: Console demo
        working-directory: web
        run: |
          npm ci
          npm install --global wasm-pack@0.15.1
          npm run build:demo -- --outDir ../site/dist/demo --emptyOutDir
      - name: Rust API
        run: |
          cargo doc --workspace --no-deps --locked
          cp -r target/doc site/dist/doc/api
      - name: Root page and llms.txt
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cp site/root/index.html site/dist/index.html
          python site/scripts/llms.py "$SITE_URL" site/dist/llms.txt
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
