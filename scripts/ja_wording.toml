# The kana after a stem, per conjugation class (school grammar): godan rows give
# every ending of the row plus the euphonic forms (書いて, 使って, 読んで).
[conjugation]
godan_ka = "[かきくけこい]"
godan_ga = "[がぎぐげごい]"
godan_sa = "[さしすせそ]"
godan_ta = "[たちつてとっ]"
godan_ba = "[ばびぶべぼん]"
godan_ma = "[まみむめもん]"
godan_ra = "[らりるれろっ]"
godan_wa = "[わいうえおっ]"
# A stem that ends in kana (確かめ) starts every form and its noun use (答え).
ichidan = ""
# A one-kanji stem (出る, 見る) needs one of its endings after it, or 出力 would match.
ichidan_kanji = "(?=[るれよろたてなまずさそら])"
kuru = "(?=[るれよいたてなまずさそら])"
adjective = "[いくかけさそ]"
