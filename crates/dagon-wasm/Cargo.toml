[package]
name = "dagon-wasm"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dagon-format = { path = "../dagon-format" }
dagon-host = { path = "../dagon-host", features = ["defs"] }
# The simulated desk (`sim` feature): test and development builds only.
dagon-sim = { path = "../dagon-sim", optional = true }
dagon-port = { path = "../dagon-port", optional = true }
dagon-proto = { path = "../dagon-proto" }
dagon-topology = { path = "../dagon-topology" }
yaml_serde = "0.10"
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"

[features]
# SimDesk: the simulated desk hub as a byte link (tests, `npm run dev`'s `?sim`).
sim = ["dep:dagon-sim", "dep:dagon-port"]

[dev-dependencies]
dagon-sign = { path = "../dagon-sign" }
ed25519-compact = { version = "2.6", default-features = false }
