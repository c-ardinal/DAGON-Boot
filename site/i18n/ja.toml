# The Japanese of what gen.py copies from English sources, keyed by that English. gen.py fails on a missing or unused key.

"A layout of this format, written whole." = "この形式の配置ファイル。全体をまとめて書きます。"
"A device on a board bus: `id` (`a-z 0-9 - _`), `bus`, `addr`, `max_transfer` (required: the most data bytes it takes in one transfer, from its datasheet; the bus port and boot programs keep to it), `regs = [{ name, reg }]` (its registers by name, `a-z 0-9 _`), `writable` (registers anything outside DAGON may write: numbers or names of `regs`)." = "ボードのバス上のデバイス: `id`（`a-z 0-9 - _`）、`bus`、`addr`、`max_transfer`（必須: 1回の転送で受け取れるデータの最大バイト数。データシートから取ります。バスのポートとブートプログラムはこれを守ります）、`regs = [{ name, reg }]`（名前付きのレジスタ、`a-z 0-9 _`）、`writable`（DAGONの外のものが書いてよいレジスタ: `regs`の番号か名前）。"
"A folder with a dagon.toml." = "dagon.tomlのあるフォルダ。"
"A job's state, stage, progress, log lines, question and result." = "作業の状態、段階、進み具合、ログの行、質問、結果。"
"A job; the model's questions go to the page." = "作業。モデルからの質問はページに届きます。"
"A kept package's bytes, once they verify." = "残してあるパッケージのバイト列。検証が通ったときだけ返します。"
"A name looked up on PATH, or a path." = "PATHで探す名前、またはパス。"
"A release of the project's out/release by name, once it verifies with the project's key." = "プロジェクトのout/releaseにあるリリースを名前で返します。プロジェクトの鍵で検証が通ったときだけです。"
"An environment variable that overrides `model`, if set." = "`model`を上書きする環境変数（設定されていれば）。"
"Before the user text on stdin." = "stdinで、ユーザーの文の前に渡します。"
"Board `[[bus]]` ids, reached through the bus service." = "ボードの`[[bus]]`のid。バスのサービスを通して使います。"
"Board `[[peripheral]]` ids: windows onto window-eligible blocks." = "ボードの`[[peripheral]]`のid: ウィンドウにできるブロックへのウィンドウ。"
"Board `[[pin]]` names, reached through the pin service." = "ボードの`[[pin]]`の名前。ピンのサービスを通して使います。"
"Board id used in `nodes[].board`." = "`nodes[].board`で使うボードのid。"
"Board names for MCU blocks extensions may declare: `id`, `mcu` (the MCU `[[peripheral]]` id; never the controller of a `dagon = true` bus)." = "拡張が宣言できるマイコンのブロックの、ボードでの名前: `id`、`mcu`（マイコンの`[[peripheral]]`のid。`dagon = true`のバスのコントローラは指定できません）。"
"Board-independent DAGON logic over the port contract: the state log (fold, load, append, compaction), the kind S boot decision (verify, trial, rollback), the boot core A/B rules of a stage0 MCU and build-time key helpers." = "ポートの取り決めの上で動く、ボードに依存しないDAGONのロジック: 状態ログ（畳み込み、読み込み、追記、コンパクション）、kind Sのブートの判断（検証、試行、ロールバック）、stage0のあるマイコンのブートローダのA/Bのルール、ビルド時の鍵の補助。"
"Browser build of the shared Rust rules: MCU and board definitions, topology check and compile, release verification, HELLO payloads and version text. Each export is a thin wrapper so the page and the CLI apply the same code." = "共有するRustのルールのブラウザ向けビルド: マイコンとボードの定義、構成の確認とコンパイル、リリースの検証、HELLOのペイロードとバージョンの文字列。公開する関数はどれも薄いラッパーで、ページとCLIが同じコードを使います。"
"Builds a release from every signed image, each of the version its node's crate gave it (`version`, if given, must be every image's)." = "すべての署名付きイメージからリリースを作ります。各イメージのバージョンは、ノードのcrateが与えたものです（`version`を与えるなら、すべてのイメージのバージョンと同じでなければなりません）。"
"Builds the applications of `nodes` (all when left out) as a job; the answer lists each built slot and its size." = "`nodes`（省くとすべて）のアプリケーションを作業としてビルドします。答えは、ビルドした各スロットとその大きさを挙げます。"
"Byte layouts shared by every DAGON component: image header, manifest, release bundle (`.dgb`), state log, topology canonical binary, plus CRC-32, SHA-256 and Ed25519 verification. All multi-byte fields are little-endian." = "DAGONのすべての部品が共有するバイトのレイアウト: イメージのヘッダ、マニフェスト、リリースのバンドル（`.dgb`）、状態ログ、構成の正規のバイナリ、そしてCRC-32、SHA-256、Ed25519の検証。複数バイトの欄はすべてリトルエンディアンです。"
"Bytes for the simulated hub's USB port." = "模擬の親機のUSBポートに渡すバイト列。"
"DAGON Boot command line tool" = "DAGON Bootのコマンドラインツール"
"DAGON agent: embedded in an application, it answers HELLO/STATUS/VERSION, receives images into the inactive slot, switches the boot target and confirms." = "DAGONのエージェント: アプリケーションに組み込まれ、HELLO/STATUS/VERSIONに答え、イメージを使っていないスロットに受け取り、ブートの対象を切り替えて確定します。"
"DAGON conformance tests: the 12 normal-path checks a port must pass." = "DAGONの適合試験: ポートが通らなければならない、正常な経路の12の検査。"
"DAGON extension manifests (dagon-extension.toml), their validation against the port and event catalogs and the node's definitions, the protection-kind map generators, and the files dagon gen writes from them" = "DAGONの拡張のマニフェスト（dagon-extension.toml）、ポートとイベントのカタログとノードの定義に照らした検証、保護の種類ごとのマップの生成器、そこからdagon genが書き出すファイル"
"DAGON lifecycle events: state machines whose transitions emit events, extensions, ports and the published event state" = "DAGONのライフサイクルイベント: 遷移がイベントを出す状態機械、拡張、ポート、公開するイベントの状態"
"DAGON link v1: frame format (shared by USB CDC, UART and I2C), the command set, status codes, request/response payloads and the I2C mailbox state." = "DAGONのリンクv1: フレームの形式（USB CDC、UART、I2Cで共通）、コマンドの集合、ステータスコード、リクエストとレスポンスのペイロード、I2Cのメールボックスの状態。"
"DAGON parts built from this package for a first write: `name`, `sub` (folder in the package), `bin`." = "最初の書き込みのために、この定義のフォルダからビルドするDAGONの部品: `name`、`sub`（定義のフォルダの中のフォルダ）、`bin`。"
"DAGON simulator: deterministic stand-ins for the hardware so the host tools, the browser UI and tests have a partner without boards." = "DAGONのシミュレータ: ハードウェアの決定的な代役です。ホストのツール、ブラウザのUI、テストは、ボードがなくても相手を得られます。"
"Dagon.toml in a folder that has a 構成 but none, for that YAML (`yaml`, or the folder's only one); key pair in ~/.dagon/keys/<folder> when none. Then opens it." = "構成はあるがdagon.tomlが無いフォルダに、そのYAML（`yaml`、またはフォルダの唯一のもの）のためのdagon.tomlを作ります。鍵の組が無ければ~/.dagon/keys/<folder> に作ります。その後で開きます。"
"Decision points asked in one of the listed layers; a trusted extension answers none." = "一覧のレイヤーのどれかで尋ねられる判断点。信頼された拡張はどれにも答えません。"
"Definition format number (`1`; left out means 1). A dagon that does not read the number refuses the file (site/src/content/docs/explanation/versioning.md)." = "定義の形式番号（`1`。省くと1です）。その番号を読まないdagonは、ファイルを受け付けません（site/src/content/docs/explanation/versioning.md）。"
"Device layers: `max_run_us` 1 to the decision bound (50 ms) for an untrusted extension and for every one that observes events (each handler call is timed against it); untrusted only: `stack_bytes` at least 256, `text_bytes` above 0 (the `[limits]` keys below)." = "デバイスのレイヤー: 信頼されていない拡張と、イベントを観測するすべての拡張では、`max_run_us`は1から判断の上限（50 ms）まで（ハンドラの呼び出しごとにこれに照らして測ります）。信頼されていないものだけ: `stack_bytes`は256以上、`text_bytes`は0より大きいこと（下の`[limits]`のキー）。"
"Display name (`STM32F401RE`)." = "表示名（`STM32F401RE`）。"
"ESP-IDF partition table CSV in the package (rows need explicit offset and size)." = "定義のフォルダの中のESP-IDFのパーティションテーブルのCSV（行にはオフセットと大きさの明示が必要です）。"
"Environment variables passed on besides [`BASE_ENV`] (names only)." = "[`BASE_ENV`]のほかに渡す環境変数（名前だけ）。"
"Every DAGON state machine's catalog in one registry, and the generated Events and Ports pages of the documentation" = "DAGONのすべての状態機械のカタログを1つにまとめた登録簿と、文書のイベントとポートの生成ページ"
"Every processor core, `id`; DAGON runs on the first." = "プロセッサのコアごと、`id`。DAGONは最初のコアで動きます。"
"Every register block: `id`, `base`, `size`, `window_eligible` (an extension may get it as a window), `bus_master` (it can write memory), `privileged_why` (one or a list of `dma`, `flash`, `watchdog`, `clock`, `reset`, `irq-routing`, `pinmux`, `power`, `rom`, `core-control`, `protection`, `shared`), `dma = { streams, channels }` (a DMA controller, a bus master: its streams, each selecting one of `channels` requests), `dma_requests = [{ signal, controller, stream, channel }]` (the block's rows of the MCU's DMA request mapping table: `signal` `a-z 0-9` such as `tx`, `rx`, `ch1`, `up`; one cell serves one block). Board packages and MCU templates take DMA streams from these (first row of the request on a free stream)." = "レジスタブロックごと: `id`、`base`、`size`、`window_eligible`（拡張がウィンドウとして得られる）、`bus_master`（メモリに書ける）、`privileged_why`（`dma`、`flash`、`watchdog`、`clock`、`reset`、`irq-routing`、`pinmux`、`power`、`rom`、`core-control`、`protection`、`shared`の1つか一覧）、`dma = { streams, channels }`（DMAコントローラ、つまりバスマスタ: そのストリーム。それぞれ`channels`個の要求の1つを選びます）、`dma_requests = [{ signal, controller, stream, channel }]`（マイコンのDMA要求の割り当て表のうち、このブロックの行: `signal`は`a-z 0-9`で`tx`、`rx`、`ch1`、`up`など。1つのセルは1つのブロックに使います）。ボードの定義とマイコンのテンプレートは、ここからDMAのストリームを取ります（取られていないストリームの、その要求の最初の行）。"
"Executable model of DAGON's retained and persistent formats under fault injection" = "障害注入の下での、DAGONの保持と永続の形式の実行可能なモデル"
"First-write tool: `kind` and its parameters (below)." = "最初の書き込みのツール: `kind`とそのパラメータ（下記）。"
"Flash size (must hold one of the MCU's flash maps)." = "フラッシュの大きさ（マイコンのフラッシュマップのどれかが収まること）。"
"GPIO0..n-1 checked for nodes without a board; 0 when pins are named by port." = "ボードの無いノードで確かめるGPIO0..n-1。ピンをポートで名付けるときは0。"
"Hardware facts of the execution model (site/src/content/docs/en/explanation/lifecycle-events.md, \"Execution model\"): `masked_max_us` (longest DAGON's own code masks interrupts, 1..=1000), `flash_op` (what an erase or program stops: `fetch-stall`, `xip-off-masked`, `cache-off-masked`), `erase_unit` (largest unit DAGON erases in one operation, a power of two), `erase_unit_max_ms` (that erase's datasheet maximum; below `watchdog.confirmed_ms`). A fact is a number checked against its source (cite it in a comment), `{ unverified = N }` or `\"unmeasured\"` (no value; not for `erase_unit_max_ms`)." = "実行モデルのハードウェアの事実（site/src/content/docs/en/explanation/lifecycle-events.mdの「Execution model」）: `masked_max_us`（DAGON自身のコードが割り込みを止める最長の時間、1..=1000）、`flash_op`（消去や書き込みが何を止めるか: `fetch-stall`、`xip-off-masked`、`cache-off-masked`）、`erase_unit`（DAGONが1回の操作で消去する最大の単位、2のべき乗）、`erase_unit_max_ms`（その消去のデータシートの最大値。`watchdog.confirmed_ms`より小さいこと）。事実とは、出所に照らして確かめた数値（コメントで出典を示します）、`{ unverified = N }`、または`\"unmeasured\"`（値が無い。`erase_unit_max_ms`には使えません）です。"
"Host-side procedures shared by the CLI and the browser: discover, status, topology push, apply, rollback, confirm, recover." = "CLIとブラウザが共有するホスト側の手順: 検出、状態、構成の送信、適用、ロールバック、確定、復旧。"
"How DAGON keeps extensions away from itself (below). Left out: `kind = \"none\"`, `level = \"none\"`." = "DAGONが拡張を自分から遠ざける方法（下記）。省くと`kind = \"none\"`、`level = \"none\"`です。"
"How DAGON reaches the agent this way: one of the transport kinds and its keys." = "このつなぎ方でDAGONがエージェントに届く方法: 転送の種類の1つとそのキー。"
"How a node board is wired unless the topology says otherwise: `kind` (`i2c`, `uart`, `can`, `ethernet`), `iface` (`hw-uart0`, `pio-uart`), `addr`, `baud`, `control` (`full`, `cooperative`), `rom_entry` (`force-download-boot`, `m5pm1`, `stm32-i2c-rom`). Left out for the coordinator." = "構成が別に指定しないときの、ノードのボードの配線: `kind`（`i2c`、`uart`、`can`、`ethernet`）、`iface`（`hw-uart0`、`pio-uart`）、`addr`、`baud`、`control`（`full`、`cooperative`）、`rom_entry`（`force-download-boot`、`m5pm1`、`stm32-i2c-rom`）。親機では省きます。"
"The I2C bus speeds the MCU package's firmware runs DAGON's I2C link at, as controller or target: `hzs`. The topology check (V-20) refuses a bus `speed_hz` that any node's list does not name, and DAGON Console offers only the speeds every node on the bus names. Required on an MCU whose `[links]` has `i2c`: without it, every I2C bus that MCU's firmware is on is refused, since no speed on it is known to work." = "マイコンの定義のファームウェアが、コントローラとしてもターゲットとしても、DAGONのI2Cリンクを動かすバスの速度の一覧: `hzs`。構成の確認（V-20）は、バス上のどれかのノードの一覧に無いバスの`speed_hz`を受け付けません。DAGON Consoleはバス上のすべてのノードの一覧にある速さだけを選べるようにします。`[links]`に`i2c`があるマイコンでは必須です。これが無いと、そのマイコンのファームウェアがつながるI2Cバスはすべて受け付けません。動くと分かっている速度が無いためです。"
"How the UART the MCU package runs DAGON's UART links on makes a bit rate, as its HAL computes it: `clock_hz` divided by `clocks_per_bit` times a divider with `frac_bits` fraction bits, rounded down. `bauds` lists the bit rates the firmware runs its link at; the topology check (V-26) refuses a link `baud` that either end's list does not name or that either end makes more than 2 % off, and DAGON Console offers only the speeds both ends name. Required on an MCU whose `[links]` has `uart`: without it, every UART link that MCU's firmware runs is refused, since no speed on it is known to work." = "マイコンの定義のコードがDAGONのUARTリンクを動かすUARTのビットレートの作り方。HALが計算するとおりです: `clock_hz`を`clocks_per_bit`と、`frac_bits`ビットの小数部を持つ分周比の積で割り、切り捨てます。`bauds`は、そのコードがリンクを動かすビットレートの一覧です。構成の確認（V-26）は、どちらかの端の一覧に無いか、どちらかの端で2 %より大きくずれるリンクの`baud`を受け付けません。DAGON Consoleは両端の一覧にある速さだけを選べるようにします。`[links]`に`uart`があるマイコンでは必須です。これが無いと、そのマイコンのファームウェアが動かすUARTリンクはすべて受け付けません。動くと分かっている速度が無いためです。"
"How the system text reaches the program." = "システムの文をプログラムに渡す方法。"
"How the user connects it for a write: `label`, `hint`." = "書き込みのときに利用者がつなぐ方法: `label`、`hint`。"
"Image header `mcu_id`; unique." = "イメージのヘッダの`mcu_id`。重複しないこと。"
"In a file in the call's folder, named by the `{system_file}` arg." = "呼び出しのフォルダの中のファイルに入れ、`{system_file}`の引数で示します。"
"Keeps a package about to be written, once it verifies with the project's key; answers its id." = "書き込もうとしているパッケージを残します。プロジェクトの鍵で検証が通ったときだけです。そのidを答えます。"
"Link kinds the MCU package's firmware implements (its `LINK_KINDS`)." = "マイコンの定義のファームウェアが実装するリンクの種類（その`LINK_KINDS`）。"
"MCU id (must be defined)." = "マイコンのid（定義されていること）。"
"MCU id used in topologies (`stm32f401re`)." = "構成で使うマイコンのid（`stm32f401re`）。"
"Most RAM the sandboxed extensions of one image take, regions rounded up (required when `kind` is not `none`)." = "1つのイメージのサンドボックスの拡張が取るRAMの上限。リージョンは切り上げます（`kind`が`none`でないときは必須）。"
"One question to DAGON, answered in this request." = "DAGONへの1つの質問。このリクエストで答えます。"
"Only for an MCU that can be the coordinator: `pio_state_machines`, `pio_uart_state_machines` (per link), `uart0_tx`, `uart0_rx`. A topology may make the MCU its coordinator only when `[coordinator]` is defined (V-25)." = "親機になれるマイコンだけ: `pio_state_machines`、`pio_uart_state_machines`（リンクごと）、`uart0_tx`、`uart0_rx`。構成がそのマイコンを親機にできるのは、`[coordinator]`が定義されているときだけです（V-25）。"
"Optional fixed regions: `stage0 = { at, size }`, `bootcore_log` / `app_log = { faces = [a, b], face_size }`; a `bootcore_log` equal to `app_log` is one log holding both the boot core and the APP records; `stage0_verifies = true`: stage0 also checks a boot core's signature (left out: digests only)." = "任意の固定のリージョン: `stage0 = { at, size }`、`bootcore_log` / `app_log = { faces = [a, b], face_size }`。`bootcore_log`が`app_log`と同じときは、ブートローダとAPPの両方の記録を持つ1つのログです。`stage0_verifies = true`: stage0はブートローダの署名も確かめます（省くとダイジェストだけ）。"
"Parts built from the board package itself (`name`, `sub`, `bin`)." = "ボードの定義自身からビルドする部品（`name`、`sub`、`bin`）。"
"Per handler call." = "ハンドラの呼び出しごと。"
"Pins the page wires new links to when this board is the 親機: `i2c = { controller, sda, scl }` (a new I2C bus; `controller` is one of the board's `i2c`) and `pio_uart = { tx, rx }` (a new PIO UART link), numbered GPIOs below the MCU's `gpio_count`. Only on boards whose MCU has `[coordinator]`." = "このボードが親機のときに、ページが新しいリンクを配線するピン: `i2c = { controller, sda, scl }`（新しいI2Cバス。`controller`はボードの`i2c`のどれか）と`pio_uart = { tx, rx }`（新しいPIO UARTリンク）。マイコンの`gpio_count`より小さい番号のGPIOです。マイコンに`[coordinator]`があるボードだけです。"
"Port contract: what a board provides to DAGON." = "ポートの取り決め: ボードがDAGONに用意するもの。"
"Porting DAGON to a board: answers 501, this dagon has no porting job." = "DAGONをボードに移植する作業: 501を返します。このdagonに移植の作業はありません。"
"Ports that exist in every listed layer; a trusted-only port needs `trusted = true`." = "一覧のすべてのレイヤーにあるポート。信頼された拡張だけのポートには`trusted = true`が要ります。"
"Product name." = "製品名。"
"ROM I2C bootloader (`stm32-i2c-rom`): `name` (as check messages call it), `addr`, `max_hz`, `erase_sectors`, `pairs = [{ controller, sda, scl }]` it listens on." = "ROMのI2Cブートローダ（`stm32-i2c-rom`）: `name`（確認のメッセージでの呼び名）、`addr`、`max_hz`、`erase_sectors`、待ち受ける`pairs = [{ controller, sda, scl }]`。"
"Read first; a number this dagon does not read is refused with both numbers." = "最初に読みます。このdagonが読まない番号は、両方の番号を示して受け付けません。"
"Records the user's consent to send to that agent that way; anything short of an explicit yes for a defined agent and way records nothing." = "そのエージェントにそのつなぎ方で送ることへの利用者の同意を記録します。定義されたエージェントとつなぎ方へのはっきりした同意でなければ、何も記録しません。"
"Registers the way's key in the OS credential store. The answer is GET /v1/agent's body (whether a key is registered, never the key)." = "つなぎ方のキーをOSの資格情報ストアに登録します。答えはGET /v1/agentの本文です（キーが登録されているかどうかで、キーそのものは含みません）。"
"Removes the way's key (fine when none was registered)." = "つなぎ方のキーを消します（登録が無いときも成功します）。"
"Replaces `[build.<id>]` in dagon.toml, keeping the rest of the file." = "dagon.tomlの`[build.<id>]`を置き換えます。ファイルのほかの部分はそのままです。"
"Required (at least [`STACK_MIN`]) for a sandboxed extension; a trusted one runs on DAGON's stack." = "サンドボックスの拡張には必須です（[`STACK_MIN`]以上）。信頼された拡張はDAGONのスタックで動きます。"
"Root-image protection `dagon provision` may set: `rdp1` (reversible), `rdp2` (permanent), `wrp` (reversible), `esp-secure-boot`, `esp-flash-encryption` (permanent)." = "`dagon provision`が設定できるルートイメージの保護: `rdp1`（元に戻せる）、`rdp2`（永久）、`wrp`（元に戻せる）、`esp-secure-boot`、`esp-flash-encryption`（永久）。"
"ST-LINK probe connected" = "ST-LINKのプローブがつながっている"
"STM32 system-memory boot loader on I2C (ST AN4221), driven from the host through the hub's NRST/BOOT0 lines and raw I2C transactions." = "I2CのSTM32システムメモリのブートローダ（ST AN4221）。ホストから、親機のNRST/BOOT0の線と生のI2Cのやり取りで動かします。"
"Signing for DAGON: keys, signed images, release bundles and first-install flash contents." = "DAGONの署名: 鍵、署名付きのイメージ、リリースのバンドル、最初のインストールのフラッシュの中身。"
"Signs the built applications of `nodes` with the CLI's key." = "`nodes`のビルド済みのアプリケーションに、CLIの鍵で署名します。"
"Stage0's bytes for the ROM path's full rewrite of an MCU with a stage0, as provision wrote them: <provision_dir>/<node>/stage0.bin. Stage0 carries no signature; the host checks it fits the MCU's stage0 region before writing it." = "stage0のあるマイコンをROMの経路ですべて書き直すときのstage0のバイト列。provisionが書いたもので、<provision_dir>/<node>/stage0.binです。stage0に署名はありません。ホストは書き込む前に、マイコンのstage0の領域に収まることを確かめます。"
"Stops a running job." = "実行中の作業を止めます。"
"The 12 conformance tests on `node` through the hub, after the page hands over the port." = "ページがポートを渡した後で、親機を通して`node`に12の適合試験を行います。"
"The MCU has a DAGON boot stage that runs extensions (`port = \"self-boot\"` only)." = "マイコンが、拡張を動かすDAGONのブート段階を持ちます（`port = \"self-boot\"`のときだけ）。"
"The `anthropic-version` header." = "`anthropic-version`のヘッダ。"
"The agent's id: lower-case letters, digits and '-', up to 32; unique among all agents." = "エージェントのid: 小文字、数字、'-' で32文字まで。すべてのエージェントの中で重複しないこと。"
"The agents and their ways (whether each can be used here; never a key, path or command), the consent, what linking sends." = "エージェントとそのつなぎ方（それぞれここで使えるか。キー、パス、コマンドは含みません）、同意、つなぐと送るもの。"
"The arguments, in order; `{system_file}` is replaced by the system text's file when `system = \"file\"`." = "引数を順に。`system = \"file\"`のときは、`{system_file}`をシステムの文のファイルに置き換えます。"
"The board's buses: `id` (`a-z 0-9 - _`), `kind` (`i2c`, `spi`, `uart`, `can`), `controller` (an MCU `[[peripheral]]`), its pins by signal (`sda`, `scl` for i2c; `tx` and/or `rx` for uart; `tx`, `rx` for can; `sck` and `mosi` and/or `miso` for spi), `hz` (i2c, spi) or `baud` (uart, can; on a `dagon = true` UART bus the link speed of a build dagon does not give the topology's, see below), `dagon` (`true`: DAGON's own link runs on it, so neither the bus nor its controller is ever an extension's), `dma` (`true`: the board package opens or hands out the bus with DMA; i2c, spi, uart; its tx and rx streams come from the MCU's `dma_requests`, buses in order, and the board package's build writes them as `<Bus>TxDma`/`<Bus>RxDma`, `take_dma!` and `bind_<bus>_dma!`)." = "ボードのバス: `id`（`a-z 0-9 - _`）、`kind`（`i2c`、`spi`、`uart`、`can`）、`controller`（マイコンの`[[peripheral]]`）、信号ごとのピン（i2cは`sda`、`scl`。uartは`tx`と`rx`の両方かどちらか。canは`tx`、`rx`。spiは`sck`と、`mosi`と`miso`の両方かどちらか）、`hz`（i2c、spi）または`baud`（uart、can。`dagon = true`のUARTバスでは、dagonが構成の速度を渡さないビルドのリンクの速度。後述）、`dagon`（`true`: DAGON自身のリンクがここで動くので、バスもそのコントローラも拡張のものにはなりません）、`dma`（`true`: ボードの定義のコードはバスをDMAで開くか渡します。i2c、spi、uart。txとrxのストリームは、マイコンの`dma_requests`からバスの順に取り、ボードの定義のビルドが`<Bus>TxDma`/`<Bus>RxDma`、`take_dma!`、`bind_<bus>_dma!`として書き出します）。"
"The board's pins: `pin`, `name` (what the board package's code takes it by, `a-z 0-9 _`), `boot` (a boot program may drive it), `levels` (allowed levels; all when left out)." = "ボードのピン: `pin`、`name`（ボードの定義のコードが取るときの名前、`a-z 0-9 _`）、`boot`（ブートプログラムが動かせる）、`levels`（許すレベル。省くとすべて）。"
"The boot core's sequence as a state machine: every step from the armed watchdog to the jump or the halt is an event the boot core's extensions observe" = "状態機械としてのブートローダの手順: 有効にしたウォッチドッグからジャンプか停止までの各ステップが、ブートローダの拡張が観測するイベントです"
"The boot stage's board values: `led` (a `[[pin]]`), `led_active` (`high`, `low`), `halt = { pattern, period_ms }` (`blink`, `code`, `off`), `power_hold = { pin, level }`. Its boot action programs, `[[boot.action]]`: A boot action program (`boot-program` format 1): `on` (a boot event the event catalog marks action-capable) and `ops`: `{ op = \"led\", state }` (`on`, `off`, `toggle`), `{ op = \"gpio\", pin, level }` (a `[[pin]]` with `boot = true`; the power hold pin takes only its hold level), `{ op = \"delay\", ms }` (1 to 20), `{ op = \"bus_write\", device, reg, bytes }` (a `[[device]]` register in its `writable` list, 1 to 8 bytes, only on an MCU with `boot_capabilities = [\"i2c\"]`). At most 32 ops and 50 ms per event, a bus write counting 5 ms." = "ブート段階のボードの値: `led`（`[[pin]]`）、`led_active`（`high`、`low`）、`halt = { pattern, period_ms }`（`blink`、`code`、`off`）、`power_hold = { pin, level }`。ブートのアクションプログラムは`[[boot.action]]`です。ブートのアクションプログラム（`boot-program`形式1）: `on`（イベントのカタログがアクションに使えると示すブートイベント）と`ops`: `{ op = \"led\", state }`（`on`、`off`、`toggle`）、`{ op = \"gpio\", pin, level }`（`boot = true`の`[[pin]]`。電源保持のピンは保持のレベルだけ）、`{ op = \"delay\", ms }`（1から20）、`{ op = \"bus_write\", device, reg, bytes }`（`writable`の一覧にある`[[device]]`のレジスタ、1から8バイト。`boot_capabilities = [\"i2c\"]`のマイコンだけ）。イベントごとに最大32の操作と50 msで、バスの書き込みは5 msと数えます。"
"The definition format, [`FORMAT`]." = "定義の形式、[`FORMAT`]。"
"The definitions in use as `Registry::to_json` gives them, for the page's dagon-wasm (`load_definitions`)." = "使っている定義を`Registry::to_json`の形で。ページのdagon-wasmのためです（`load_definitions`）。"
"The extension is part of DAGON for the project: it runs privileged, in DAGON's own memory, and nothing of the sandbox holds against it. A trusted-only port needs it; an extension that only observes may say it too (code of the project's own that runs in the boot core)." = "この拡張は、そのプロジェクトにとってDAGONの一部です。特権で、DAGON自身のメモリの中で動き、サンドボックスの制限はどれも効きません。信頼された拡張だけのポートには必要です。観測するだけの拡張も指定できます（ブートローダで動く、プロジェクト自身のコード）。"
"The extension's id: `a-z 0-9 -`, 1 to 32 characters." = "拡張のid: `a-z 0-9 -`、1から32文字。"
"The folders in a folder under home (default: home), each marked when it holds a dagon.toml. Key folders are left out." = "ホームの下のフォルダの中のフォルダ（既定はホーム）。dagon.tomlがあるものに印を付けます。鍵のフォルダは除きます。"
"The kind's capability record, read back from the hardware at boot (a mismatch turns the level to `none`). `armv6m-mpu`: `mpu_regions` 0 or 8, `min_region` at least 256, `subregions_from`; `armv7m-mpu`: `mpu_regions` 8 or 16, `min_region` at least 32, `subregions_from`; `armv8m-mpu`: `mpu_regions` 0, 4, 8, 12 or 16; `armv8m-tz`: `sau_regions` (0, 4, 8), `s_mpu_regions`, `ns_mpu_regions`, `idau = [{ base, size, attribution }]`; `riscv-pmp`, `riscv-epmp`: `pmp_entries` (0, 16, 64), `grain`, `na4`, `tor`; `esp-pms`: `worlds`, `gdma_channels`, `memory_regions`, `peripheral_slots`. Every kind: `critical_section` (`primask` on armv6m, `basepri` on armv7m and armv8m, `mstatus-mie` on RISC-V, `xtensa-level` on esp-pms), `unwind` (`cortex-m-exception`, `armv8m-tz`, `riscv-trap`, `xtensa-world`, by kind), `timer` (`systick`, `riscv-mtime`, `timer-group`), `reset_cleanup` (`peripheral-reset`, `reinit`), `background_privileged`, `fault_address`; optionally `np_max_us` and `dma_stop_max_us`, which may only lower DAGON's bounds (50 and 20)." = "その種類の能力の記録。ブート時にハードウェアから読み返します（一致しないとレベルが`none`になります）。`armv6m-mpu`: `mpu_regions`は0か8、`min_region`は256以上、`subregions_from`。`armv7m-mpu`: `mpu_regions`は8か16、`min_region`は32以上、`subregions_from`。`armv8m-mpu`: `mpu_regions`は0、4、8、12、16。`armv8m-tz`: `sau_regions`（0、4、8）、`s_mpu_regions`、`ns_mpu_regions`、`idau = [{ base, size, attribution }]`。`riscv-pmp`、`riscv-epmp`: `pmp_entries`（0、16、64）、`grain`、`na4`、`tor`。`esp-pms`: `worlds`、`gdma_channels`、`memory_regions`、`peripheral_slots`。どの種類も: `critical_section`（armv6mは`primask`、armv7mとarmv8mは`basepri`、RISC-Vは`mstatus-mie`、esp-pmsは`xtensa-level`）、`unwind`（種類ごとに`cortex-m-exception`、`armv8m-tz`、`riscv-trap`、`xtensa-world`）、`timer`（`systick`、`riscv-mtime`、`timer-group`）、`reset_cleanup`（`peripheral-reset`、`reinit`）、`background_privileged`、`fault_address`。任意で`np_max_us`と`dma_stop_max_us`。これらはDAGONの上限（50と20）を下げることだけができます。"
"The layers it runs in: `boot`, `app`, `relay`, `host`." = "動くレイヤー: `boot`、`app`、`relay`、`host`。"
"The messages endpoint, https only." = "messagesのエンドポイント。httpsだけです。"
"The model named in each request." = "各リクエストで指定するモデル。"
"The name the linking texts show for this way." = "つなぐときの文に表示する、このつなぎ方の名前。"
"The name the linking texts show." = "つなぐときの文に表示する名前。"
"The newest .dgb of the project's out/release." = "プロジェクトのout/releaseでいちばん新しい.dgb。"
"The node's `[build.<id>]` table of dagon.toml (404 when it has none)." = "dagon.tomlにあるノードの`[build.<id>]`テーブル（無ければ404）。"
"The node's last conformance result (404 before the first run)." = "ノードの最後の適合試験の結果（最初の実行の前は404）。"
"The node's signed boot core (the ROM path): [provision.<node>] bootcore, else <provision_dir>/<node>/bootcore.img." = "ノードの署名付きのブートローダ（ROMの経路）: [provision.<node>] bootcore、無ければ <provision_dir>/<node>/bootcore.img。"
"The open project and the recent ones." = "開いているプロジェクトと、最近のもの。"
"The packages kept in the project (out/deploy), newest version first, each with the version it gives each node." = "プロジェクトに残してあるパッケージ（out/deploy）。新しいバージョンから順に、各ノードに与えるバージョンとともに返します。"
"The project's 構成 YAML as it is on disk (404 before the first save)." = "ディスクにあるとおりの、プロジェクトの構成のYAML（最初の保存の前は404）。"
"The protection hardware: `armv6m-mpu`, `armv7m-mpu`, `armv8m-mpu`, `armv8m-tz`, `riscv-pmp`, `riscv-epmp`, `esp-pms`, `none`." = "保護のハードウェア: `armv6m-mpu`、`armv7m-mpu`、`armv8m-mpu`、`armv8m-tz`、`riscv-pmp`、`riscv-epmp`、`esp-pms`、`none`。"
"The time service." = "時間のサービス。"
"The tools the project's MCUs need, by its definitions. Nobody can confirm a command here, so a check the project itself defines is reported as one for the terminal's `dagon doctor`." = "定義に基づく、プロジェクトのマイコンに要るツール。ここではだれもコマンドを確認できないので、プロジェクト自身が定義する確認は、ターミナルの`dagon doctor`で行うものとして報告します。"
"The way's id, unique within its agent (same characters as an agent id)." = "つなぎ方のid。そのエージェントの中で重複しないこと（文字はエージェントのidと同じ）。"
"The ways to reach the agent, in order; the first is the default." = "エージェントに届くつなぎ方を順に。最初のものが既定です。"
"Tightly coupled memories, `[{ at, size }]`." = "密結合メモリ、`[{ at, size }]`。"
"Tool check: `what`, `probe` (command), `expect` (`\"runs\"`, `{ line = \"...\" }`, `{ prefix = \"...\" }`), `fix` (command), `hint`, `slow` (`true`: `dagon doctor --fix` says the install takes a while before it starts)." = "ツールの確認: `what`、`probe`（コマンド）、`expect`（`\"runs\"`、`{ line = \"...\" }`、`{ prefix = \"...\" }`）、`fix`（コマンド）、`hint`、`slow`（`true`: `dagon doctor --fix`が、インストールに時間がかかることを始める前に伝えます）。"
"Topology YAML: schema, validation rules and the supported-board table. Shared by the CLI and the browser build so both apply the same rules." = "構成のYAML: スキーマ、検証のルール、対応ボードの表。CLIとブラウザ向けのビルドが共有し、同じルールを使います。"
"UI drawing." = "UIの図。"
"Versions, work area, abilities; whether keys exist (never the keys)." = "バージョン、作業領域、できること。鍵があるかどうか（鍵そのものは含みません）。"
"What DAGON enforces: `none`, `mpu`, `pms`, `tz`. A kind gives `none` or one level (`mpu` for the MPU and PMP kinds, `pms` for `esp-pms`, `tz` for `armv8m-tz`)." = "DAGONが強制するもの: `none`、`mpu`、`pms`、`tz`。種類は`none`か1つのレベルを与えます（MPUとPMPの種類は`mpu`、`esp-pms`は`pms`、`armv8m-tz`は`tz`）。"
"What DAGON hands the extension (the `[capabilities]` keys below)." = "DAGONが拡張に渡すもの（下の`[capabilities]`のキー）。"
"What a board's boot action program may use besides pins: `[\"i2c\"]` allows `bus_write`." = "ボードのブートのアクションプログラムが、ピンのほかに使えるもの: `[\"i2c\"]`で`bus_write`を使えます。"
"What the simulated hub answered (empty when nothing came within the wait)." = "模擬の親機の答え（待ち時間のあいだに何も来なければ空）。"
"Whether the board can be an I2C target." = "ボードがI2Cのターゲットになれるか。"
"Who makes the agent, shown after its name." = "エージェントの作り手。名前の後に表示します。"
"Withdraws the consent (done also when none was)." = "同意を取り消します（無いときも完了します）。"
"Writes the topology YAML after the same check `dagon topo check` runs." = "`dagon topo check`と同じ確認の後で、構成のYAMLを書きます。"
"`.ext.data` + `.ext.bss`." = "`.ext.data` + `.ext.bss`。"
"`.ext.text` + `.ext.rodata` + the `.ext.data` load image." = "`.ext.text` + `.ext.rodata` + `.ext.data`のロードイメージ。"
"`[boot.record]`, for MCUs with a DAGON boot stage: where the boot record and the lockup fuse live. `kind` (`noinit-ram` inside `ram`, `retained-registers` inside a `[[peripheral]]`), `at`, `size` (at most 4096), `survives` (`reset-random`, `reset-cleared`, `power`: what a power loss leaves), `entropy = { source, min_bits }` (required; the start-up word a new record sequence mixes in: `source` one of `rng`, `ring-osc`, `osc-capture`, `adc-noise`; `min_bits` its min-entropy per word, a fact, at least 16 when it has a value), `rings = [{ writer, at, size }]` (one per boot stage, in boot order, inside the record), `fuse = { cells = [{ image, at, size }] }` (`bootcore`, `app`; outside the record), `reserved` (addresses the record never stores to). The byte layout inside is the `boot-record` contract's." = "`[boot.record]`、DAGONのブート段階を持つマイコン用: ブート記録とロックアップヒューズの場所。`kind`（`ram`の中の`noinit-ram`、`[[peripheral]]`の中の`retained-registers`）、`at`、`size`（最大4096）、`survives`（`reset-random`、`reset-cleared`、`power`: 電断の後に残るもの）、`entropy = { source, min_bits }`（必須。新しい記録のシーケンスが混ぜる起動時のワード: `source`は`rng`、`ring-osc`、`osc-capture`、`adc-noise`のどれか。`min_bits`はワードあたりの最小エントロピーで、事実です。値があるなら16以上）、`rings = [{ writer, at, size }]`（ブート段階ごとに1つ、ブートの順に、記録の中）、`fuse = { cells = [{ image, at, size }] }`（`bootcore`、`app`。記録の外）、`reserved`（記録が決してストアしないアドレス）。中のバイトのレイアウトは`boot-record`の取り決めのものです。"
"`[{ controller, sda, scl }]` pairs usable from the header." = "ヘッダから使える`[{ controller, sda, scl }]`の組。"
"`[{ pin, label }]`; `label` left out when not confirmed on the board. Every pin a topology may name on this board, as a link end on it (a hub's `pins`, `control`, bus `sda`/`scl`; a node's `node_pins` come from `i2c`): the check (V-07) refuses any other, and DAGON Console offers only these." = "`[{ pin, label }]`。ボードで確かめていない`label`は省きます。構成がこのボードで名指しできるピンのすべてです（親機側の`pins`・`control`・バスの`sda`/`scl`。ノード側の`node_pins`は`i2c`から選びます）。構成の確認（V-07）はそれ以外を受け付けず、DAGON Consoleはこれだけを選べるようにします。"
"`dagon gen` for the open project; dagon.toml is edited under the files lock." = "開いているプロジェクトで`dagon gen`を実行します。dagon.tomlはファイルのロックの下で編集します。"
"`dagon new` there (empty 構成 unless from_sample), key pair in ~/.dagon/keys/<name> when none." = "そこで`dagon new`を実行します（from_sampleが無ければ空の構成）。鍵の組が無ければ~/.dagon/keys/<name> に作ります。"
"`device` names one of the candidates the writer reports; with several and none named, the job ends with the candidates (written: false) and writes nothing." = "`device`は、書き込みの手段が報告する候補の1つを示します。候補が複数あり指定が無いと、作業は候補を示して終わり（written: false）、何も書きません。"
"`image` (`app`, `bootcore`, `agent`, `stage0`), `binding` (`a`, `b`, `any`), `header` (`inline`, `trailer`, `detached`); the region is `at` + `size` or `partition`; a detached header is at `header_at` or `header_partition` + `header_offset`." = "`image`（`app`、`bootcore`、`agent`、`stage0`）、`binding`（`a`、`b`、`any`）、`header`（`inline`、`trailer`、`detached`）。領域は`at` + `size`か`partition`です。分離したヘッダは`header_at`か`header_partition` + `header_offset`にあります。"
"`kind` (`iwdg`, `rp-watchdog`, `rtc-wdt`), `trial_ms` (armed on a trial boot), `confirmed_ms` (armed otherwise), `trial_attempts` (boots the boot stage gives a pending image before it rolls back: the boot core's limit, or the vendor second stage's). An app may delay a reboot by at most half the shorter period. The MCU package's build turns `trial_attempts` into the constant its boot core and its agent use. `flag` (required): the watchdog-reset flag the lockup fuse needs (set by a watchdog reset, kept over every later reset but power-on, cleared when a start acknowledges it), a fact of `none`, `register` (a reset-flag register; name it and its source in a comment) or `package` (the MCU package keeps it): `\"register\"`, `{ unverified = \"package\" }`, `\"unmeasured\"`. Without a flag with a source the MCU has no lockup fuse." = "`kind`（`iwdg`、`rp-watchdog`、`rtc-wdt`）、`trial_ms`（試行のブートで有効化）、`confirmed_ms`（それ以外で有効化）、`trial_attempts`（ブート段階がロールバックの前に待機中のイメージに与えるブートの回数: ブートローダの上限か、ベンダーの第2段階の上限）。アプリが再起動を遅らせられるのは、短いほうの周期の半分までです。マイコンの定義のビルドが、`trial_attempts`をブートローダとエージェントが使う定数にします。`flag`（必須）: ロックアップヒューズに要るウォッチドッグによるリセットのフラグ（ウォッチドッグによるリセットで立ち、電源投入以外のそれ以降のリセットでも残り、起動が確認すると消える）で、`none`、`register`（リセットのフラグのレジスタ。名前と出典をコメントで示します）、`package`（マイコンの定義のコードが保持）のどれかの事実です: `\"register\"`、`{ unverified = \"package\" }`、`\"unmeasured\"`。出所のあるフラグが無いマイコンには、ロックアップヒューズはありません。"
"`layer.kind`, `layer.prefix*` (matching at least one kind of the catalog) or `layer.*`." = "`layer.kind`、`layer.prefix*`（カタログの種類の少なくとも1つに一致すること）、または`layer.*`。"
"`name` (unique), `base` (address of flash byte 0), `bytes`, `xip` (required; `true`: the CPU reads flash at `base`, so flash shares the address space with RAM and register blocks; `false`: `base` and the slots are flash offsets an MMU maps elsewhere). The first is the default." = "`name`（重複しないこと）、`base`（フラッシュのバイト0のアドレス）、`bytes`、`xip`（必須。`true`: CPUがフラッシュを`base`で読むので、フラッシュはRAMやレジスタブロックとアドレス空間を共有します。`false`: `base`とスロットは、MMUが別の場所に割り当てるフラッシュのオフセットです）。最初のものが既定です。"
"`none`, `i-cache`, `id-cache` (instruction and data)." = "`none`、`i-cache`、`id-cache`（命令とデータ）。"
"`scratch = { at, size }`: flash a conformance build erases and writes; apart from every slot, header, log face and stage0." = "`scratch = { at, size }`: 適合試験のビルドが消去して書くフラッシュ。どのスロット、ヘッダ、ログの面、stage0からも離します。"
"`self-boot` or `vendor-stage2`." = "`self-boot`か`vendor-stage2`。"
"`true`: the board a node naming only its MCU is checked against (a project cannot replace the default of a builtin MCU that already has one: two marked boards do not load). At most one board of an MCU says so; an MCU's only board is its default without it; an MCU with several boards and none marked has no default (its nodes are checked without board facts). Definition order never decides it." = "`true`: マイコンだけを指定したノードを確かめるときのボード（既定のボードがすでにある組み込みのマイコンの既定を、プロジェクトは置き換えられません。印の付いたボードが2つあると読み込みません）。マイコンごとに、こう指定できるボードは最大1つです。マイコンの唯一のボードは、これが無くても既定です。ボードが複数で印が無いマイコンには既定がありません（そのノードはボードの事実なしで確かめます）。定義の順で決まることはありません。"
"`{ at, size }`: all of the MCU's RAM. Images get the RAM below the boot record, the fuse cells and the extension regions." = "`{ at, size }`: マイコンのRAMのすべて。イメージは、ブート記録、ヒューズのセル、拡張のリージョンより下のRAMを得ます。"
