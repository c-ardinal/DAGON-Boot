# DAGON board definition (format: targets/README.md).
format = 1
id = "m5stopwatch"
product = "M5StopWatch"
mcu = "esp32s3"
flash_bytes = 0x100_0000
# esp-hal has no I2C target mode for the ESP32-S3.
i2c_target = false
drawing = "stopwatch"
# The board a node naming only its MCU is checked against.
default = true

header = [
    { pin = "GPIO43", label = "G43" },
    { pin = "GPIO44", label = "G44" },
]

[default_link]
kind = "uart"
iface = "pio-uart"
baud = 115_200
control = "cooperative"
rom_entry = "force-download-boot"

# DAGON's link: UART0 on the rear pins MUX_IO_1/2 (the expander's PYG1
# low routes them to UART0), at default_link.baud.
[[bus]]
id = "link"
kind = "uart"
controller = "uart0"
tx = "GPIO43"
rx = "GPIO44"
dagon = true

# The internal bus: DAGON's bring-up and the app share it (SYS_I2C).
[[bus]]
id = "sys"
kind = "i2c"
controller = "i2c0"
sda = "GPIO47"
scl = "GPIO48"

# M5IOE1 I/O expander (low byte IO1-IO8): mode, output level and drive
# route the rear pins.
[[device]]
id = "ioe"
bus = "sys"
addr = 0x4F
regs = [
    { name = "mode_l", reg = 0x03 },
    { name = "out_l", reg = 0x05 },
    { name = "drv_l", reg = 0x13 },
]
writable = ["mode_l", "out_l", "drv_l"]

# M5PM1 power manager: its system command register.
[[device]]
id = "pmic"
bus = "sys"
addr = 0x6E
regs = [{ name = "sys_cmd", reg = 0x0C }]
writable = ["sys_cmd"]

# The recovery agent for the factory partition ships with this package.
[[part]]
name = "factory"
bin = "factory"
