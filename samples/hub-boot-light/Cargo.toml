[package]
name = "hub-boot-light"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Sample trusted boot extension: the RP2040 hub's backlight shows the boot core's steps"

# Standalone: the hub's boot crate links it by path (copied from
# targets/boot-extension-template); its host tests run on their own.
[workspace]

[dependencies]
dagon-boot = { path = "../../crates/dagon-boot" }
dagon-events = { path = "../../crates/dagon-events" }

# The backlight through the MCU package's register-level LED, which the
# boot core selects from the board's `[boot] led`.
[target.'cfg(target_os = "none")'.dependencies]
dagon-mcu-rp2040 = { path = "../../targets/mcu/rp2040", default-features = false }

[dev-dependencies]
critical-section = { version = "1.1", features = ["std"] }
