.dg-t,.dg-h{fill:#eef2f7}.dg-s{fill:#b4bfcb}.dg-a{stroke:#8d9bab}.dg-m{fill:#8d9bab}.dg-g{fill:#6db1f2}}
</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-m"/></marker></defs><rect width="1000" height="510" class="dg-bg"/><text x="16" y="28" class="dg-h" text-anchor="start">PC side</text><rect x="16" y="44" width="968" height="78" rx="8" class="dg-band"/><text x="26" y="68" class="dg-h" text-anchor="start">Page and command</text><text x="26" y="88" class="dg-s" text-anchor="start">Share one set of procedures;</text><text x="26" y="104" class="dg-s" text-anchor="start">none are written here.</text><rect x="16" y="132" width="968" height="78" rx="8" class="dg-band"/><text x="26" y="156" class="dg-h" text-anchor="start">API</text><text x="26" y="176" class="dg-s" text-anchor="start">The page reaches files and</text><text x="26" y="192" class="dg-s" text-anchor="start">devices through here.</text><rect x="16" y="220" width="968" height="78" rx="8" class="dg-band"/><text x="26" y="244" class="dg-h" text-anchor="start">Procedures</text><text x="26" y="264" class="dg-s" text-anchor="start">Knows nothing past Transport.</text><rect x="16" y="308" width="968" height="78" rx="8" class="dg-band"/><text x="26" y="332" class="dg-h" text-anchor="start">Formats, signing</text><text x="26" y="352" class="dg-s" text-anchor="start">Plain libraries: no</text><text x="26" y="368" class="dg-s" text-anchor="start">transport, no page.</text><rect x="16" y="396" width="968" height="78" rx="8" class="dg-band"/><text x="26" y="420" class="dg-h" text-anchor="start">Transports</text><text x="26" y="440" class="dg-s" text-anchor="start">Implement</text><text x="26" y="456" class="dg-s" text-anchor="start">dagon_host::Transport only.</text><path d="M724.9 110L418.6 232" class="dg-a"/><path d="M720.2 110L392.1 320" class="dg-a"/><path d="M748.3 110L551.4 320" class="dg-a"/><path d="M565.5 198L390.5 232" class="dg-a"/><path d="M617.1 198L682.7 320" class="dg-a"/><path d="M645.2 198L842.1 320" class="dg-a"/><path d="M474.0 259.0L482.0 259.0" class="dg-a"/><path d="M474.0 259.0L732.0 259.0" class="dg-a"/><path d="M404.6 286L645.2 320" class="dg-a"/><path d="M432.7 286L804.6 320" class="dg-a"/><path d="M411.5 347.0L419.5 347.0" class="dg-a"/><path d="M411.5 347.0L794.5 347.0" class="dg-a"/><path d="M786.5 347.0L794.5 347.0" class="dg-a"/><path d="M599.0 347.0L794.5 347.0" class="dg-a"/><path d="M406.1 110L362.4 144" class="dg-a dg-d"/><path d="M443.6 110L574.9 144" class="dg-a dg-d"/><path d="M353.0 408L353.0 286" class="dg-a dg-d"/><path d="M565.5 408L390.5 286" class="dg-a dg-d"/><path d="M778.0 408L428.0 286" class="dg-a dg-d"/><rect x="232.0" y="56" width="367.0" height="54" rx="6" class="dg-core"/><text x="415.5" y="78" class="dg-t" text-anchor="middle">DAGON Console</text><text x="415.5" y="97" class="dg-s" text-anchor="middle">web/</text><rect x="607.0" y="56" width="367.0" height="54" rx="6" class="dg-core"/><text x="790.5" y="78" class="dg-t" text-anchor="middle">dagon command</text><text x="790.5" y="97" class="dg-s" text-anchor="middle">dagon-cli</text><rect x="232.0" y="144" width="242.0" height="54" rx="6" class="dg-core"/><text x="353.0" y="166" class="dg-t" text-anchor="middle">serve API</text><text x="353.0" y="185" class="dg-s" text-anchor="middle">dagon-cli::serve</text><rect x="482.0" y="144" width="242.0" height="54" rx="6" class="dg-core"/><text x="603.0" y="166" class="dg-t" text-anchor="middle">Rust in the page</text><text x="603.0" y="185" class="dg-s" text-anchor="middle">dagon-wasm</text><rect x="732.0" y="144" width="242.0" height="54" rx="6" class="dg-data"/><text x="853.0" y="166" class="dg-t" text-anchor="middle">Agent definitions</text><text x="853.0" y="185" class="dg-s" text-anchor="middle">~/.dagon/agents/*.toml</text><rect x="232.0" y="232" width="242.0" height="54" rx="6" class="dg-core"/><text x="353.0" y="254" class="dg-t" text-anchor="middle">dagon-host</text><text x="353.0" y="273" class="dg-s" text-anchor="middle">Host, Transport</text><rect x="482.0" y="232" width="242.0" height="54" rx="6" class="dg-core"/><text x="603.0" y="254" class="dg-t" text-anchor="middle">dagon-conform</text><text x="603.0" y="273" class="dg-s" text-anchor="middle">conformance tests</text><rect x="732.0" y="232" width="242.0" height="54" rx="6" class="dg-core"/><text x="853.0" y="254" class="dg-t" text-anchor="middle">dagon-romlink</text><text x="853.0" y="273" class="dg-s" text-anchor="middle">ROM loader</text><rect x="232.0" y="320" width="179.5" height="54" rx="6" class="dg-core"/><text x="321.8" y="342" class="dg-t" text-anchor="middle">dagon-sign</text><text x="321.8" y="361" class="dg-s" text-anchor="middle">keys, signing</text><rect x="419.5" y="320" width="179.5" height="54" rx="6" class="dg-core"/><text x="509.2" y="342" class="dg-t" text-anchor="middle">dagon-topology</text><text x="509.2" y="361" class="dg-s" text-anchor="middle">setup, definitions</text><rect x="607.0" y="320" width="179.5" height="54" rx="6" class="dg-core"/><text x="696.8" y="342" class="dg-t" text-anchor="middle">dagon-proto</text><text x="696.8" y="361" class="dg-s" text-anchor="middle">link protocol</text><rect x="794.5" y="320" width="179.5" height="54" rx="6" class="dg-core"/><text x="884.2" y="342" class="dg-t" text-anchor="middle">dagon-format</text><text x="884.2" y="361" class="dg-s" text-anchor="middle">byte layouts</text><rect x="232.0" y="408" width="242.0" height="54" rx="6" class="dg-trait"/><text x="353.0" y="430" class="dg-t" text-anchor="middle">Serial</text><text x="353.0" y="449" class="dg-s" text-anchor="middle">dagon-cli::serial</text><rect x="482.0" y="408" width="242.0" height="54" rx="6" class="dg-trait"/><text x="603.0" y="430" class="dg-t" text-anchor="middle">Web Serial</text><text x="603.0" y="449" class="dg-s" text-anchor="middle">dagon-wasm::host</text><rect x="732.0" y="408" width="242.0" height="54" rx="6" class="dg-trait"/><text x="853.0" y="430" class="dg-t" text-anchor="midd