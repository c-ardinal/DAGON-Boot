<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-label="Node (the hub and the children have the same layers)" style="max-width:100%;height:auto"><style>
.dg-bg{fill:#ffffff}.dg-band{fill:#f1f4f8;stroke:#c9d1dc}.dg-box{fill:#ffffff;stroke:#7b8794}
