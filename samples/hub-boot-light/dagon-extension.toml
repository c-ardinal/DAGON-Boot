format = 1
id = "boot-light"
layers = ["boot"]
observes = ["boot.*"]
# Runs privileged in the boot core: list it in dagon.toml under
# [extensions.nodes.hub] trusted with the source SHA-256 `dagon gen` names.
trusted = true
[limits]
# Per handler call: the longest pattern (src/lib.rs, LONGEST_US) plus a
# margin for the register writes, below the 50 ms bound of an observer.
max_run_us = 45000
