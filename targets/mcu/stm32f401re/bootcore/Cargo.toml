[package]
name = "dagon-stm32f401re-bootcore"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.0.0"
publish = false

# Standalone: built for thumbv7em only, so it stays out of the host workspace.
# Its memory.x and verifying key come from dagon-mcu-stm32f401re.
[workspace]

[dependencies]
dagon-mcu-stm32f401re = { path = "..", features = ["hal", "image-bootcore"] }
dagon-core = { path = "../../../../crates/dagon-core" }
dagon-port = { path = "../../../../crates/dagon-port" }
embassy-stm32 = { version = "0.6.0", features = ["stm32f401re"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
# Smaller verifier code: the boot core must fit 32,256 bytes.
ed25519-compact = { version = "2.6", default-features = false, features = ["opt_size"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
