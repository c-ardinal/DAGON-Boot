[package]
name = "dagon-board-waveshare-rp2040-touch-lcd-1-28"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.0.0"
publish = false

# DAGON board package for the Waveshare RP2040-Touch-LCD-1.28 (topology
# board id `waveshare-rp2040-touch-lcd-1.28`). Built for thumbv6m only.
[workspace]

[package.metadata.dagon]
board = "waveshare-rp2040-touch-lcd-1.28"

[features]
# The 親機 relay and the display by default: a generated node names this
# package without features.
default = ["relay", "display"]
# The HAL side (embassy-rp): the board split, interrupts, link set-up.
# Without it only the screen layout builds, for host tests:
#   cargo test --no-default-features --target <host triple>
hal = [
    "dagon-mcu-rp2040/usb",
    "dep:embassy-rp",
    "dep:embassy-time",
    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:static_cell",
]
# Forwarded to the MCU package: link the app for APP slot B.
slot-b = ["dagon-mcu-rp2040/slot-b"]
# The 親機 relay (`start`): PC link, I2C0 and PIO UART to sub nodes, the
# STM32 ROM recovery lines.
relay = ["hal", "dagon-mcu-rp2040/relay"]
# The round display's home screen of the relay (`display`).
display = ["relay"]
# The display first shows a test pattern and the clock set-up (bring-up).
diag = []
# A panic blinks the last step code on the backlight.
diag-panic = ["dagon-mcu-rp2040/diag-panic"]

[dependencies]
dagon-mcu-rp2040 = { path = "../../mcu/rp2040", default-features = false }
dagon-format = { path = "../../../crates/dagon-format" }
dagon-proto = { path = "../../../crates/dagon-proto" }
embassy-rp = { version = "0.10.0", features = ["rp2040"], optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-executor = { version = "0.10", optional = true }
embassy-futures = { version = "0.1", optional = true }
embedded-graphics = "0.8"
heapless = "0.9"
static_cell = { version = "2", optional = true }
