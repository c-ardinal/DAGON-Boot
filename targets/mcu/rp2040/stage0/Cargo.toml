[package]
name = "dagon-rp2040-stage0"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false

# Firmware clippy runs in CI (scripts/ci_crates.py --firmware-lint): the
# masking rule of the execution model applies to the boot images too. The
# boot folder (DAGON_BOOT_CRATE) only names the board, so the lint uses
# the boot core's lint folder (a node without a board).
[package.metadata.dagon]
lint = { features = [""], env = { DAGON_BOOT_CRATE = "../bootcore/lint" } }

# Standalone: built for thumbv6m only, so it stays out of the host workspace.
# Its memory.x comes from dagon-mcu-rp2040 (`image-stage0`).
[workspace]

[dependencies]
dagon-mcu-rp2040 = { path = "..", default-features = false, features = ["image-stage0"] }
dagon-core = { path = "../../../../crates/dagon-core" }
dagon-ed25519 = { path = "../../../../crates/dagon-ed25519" }
dagon-format = { path = "../../../../crates/dagon-format" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
rp2040-boot2 = "0.3"
panic-halt = "1"

[build-dependencies]
# The diagnostic output from the board definition's boot LED and halt pattern.
dagon-topology = { path = "../../../../crates/dagon-topology" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
