# DAGON board definition (format: targets/README.md).
# No default_link: this board is the coordinator.
id = "waveshare-rp2040-touch-lcd-1.28"
product = "Waveshare RP2040-Touch-LCD-1.28"
mcu = "rp2040"
flash_bytes = 0x40_0000
i2c_target = true
drawing = "round-lcd"

# label: the printed header name, left out until confirmed on the board.
header = [
    { pin = "GPIO16" },
    { pin = "GPIO17" },
    { pin = "GPIO18" },
    { pin = "GPIO26" },
    { pin = "GPIO27" },
    { pin = "GPIO28" },
]

# I2C1 is used on the board itself (GPIO6/7).
i2c = [{ controller = "i2c0", sda = "GPIO16", scl = "GPIO17" }]
