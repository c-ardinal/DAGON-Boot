[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# Literals next to the code: a function larger than l32r's reach (the Ed25519
# field arithmetic inlined at opt-level "s") otherwise fails to link.
rustflags = [
    "-C", "link-arg=-nostartfiles", "-C", "link-arg=-Tlinkall.x",
    "-C", "llvm-args=--mtext-section-literals",
]

[unstable]
build-std = ["core"]

[env]
# This node's image target tag.
DAGON_TARGET_TAG = { value = "watch-s3", force = true }
