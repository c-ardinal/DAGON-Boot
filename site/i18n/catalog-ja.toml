# The Japanese of what the state machine and port catalogs say, keyed by that English. dagon-catalog's tests fail on a missing or unused key.

"A DAGON link carries frames: the first one arrived, at start or after the link went down. `link`: its kind's code (`dagon_format::with_link_kinds!`); `addr`: the node's own address on it (`NO_ADDR` where a link has none)." = "DAGON のリンクがフレームを送受信する: 起動時か、リンクが切れた後の最初のフレームが届いた。`link`: その種類のコード（`dagon_format::with_link_kinds!`）。`addr`: そのリンクでのノード自身のアドレス（アドレスの無いリンクでは `NO_ADDR`）。"
"A DAGON link stopped carrying frames: a reply could not be sent, or the link closed." = "DAGON のリンクがフレームを送受信しなくなった: 返答を送れなかった、またはリンクが閉じた。"
"A body chunk was written." = "本体のチャンクを書いた。"
"A confirm of the slot on trial asks `self_check`." = "試行中のスロットの確定が `self_check` に尋ねる。"
"A confirm was refused (not on trial, self-check, store)." = "確定を拒んだ（試行中でない、自己検査、ストア）。"
"A reboot was accepted, after `allow_reboot_now`." = "`allow_reboot_now` の後で、再起動を受け付けた。"
"A request arrived on link `via`." = "リンク `via` にリクエストが届いた。"
"A switch of the boot target was refused." = "ブートの対象の切り替えを拒んだ。"
"An extension answered a decision point after `DECISION_BOUND_MS`; its answer was ignored." = "拡張が `DECISION_BOUND_MS` の後で判断点に答えた。その答えは無視した。"
"An extension's handler ran longer than its `budget_us` (the manifest's `max_run_us`); the boot went on with the same decision." = "拡張のハンドラが `budget_us`（マニフェストの `max_run_us`）より長く動いた。ブートは同じ判断で進んだ。"
"A write passed every DAGON guard; `accept_update` is asked next." = "書き込みの申し出が DAGON のすべてのガードを通った。次に `accept_update` に尋ねる。"
"A write was refused, by a DAGON guard or by an extension's `accept_update`." = "書き込みの申し出を、DAGON のガードか拡張の `accept_update` が拒んだ。"
"Another core confirmed itself; this one is no longer." = "別のコアが自分を確定した。このコアはもう確定ではない。"
"Another slot was set pending; this one no longer is." = "別のスロットが待機になった。このスロットはもう待機ではない。"
"BOOTSEL/UF2, factory, ROM entry as the MCU and board define" = "マイコンとボードの定義のとおりの BOOTSEL/UF2、factory、ROM の入り口"
"Boot-stage extension calls and their time limits." = "ブート段階の拡張の呼び出しとその時間の上限。"
"DAGON's start began (the agent was made, or restarted); the slot store is read next. `tag`: the node's image target tag as a name digest (`NameDigest`: the compact form \"digest prefix\", made as MCU identities are); a host resolves it from the topology's node tags." = "DAGON の起動が始まった（エージェントを作った、または再開した）。次にスロットのストアを読む。`tag`: ノードのイメージのターゲットのタグの名前のダイジェスト（`NameDigest`: 短い形の「ダイジェストの先頭」で、マイコンの識別と同じように作る）。ホストは構成のノードのタグから解決する。"
"Decision calls to extensions and their bound." = "拡張への判断の呼び出しとその上限。"
"Ed25519 over the project key" = "プロジェクトの鍵での Ed25519"
"Header bytes received so far." = "これまでに受け取ったヘッダのバイト。"
"I2C controller, PIO UART" = "I2C コントローラ、PIO UART"
"Identity answered." = "識別に答えた。"
"No slot can be started." = "起動できるスロットが無い。"
"Requests answered or refused, and the decision points asked." = "答えたか拒んだリクエストと、尋ねた判断点。"
"SHA-256" = "SHA-256"
"Stage0 gave the pending core up (its starts ran out, or its image failed the check) and the core in `to` recorded it." = "stage0 が待機のコアをあきらめ（起動の回数が尽きた、またはイメージが検査に失敗した）、`to` のコアがそれを記録した。"
"Status answered." = "ステータスに答えた。"
"The board's bring-up ran. `board`: the board definition's id as a name digest (`NameDigest`); a host resolves it from the board definitions it knows." = "ボードの立ち上げを実行した。`board`: ボードの定義の id の名前のダイジェスト（`NameDigest`）。ホストは知っているボードの定義から解決する。"
"The body or its header did not verify, or could not be stored." = "本体かそのヘッダを検証できなかった、または保存できなかった。"
"The body read back matches its digest." = "読み返した本体がダイジェストと一致した。"
"The body verified and the header written and read back: the slot holds an image." = "本体を検証し、ヘッダを書いて読み返した。スロットにイメージがある。"
"The boot core rolled the slot back (attempts exhausted, or the pending image failed its check) and started `to`." = "ブートローダがスロットをロールバックし（試行回数を使い切った、または待機のイメージが検査に失敗した）、`to` を起動した。"
"The boot core started the pending slot on trial (`attempt` boots so far, of the `max` its boot core allows)." = "ブートローダが待機のスロットを試行として起動した（これまで `attempt` 回のブートで、ブートローダが許すのは `max` 回）。"
"The boot core stays here for good." = "ブートローダはここにとどまる。"
"The boot core's sequence from the armed watchdog to the jump or the halt. Its events reach the boot core's extensions as they happen; nothing an extension does changes the decision." = "有効にしたウォッチドッグからジャンプか停止までのブートローダの手順。そのイベントは起きたときにブートローダの拡張に届く。拡張が何をしても判断は変わらない。"
"The confirmed slot had been set pending again; another slot was set pending, or the boot core ended its trial: it is the confirmed slot again." = "確定したスロットがもう一度待機にされていた。別のスロットが待機になったか、ブートローダがその試行を終えたので、確定したスロットに戻る。"
"The core is the one stage0 tries at the next reset." = "次のリセットで stage0 が試すコアになった。"
"The core's body verified and its header written and read back." = "コアの本体を検証し、そのヘッダを書いて読み返した。"
"The header was refused (signature, key, compatibility, size)." = "ヘッダを拒んだ（署名、鍵、互換性、大きさ）。"
"The header's signature, key and compatibility checked out." = "ヘッダの署名、鍵、互換性を確かめた。"
"The idle boot core slot was erased for a new core (never the running or the confirmed core's slot)." = "新しいコアのために空いているブートローダのスロットを消去した（動いているコアや確定したコアのスロットは消さない）。"
"The last event before control leaves DAGON." = "制御が DAGON を離れる前の最後のイベント。"
"The last event before the decision is made." = "判断の前の最後のイベント。"
"The lifecycle of one boot core slot of a self-boot MCU with a stage0 (its definition's `bootcore` slots), kept in the boot core records of the state log. The agent writes a new core into the idle slot and sets it pending; stage0 tries it and the core settles the trial itself: `confirmed` by the new core after its own check, `rolled_back` by the old one when stage0 gave the new one up. The app sees those at its next start." = "stage0 のある self-boot のマイコンの、ブートローダのスロット 1 つのライフサイクル（定義の `bootcore` のスロット）。状態ログのブートローダの記録に持つ。エージェントが新しいコアを空いているスロットに書いて待機にし、stage0 がそれを試し、コアが自分で試行を決着させる。新しいコアが自分の検査の後で `confirmed`、stage0 が新しいコアをあきらめたときは古いコアが `rolled_back`。アプリは次の起動でそれらを見る。"
"The lifecycle of one image slot (the two APP slots, and the hub's topology copy). The slot store's mutators run only inside these transitions. `trial_started` and `rolled_back` are the boot core's changes, replayed at start from the slot store." = "イメージのスロット 1 つのライフサイクル（2 つの APP のスロットと、親機の構成のコピー）。スロットのストアの変更メソッドは、これらの遷移の中でだけ動く。`trial_started` と `rolled_back` はブートローダの変更で、起動時にスロットのストアからリプレイする。"
"The new core passed its own check and confirmed itself." = "新しいコアが自分の検査を通り、自分を確定した。"
"The node's start and its DAGON links: what the MCU package's start and serving loop report through the agent." = "ノードの起動とその DAGON のリンク: マイコンのパッケージの起動と応答のループがエージェントを通して報告するもの。"
"The other slot was confirmed; this one is no longer." = "もう一方のスロットが確定した。このスロットはもう確定ではない。"
"The reply has left; the reset follows." = "返答が出た。リセットが続く。"
"The reply to the last request left, `ms` after it arrived." = "最後のリクエストへの返答が、届いてから `ms` の後に出た。"
"The slot is erased and the header (where the target has one) accepted: body chunks are taken from here." = "スロットを消去し、ヘッダ（ターゲットが持つところでは）を受け付けた。ここから本体のチャンクを受け取る。"
"The slot is the one tried on the next boot." = "次のブートで試すスロットになった。"
"The slot on trial was confirmed after its self-check." = "試行中のスロットを、自己検査の後で確定した。"
"The slot store was read at start." = "起動時にスロットのストアを読んだ。"
"The slot to start is final (`trial`: the pending slot on a counted attempt)." = "起動するスロットが決まった（`trial`: 数える試行での待機のスロット）。"
"The slot was erased for a new image (never the running or the confirmed slot)." = "新しいイメージのためにスロットを消去した（動いているスロットや確定したスロットは消さない）。"
"The start took over the boot core's watchdog: its period, and what the guard does with it while the image is on trial." = "起動がブートローダのウォッチドッグを引き継いだ: その周期と、イメージが試行のあいだガードがそれをどう扱うか。"
"The state log was read (`ok: false`: no valid face)." = "状態ログを読んだ（`ok: false`: 有効な面が無い）。"
"The transfer was dropped." = "転送を捨てた。"
"The write session: an offer, the header, the body, the end." = "書き込みのセッション: 申し出、ヘッダ、本体、終わり。"
"The watchdog runs with the trial period; from here extensions run." = "ウォッチドッグが試行の周期で動く。ここから拡張が動く。"
"The whole body arrived; it is hashed and read back next." = "本体全体が届いた。次にハッシュして読み返す。"
"USB CDC, UART, I2C target, PIO UART" = "USB CDC、UART、I2C ターゲット、PIO UART"
"`RebootRequest` -> `Delay`" = "`RebootRequest` -> `Delay`"
"`TrialInfo` -> `Health`" = "`TrialInfo` -> `Health`"
"`UpdateOffer` -> `Accept`" = "`UpdateOffer` -> `Accept`"
"`max_attempts` from the definition, pending before confirmed" = "定義の `max_attempts`、確定より待機を先に"
"a decision point, 3" = "判断点、3"
"a plug-in adds a path, never removes DAGON's" = "プラグインは経路を足すだけで、DAGON のものを消せません"
"a program or request run after a host event" = "ホストのイベントの後で実行するプログラムやリクエスト"
"accept" = "受け入れる"
"accepting what DAGON refused (not asked then)" = "DAGON が拒んだものを受け入れること（そのときは尋ねません）"
"an additional recovery path: a service window for a transport, a vendor download mode" = "追加の復旧の経路: 転送のためのサービスの時間枠、ベンダーのダウンロードモード"
"an external agent the CLI and the page hand requests to" = "CLI とページがリクエストを渡す外部のエージェント"
"ask" = "尋ねる"
"at boot it runs in the sandbox with the declared pins and buses" = "ブート時は、宣言されたピンとバスでサンドボックスの中で動きます"
"attempt limit, which slot wins" = "試行の上限、どのスロットが勝つか"
"board package, libraries, user (first answer wins)" = "ボードのパッケージ、ライブラリ、利用者（最初の答えが勝つ）"
"body hash" = "本体のハッシュ"
"building node images" = "ノードのイメージのビルド"
"bytes in and out of a link" = "リンクに出入りするバイト"
"cargo" = "cargo"
"confirming a slot not on trial; confirming outside the `confirmed` transition" = "試行中でないスロットを確定すること。`confirmed` の遷移の外で確定すること"
"data-defined (action definitions)" = "データで定義（アクションの定義）"
"data-defined (agent definitions)" = "データで定義（エージェントの定義）"
"each call within `DECISION_BOUND_MS` (a later answer is ignored); `Pending` keeps the \"state\" status and the host retries" = "呼び出しごとに `DECISION_BOUND_MS` 以内（遅れた答えは無視します）。`Pending` は \"state\" のステータスのままで、ホストが再試行します"
"each call within `DECISION_BOUND_MS` (a later answer is ignored); asked after every DAGON guard passed, before erase" = "呼び出しごとに `DECISION_BOUND_MS` 以内（遅れた答えは無視します）。DAGON のすべてのガードを通った後、消去の前に尋ねます"
"each call within `DECISION_BOUND_MS`; `Now` or `After(ms)`, ms capped at half the shorter watchdog period of the MCU definition; DAGON replies first and keeps feeding while it waits" = "呼び出しごとに `DECISION_BOUND_MS` 以内。`Now` か `After(ms)`、ms の上限はマイコンの定義の短いほうのウォッチドッグの周期の半分。DAGON はまず返答し、待つあいだキックを続けます"
"every protocol's triggers pass the same guards; replacing them would let a transport write what DAGON refuses" = "どのプロトコルのトリガーも同じガードを通ります。置き換えると、DAGON が拒むものを転送が書けてしまいます"
"extra VERSION TLVs, extra status, a UDS DID table" = "追加の VERSION の TLV、追加のステータス、UDS の DID の表"
"file key pair" = "ファイルの鍵の組"
"header signature, key lookup" = "ヘッダの署名、鍵の検索"
"healthy" = "健全"
"how a hub reaches a child" = "親機が子機に届く方法"
"it cannot skip a guard: the session machine runs the guards, not the protocol" = "ガードは飛ばせません。ガードを実行するのはセッションの状態機械で、プロトコルではありません"
"it is what keeps extensions away from DAGON's state" = "拡張を DAGON の状態から遠ざけているものです"
"it is what makes every extension see every event and keeps answers bounded" = "すべての拡張がすべてのイベントを見られるようにし、答えを有界に保つものです"
"its format is DAGON's retained contract and it is never an input to a boot or confirm decision" = "その形式は DAGON の保持の取り決めで、ブートや確定の判断の入力にはなりません"
"messages ↔ session triggers: identity, status, transfer, switch, reboot, confirm" = "メッセージ ↔ セッションのトリガー: 識別、ステータス、転送、切り替え、再起動、確定"
"none" = "なし"
"now" = "すぐ"
"refusing a reboot; a delay beyond the cap" = "再起動を拒むこと。上限を超える遅れ"
"serial" = "シリアル"
"signing images and releases" = "イメージとリリースの署名"
"skipping the key check and image verification, done before the listing is shown" = "一覧の表示の前に行う、鍵の確認とイメージの検証を飛ばすこと"
"software" = "ソフトウェア"
"the DAGON wire" = "DAGON のリンク"
"the MCU package's flash layout" = "マイコンのパッケージのフラッシュの配置"
"the MCU's" = "マイコンのもの"
"the `[boot] led` and `halt` of the board definition through the action program" = "アクションプログラムを通した、ボードの定義の `[boot] led` と `halt`"
"the board package's" = "ボードのパッケージのもの"
"the board's power, pins and buses at app start" = "アプリの起動時のボードの電源、ピン、バス"
"the deploy listing -> yes or no" = "デプロイの一覧 -> はいかいいえ"
"the entry gate, the service calls, the protection map and the lockup fuse" = "入り口のゲート、サービス呼び出し、保護マップ、ロックアップヒューズ"
"the health answer when a slot on trial is confirmed" = "試行中のスロットを確定するときの健全さの答え"
"the host is trusted by definition; the device verifies" = "ホストは定義上信頼されます。検証するのはデバイスです"
"the image-lifecycle machine over the slot store and the state log" = "スロットのストアと状態ログの上のイメージのライフサイクルの状態機械"
"the interactive user (terminal, page) or `--yes`; never actions or host extensions" = "対話する利用者（ターミナル、ページ）か `--yes`。アクションやホストの拡張は答えません"
"the only writer of persistent image state; every change emits its event and keeps the confirm rule" = "永続のイメージの状態の唯一の書き手。どの変更もイベントを出し、確定のルールを保ちます"
"the order of a layer's chain (publisher, board package, libraries, user) and the decision bounds" = "レイヤーのチェーンの順（公開元、ボードのパッケージ、ライブラリ、利用者）と判断の上限"
"the primitives the verifier and digest use; hardware acceleration, HSM" = "検証器とダイジェストが使う基本要素。ハードウェアの加速、HSM"
"the retained record of boot events the app replays" = "アプリがリプレイするブートのイベントの保持の記録"
"the write session's guards: target, slot, header signature and compatibility, body digest" = "書き込みのセッションのガード: ターゲット、スロット、ヘッダの署名と互換性、本体のダイジェスト"
"the watchdog that guards boot and trial" = "ブートと試行を守るウォッチドッグ"
"until the user answers" = "利用者が答えるまで"
"what a phase or a boot outcome looks like" = "段階やブートの結果の見え方"
"where `Recent` overflow and extension logs go" = "`Recent` のあふれと拡張のログの行き先"
"where images live" = "イメージの置き場所"
"where the signing key is kept" = "署名の鍵の置き場所"
"where the state log lives" = "状態ログの置き場所"
