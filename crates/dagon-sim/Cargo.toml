[package]
name = "dagon-sim"
edition.workspace = true
license.workspace = true
version = "0.1.0"

[dependencies]
dagon-agent = { path = "../dagon-agent" }
# The kind S state log's fold and STATUS mapping (one for every store).
dagon-core = { path = "../dagon-core" }
dagon-events = { path = "../dagon-events" }
dagon-format = { path = "../dagon-format" }
