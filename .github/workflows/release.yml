# Builds the dagon executables when a version tag is pushed. Build only:
# the archives are kept as workflow artifacts; making a GitHub release from
# them is a separate step the owner takes by hand each time.
name: release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build the archive
        run: python scripts/release.py --target ${{ matrix.target }} --out out/release
      - uses: actions/upload-artifact@v4
        with:
          name: dagon-${{ matrix.target }}
          path: out/release/*
          if-no-files-found: error
