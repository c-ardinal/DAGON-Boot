[workspace]
resolver = "2"
# Firmware packages (targets/, samples/) are standalone; the MCU packages
# under targets/mcu/ run their host tests on their own.
members = ["crates/*"]
# targets/mcu/build is its own workspace (the MCU packages' build helper,
# which dagon-topology also uses for the node folders' hashes).
exclude = ["targets/esp32s3-*", "targets/mcu/build", "fuzz"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true

# The Ed25519 vector and differential tests run tens of thousands of
# verifications; overflow checks stay on.
[profile.dev.package.dagon-ed25519]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3
