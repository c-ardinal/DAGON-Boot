[package]
name = "dagon-events"
edition.workspace = true
license.workspace = true
version = "0.1.0"
description = "DAGON lifecycle events: state machines whose transitions emit events, extensions, ports and the published event state"

[features]
# The catalogs keep their machines' and transitions' docs: for the hosted
# tools that print them (dagon-catalog); a firmware image leaves them out.
catalog-docs = []
# A build that measures how long DAGON's own code masks interrupts: the
# ring of recent events times its critical section with the clock its
# maker hands in (`Published::timed`).
masked-time = []

[dependencies]
dagon-format = { path = "../dagon-format" }
embassy-sync = "0.8"
# The bus port speaks to any I2C driver through its traits.
embedded-hal = "1"

[dev-dependencies]
critical-section = { version = "1.1", features = ["std"] }
