# DAGON board definition (format: targets/README.md).
format = 4
id = "m5stopwatch"
product = "M5StopWatch"
mcu = "esp32s3"
# The flash is a Winbond W25Q128JVPIQ, 16 MiB (StopWatch schematic
# C152-SCH_Stopwatch_PRJ_Main_VA_20251201).
flash_bytes = 0x100_0000
# esp-hal has no I2C target mode for the ESP32-S3.
i2c_target = false
drawing = "stopwatch"
# The board a node naming only its MCU is checked against.
default = true

header = [
    { pin = "GPIO43", label = "G43" },
    { pin = "GPIO44", label = "G44" },
]

[default_link]
kind = "uart"
iface = "pio-uart"
baud = 115_200
control = "cooperative"
rom_entry = "force-download-boot"

# ENTER_ROM method 2 (the M5PM1 restarts the MCU in download mode); a
# topology link asks for it as `rom_entry: m5pm1`.
[[rom_entry]]
name = "m5pm1"
method = 2

# DAGON's link: UART0 on the rear pins MUX_IO_1/2 (the expander's PYG1
# low routes them to UART0), at the topology link's baud (dagon gives it to
# the build; default_link.baud otherwise). GPIO43 and GPIO44 are the pins the
# chip gives U0TXD and U0RXD on the IO MUX (function 0) in Espressif's chip
# metadata (esp-metadata-generated; targets/mcu/esp32s3/tests/pin_map.rs
# holds the board to it).
[[bus]]
id = "link"
kind = "uart"
controller = "uart0"
tx = "GPIO43"
rx = "GPIO44"
dagon = true

# The internal bus: DAGON's bring-up and the app share it (SYS_I2C).
[[bus]]
id = "sys"
kind = "i2c"
controller = "i2c0"
sda = "GPIO47"
scl = "GPIO48"

# M5IOE1 I/O expander (low byte IO1-IO8): mode, output level and drive
# route the rear pins.
[[device]]
id = "ioe"
bus = "sys"
addr = 0x4F
# M5IOE1 Chip User Manual V1.4, III "Register Mapping", note 2: one burst
# stays inside a block (0x00-0x2F, 0x30-0x6F, 0x70-0x8F, 0x90); the largest,
# LED_RAM, is 64 bytes.
max_transfer = 64
regs = [
    { name = "mode_l", reg = 0x03 },
    { name = "out_l", reg = 0x05 },
    { name = "drv_l", reg = 0x13 },
]
writable = ["mode_l", "out_l", "drv_l"]

# M5PM1 power manager: its system command register.
[[device]]
id = "pmic"
bus = "sys"
addr = 0x6E
# M5PM1 Chip User Manual V1.9, IV "Key Register Description", register
# access limitation: one continuous transfer stays inside a range; the
# largest, the pixel buffer 0x60-0x9F, is 64 bytes.
max_transfer = 64
regs = [{ name = "sys_cmd", reg = 0x0C }]
writable = ["sys_cmd"]

# The board's flash and its erase times, which replace the MCU's default.
# Winbond W25Q128JV datasheet Revision G, 9.6 "AC Electrical
# Characteristics": Sector Erase Time (4KB) tSE max 400 ms, over the part's
# whole range (2.7 V to 3.6 V, -40 C to +85 C for the IQ grade, 9.2). DAGON
# erases 4 KiB sectors only, so the block and chip erase times are not used.
[flash]
part = "W25Q128JV"
erase_regions = [
    { start = 0x0, len = 0x100_0000, unit = 0x1000, unit_max_ms = 400 },
]

# The recovery agent for the factory partition ships with this package.
[[part]]
name = "factory"
bin = "factory"
