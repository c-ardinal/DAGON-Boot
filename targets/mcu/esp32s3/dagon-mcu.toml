# DAGON MCU definition (format: targets/README.md). Slots come from
# partitions.csv; addresses are flash offsets (images are MMU-mapped).
format = 3
id = "esp32s3"
name = "ESP32-S3"
wire_id = 0x0003
port = "vendor-stage2"
gpio_count = 49
partitions = "partitions.csv"

[[flash_map]]
name = "esp32s3-16m"
# Addresses are flash offsets; images run MMU-mapped.
xip = false
base = 0x0
bytes = 0x100_0000

# Images run from either OTA partition (binding any; load names ota_0).
# Headers are detached into the dagon partition.
[[slot]]
image = "app"
binding = "any"
header = "detached"
partition = "ota_0"
header_partition = "dagon"
header_offset = 0x0

[[slot]]
image = "agent"
binding = "any"
header = "detached"
partition = "factory"
header_partition = "dagon"
header_offset = 0x2000

# What writes each image kind: the factory agent writes the app, and a
# confirmed app writes the factory agent.
[writers]
app = ["agent"]
agent = ["app"]

# What the node receives into: APP slot A is ota_0 and slot B ota_1, the
# recovery agent goes to factory; each header has its own 4 KiB sector at
# the start of the dagon partition (0x71_0000).
[[slot_layout]]
target = "app"
slot = "a"
partition = "ota_0"
start = 0x11_0000
capacity = 0x30_0000
header = { detached = 0x71_0000 }

[[slot_layout]]
target = "app"
slot = "b"
partition = "ota_1"
start = 0x41_0000
capacity = 0x30_0000
header = { detached = 0x71_1000 }

[[slot_layout]]
target = "agent"
slot = "factory"
partition = "factory"
start = 0x1_0000
capacity = 0x10_0000
header = { detached = 0x71_2000 }

# First write: the bundled ESP-IDF 2nd stage, the partition table, the
# board's factory agent, slot A and otadata. usb_hint labels the candidates
# the writer reports; it never filters them.
[writer]
kind = "espflash"
chip = "esp32s3"
flash_size = "16mb"
table_at = 0x8000
bootloader = "vendor/bootloader.bin"
checksums = "vendor/SHA256SUMS"
usb_hint = { vid = 0x303A, pid = 0x1001 }

# The UART the UART link runs on (link::uart_config): esp-hal 1.2's UART
# with its default clock source XTAL_CLK, 40 MHz on the ESP32-S3, and its
# 12.4 divider (clk << 4) / baud rounded down (uart/low_level change_baud;
# ESP32-S3 TRM, UART baud rate generation). The chip runs only from a 40 MHz
# crystal (ESP32-S3 datasheet, clock), so no board changes this clock.
[link_uart]
clock_hz = 40_000_000
clocks_per_bit = 1
frac_bits = 4
# Bit rates the firmware runs the link at: a link's baud is one of these on both ends.
bauds = [115_200, 230_400, 460_800, 921_600]

# Link kinds the firmware implements (src/links.rs LINK_KINDS).
[links]
up = ["uart", "usb-cdc"]

# How the factory agent receives when the app does not answer: it waits the
# design's 50 ms for STAY on its UART link. USB Serial/JTAG is enumerated
# first, so it receives on USB only in update or recovery mode.
[boot_receive]
listen_window_ms = 50
kinds = { uart = true, usb-cdc = false }

# The interfaces a topology link end names (ESP32-S3 technical reference:
# USB Serial/JTAG, UART0/1/2, I2C0/1, TWAI).

[[link_port]]
index = 0
name = "usb-serial-jtag"
kind = "usb-cdc"

[[link_port]]
index = 1
name = "uart0"
kind = "uart"

[[link_port]]
index = 2
name = "uart1"
kind = "uart"

[[link_port]]
index = 3
name = "uart2"
kind = "uart"

[[link_port]]
index = 4
name = "i2c0"
kind = "i2c"

[[link_port]]
index = 5
name = "i2c1"
kind = "i2c"

[[link_port]]
index = 6
name = "twai"
kind = "can"

[watchdog]
kind = "rtc-wdt"
trial_ms = 4_000
confirmed_ms = 4_000
# The periods the RTC watchdog can run: the package counts the period in
# calibrated RTC slow clock ticks in 64 bits and writes the stage 0 hold
# register (32 bits) only with a count that fits it (`rwdt::stage0_hold`).
# 3,600,000 ms is 4.28e9 ticks at a slow clock calibrated at 1.19 MHz,
# under 2^32, and 4.9e8 at the nominal 136 kHz RC_SLOW_CLK (ESP32-S3 TRM,
# clock tree). DAGON arms whole milliseconds, from 1.
range_ms = { min = 1, max = 3_600_000 }
# The ESP-IDF 2nd stage with app rollback (vendor/sdkconfig.defaults) aborts
# an image left on trial at its next boot: one boot.
trial_attempts = 1
# Whether the ESP32-S3 has a watchdog-reset flag that survives a later
# reset (the RTC reset cause names only the last reset) is not established.
# No [boot.record] here, so no lockup fuse either way.
flag = "unmeasured"

# The flash cache is off during an operation; the flash driver masks
# interrupts for each (handlers outside IRAM cannot run). DAGON erases one
# 4 KiB sector per operation over all of the flash map: the sector erase
# every candidate part has, so no block erase is assumed. The flash is the
# board's part (a board names it in [flash]); this default is the largest
# 4 KiB sector erase time (tSE max) of the candidate parts:
# - Winbond W25Q80JV, datasheet Revision C: tSE max 400 ms (the part
#   pico-sdk 2.1.1's boot2_w25q080 is written for)
# - Winbond W25X10CL, datasheet Revision G: tSE max 300 ms
# - Renesas (Adesto) AT25SF128A, DS-AT25SF/QF128A-168 Rev. Q: tSE max
#   300 ms at 85 C and at 105 C
# - Winbond W25Q16JV (the Raspberry Pi Pico's part, Pico datasheet
#   Release 21), datasheet Revision H: tSE max 400 ms
# - the flash of the Espressif ESP32-S3-WROOM-1/1U (datasheet v1.8, Table
#   6-8), ESP32-S3-WROOM-2 (v1.7, Table 6-7) and ESP32-S3-MINI-1/1U (v1.7,
#   Table 6-8) modules, which name no part: tSE max 500 ms
# ISSI IS25LP080D (pico-sdk's boot2_is25lp080) is not counted: its datasheet
# could not be obtained, and it is to be checked against this value.
# The value is the largest of these, 500 ms.
# Unverified until checked on hardware. The masking budget of DAGON's own
# code is to be measured on the board.
[execution]
masked_max_us = "unmeasured"
flash_op = "cache-off-masked"
# The ROM SPI flash write takes 4-byte aligned words (esp-storage 0.10,
# FlashStorage::WORD_SIZE), and erased NOR flash reads 0xFF.
write_unit = 4
erased_value = 0xFF
erase_regions = [
    { start = 0x0, len = 0x100_0000, unit = 0x1000, unit_max_ms = { unverified = 500 } },
]

# The last 4 KiB of the dagon partition: after the three header sectors,
# used by nothing.
[conformance]
scratch = { at = 0x71_F000, size = 0x1000 }

# Protection hardware: the Permission Control and World Controller (ESP32-S3
# TRM, "Permission Control" and "World Controller" chapters). DAGON does not
# program them, so the level is none: extensions run unguarded.
[isolation]
level = "none"
kind = "esp-pms"
boot_extensions = false
ext_ram_max = 32_768
root_protection = ["esp-secure-boot", "esp-flash-encryption"]
cache = "id-cache"

[isolation.capabilities]
worlds = 2
gdma_channels = 5
critical_section = "xtensa-level"
reset_cleanup = "peripheral-reset"
background_privileged = true
unwind = "xtensa-world"
timer = "timer-group"
fault_address = true

[[core]]
id = "cpu0"

[[core]]
id = "cpu1"

# Every register block (ESP32-S3 TRM, "System and Memory", peripheral
# address map). The Wi-Fi and Bluetooth MACs are bus masters DAGON never
# enables.
