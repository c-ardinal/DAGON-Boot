[package]
name = "dagon-ed25519"
edition.workspace = true
license.workspace = true
version = "0.1.0"

[features]
# Ed25519Compact, backed by ed25519-compact.
compact = ["dep:ed25519-compact"]

[dependencies]
dagon-format = { path = "../dagon-format" }
ed25519-compact = { version = "2.6", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
# Its own tests check both verifiers.
dagon-ed25519 = { path = ".", features = ["compact"] }
# Independent sources: the differential test and the predicate written
# with another curve implementation for the boundary vectors.
curve25519-dalek = { version = "5", default-features = false }
ed25519-dalek = { version = "3", default-features = false }
serde_json = "1"
