[package]
name = "dagon-topology"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
dagon-format = { path = "../dagon-format" }
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
# The definition format (dagon-mcu.toml, dagon-board.toml); already in the
# lock file through dagon-cli. Parse only: no writer needed.
toml = { version = "0.8", default-features = false, features = ["parse"] }
