[package]
name = "dagon-mcu-stm32f401re"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false
build = "build.rs"

# DAGON MCU package for the STM32F401RE. Without features it is
# host-testable:
#   cargo test --no-default-features --target <host triple>
[workspace]

[package.metadata.dagon]
mcu = "stm32f401re"
# Firmware clippy runs in CI (scripts/ci_crates.py --firmware-lint).
lint = { target = "thumbv7em-none-eabihf", features = ["", "conform", "masked-time"] }

[features]
# node by default: a generated node names this package without features.
default = ["node"]
# The embassy-stm32 parts every image uses: clocks, flash port, IWDG
# guard; the verifying key from DAGON_PUBKEY (the boot core stops here).
hal = ["dep:embassy-stm32", "dep:embassy-time", "dep:cortex-m"]
# Node start-up and the I2C target serving loop (logs through defmt: the
# app links a defmt logger, e.g. defmt-rtt).
node = ["hal", "embassy-stm32?/defmt", "dep:embassy-futures", "dep:embassy-executor", "dep:defmt", "dep:static_cell", "dep:dagon-ed25519", "dep:ed25519-compact"]
# Conformance build: dagon-conform's session answers CONF_LIST, CONF_RUN and
# CONF_RESULT and runs the node-side tests.
conform = ["node", "dep:dagon-conform"]
# The final binary's memory.x comes from this package: an APP slot body
# (slot A, or B with `slot-b`) unless it is a boot image; the boot core
# links for boot core slot A, or B with `slot-b`.
slot-b = []
image-stage0 = []
image-bootcore = []
# The boot core's measuring builds (dagon-mcu-common's boot_time).
boot-time = ["dagon-mcu-common/boot-time"]
# An app built to measure how long DAGON's own code masks interrupts
# (dagon-node's masked_time): the longest in DAGON_MASKED_MAX_US.
masked-time = ["dagon-node/masked-time"]

[dependencies]
dagon-agent = { path = "../../../crates/dagon-agent" }
dagon-events = { path = "../../../crates/dagon-events" }
dagon-core = { path = "../../../crates/dagon-core" }
dagon-format = { path = "../../../crates/dagon-format" }
dagon-port = { path = "../../../crates/dagon-port" }
dagon-proto = { path = "../../../crates/dagon-proto" }
dagon-mcu-common = { path = "../common" }
dagon-node = { path = "../node" }
dagon-conform = { path = "../../../crates/dagon-conform", optional = true }
# The verifier the node's agent checks images with.
dagon-ed25519 = { path = "../../../crates/dagon-ed25519", features = ["compact"], optional = true }
# unstable-pac: NACK the own address (I2C CR1.ACK) while a request runs.
embassy-stm32 = { version = "0.6.0", features = ["stm32f401re", "unstable-pac"], optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-futures = { version = "0.1", optional = true }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-interrupt"], optional = true }
cortex-m = { version = "0.7", optional = true }
defmt = { version = "1", optional = true }
# The node's published events (`node::agent`), the shared flash driver.
static_cell = { version = "2", optional = true }
# Smaller verifier code for the node's agent (the boot stages verify with
# dagon-ed25519's own Ed25519Small).
ed25519-compact = { version = "2.6", default-features = false, features = ["opt_size"], optional = true }

[build-dependencies]
dagon-mcu-build = { path = "../build" }
# build.rs: the inline header's size (memory.x puts the body after it).
dagon-format = { path = "../../../crates/dagon-format" }

[dev-dependencies]
# tests/dma_map.rs: the definition's DMA request mapping against ST's chip
# data (the stm32-metapac embassy-stm32 builds on).
stm32-metapac = { version = "21", default-features = false, features = ["stm32f401re", "metadata"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
dagon-agent = { path = "../../../crates/dagon-agent", features = ["store-tests"] }
dagon-conform = { path = "../../../crates/dagon-conform" }
dagon-ed25519 = { path = "../../../crates/dagon-ed25519", features = ["compact"] }
ed25519-compact = { version = "2.6", default-features = false }
