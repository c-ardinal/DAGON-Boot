[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# Compact SHA-256 rounds keep the boot core inside its 32,256-byte budget.
# --nmagic: otherwise the linker maps the ELF headers into the header gap
# just below the body (slot + 0x000..0x200).
rustflags = ["-C", "link-arg=--nmagic", "-C", "link-arg=-Tlink.x", "--cfg", 'sha2_backend_soft="compact"']
