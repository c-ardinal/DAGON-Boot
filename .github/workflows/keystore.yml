# The API key store on real macOS (login Keychain) and Linux (GNOME Keyring as
# the Secret Service): the store's round trip test, then `dagon ai key set`,
# `status` and `delete` with the key typed through a pseudo-terminal as a
# person would (scripts/keystore_check.py). On Linux also once with no Secret
# Service: set and delete exit 1 with the store's message, status exits 0.
# The key is an obviously fake value that no output may carry. Runs when the
# store code, the locked dependencies or a workflow change, and by hand.
name: keystore

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - crates/dagon-cli/src/keystore.rs
      - Cargo.lock
      - .github/workflows/ci.yml
      - .github/workflows/keystore.yml
      - scripts/keystore_check.py

permissions:
  contents: read

concurrency:
  group: keystore-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DAGON_ALLOW_TEST_KEY: "1"

jobs:
  keystore:
    name: keystore (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustup default "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: |
          cargo build -p dagon-cli --bin dagon --locked
          cargo test -p dagon-cli --bin dagon --locked --no-run
      - name: No Secret Service (Linux)
        if: runner.os == 'Linux'
        # No session bus at all, so no Secret Service can be reached.
        run: env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR="$(mktemp -d)" python3 scripts/keystore_check.py no-store target/debug/dagon
      - name: The store (Linux, GNOME Keyring in its own session bus)
        if: runner.os == 'Linux'
        # The login keyring is created and unlocked with a throwaway password.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnome-keyring dbus
          dbus-run-session -- bash -eo pipefail -c '
            printf ci-throwaway | gnome-keyring-daemon --unlock --components=secrets --daemonize > /dev/null
            cargo test -p dagon-cli --bin dagon --locked -- --ignored --exact keystore::tests::os_store_round_trip 2>&1 \
              | tee /dev/stderr | grep "test result: ok. 1 passed"
            python3 scripts/keystore_check.py store target/debug/dagon'
      - name: The store (macOS, login Keychain)
        if: runner.os == 'macOS'
        run: |
          cargo test -p dagon-cli --bin dagon --locked -- --ignored --exact keystore::tests::os_store_round_trip 2>&1 \
            | tee /dev/stderr | grep "test result: ok. 1 passed"
          python3 scripts/keystore_check.py store target/debug/dagon
