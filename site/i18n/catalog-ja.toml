# The Japanese of what the state machine and port catalogs say, keyed by that English. dagon-catalog's tests fail on a missing or unused key.

"A DAGON link carries frames: the first one arrived, at start or after the link went down. `link`: its kind's code (`dagon_format::with_link_kinds!`); `addr`: the node's own address on it (`NO_ADDR` where a link has none)." = "DAGONのリンクがフレームを送受信します: 起動時か、リンク切断後の最初のフレームが到着しました。`link`: その種類のコード（`dagon_format::with_link_kinds!`）。`addr`: そのリンクでのノード自身のアドレス（アドレスのないリンクでは`NO_ADDR`）。"
"A DAGON link stopped carrying frames: a reply could not be sent, or the link closed." = "DAGONのリンクがフレームの送受信を停止しました: 返答の送信に失敗したか、リンクがクローズしました。"
"A body chunk was written." = "本体のチャンクを書込しました。"
"A confirm of the slot on trial asks `self_check`." = "試行中のスロットの確定時に`self_check`へ照会します。"
"A confirm was refused (not on trial, self-check, store)." = "確定を拒否しました（試行中以外、自己検査、ストア）。"
"A reboot was accepted, after `allow_reboot_now`." = "`allow_reboot_now`の後に、再起動を受理しました。"
"A request arrived on link `via`." = "リンク`via`にリクエストが到着しました。"
"A switch of the boot target was refused." = "ブート対象の切替を拒否しました。"
"An extension answered a decision point after `DECISION_BOUND_MS`; its answer was ignored." = "拡張が`DECISION_BOUND_MS`の経過後に判断点に応答しました。その応答は無視しました。"
"An extension's handler ran longer than its `budget_us` (the manifest's `max_run_us`); the boot went on with the same decision." = "拡張のハンドラの実行時間が`budget_us`（マニフェストの`max_run_us`）を超過しました。ブートは同一の判断で続行しました。"
"A write passed every DAGON guard; `accept_update` is asked next." = "書込の申し出がDAGONの全部のガードに合格しました。次に`accept_update`へ照会します。"
"A write was refused, by a DAGON guard or by an extension's `accept_update`." = "書込の申し出を、DAGONのガードか拡張の`accept_update`が拒否しました。"
"Another core confirmed itself; this one is no longer." = "別のコアが自身を確定しました。このコアは確定状態ではなくなりました。"
"Another slot was set pending; this one no longer is." = "別のスロットが待機状態になりました。このスロットは待機状態ではなくなりました。"
"BOOTSEL/UF2, factory, ROM entry as the MCU and board define" = "マイコンとボードの定義に従うBOOTSEL/UF2、factory、ROMの入口"
"Boot-stage extension calls and their time limits." = "ブート段階の拡張の呼出と、その時間の上限です。"
"DAGON's start began (the agent was made, or restarted); the slot store is read next. `tag`: the node's image target tag as a name digest (`NameDigest`: the compact form \"digest prefix\", made as MCU identities are); a host resolves it from the topology's node tags." = "DAGONの起動を開始しました（エージェントを作成したか、再開しました）。次にスロットのストアを読込します。`tag`: ノードのイメージに付与したターゲットタグの名称ダイジェスト（`NameDigest`: 短縮形式の「ダイジェストの先頭部」で、マイコンの識別情報と同様に作成します）。ホストは構成のノードのタグから解決します。"
"Decision calls to extensions and their bound." = "拡張への判断の呼出と、その上限です。"
"Ed25519 over the project key" = "プロジェクトのキーによるEd25519"
"Header bytes received so far." = "これまでに受信したヘッダのバイト。"
"I2C controller, PIO UART" = "I2Cコントローラ、PIO UART"
"Identity answered." = "識別情報に応答しました。"
"No slot can be started." = "起動可能なスロットが不在です。"
"Requests answered or refused, and the decision points asked." = "応答または拒否したリクエストと、照会した判断点です。"
"SHA-256" = "SHA-256"
"Stage0 gave the pending core up (its starts ran out, or its image failed the check) and the core in `to` recorded it. `version` names the core given up, as in `image`." = "stage0が待機中のコアを断念し（起動回数の上限に到達したか、イメージが検査に失敗しました）、`to`のコアがその結果を記録しました。`version`は`image`と同様、断念したコアの版です。"
"Status answered." = "ステータスに応答しました。"
"The board's bring-up ran. `board`: the board definition's id as a name digest (`NameDigest`); a host resolves it from the board definitions it knows." = "ボードの起動処理を実行しました。`board`: ボード定義のidの名称ダイジェスト（`NameDigest`）。ホストは既知のボード定義から解決します。"
"The body or its header did not verify, or could not be stored." = "本体かそのヘッダの検証に失敗したか、保存に失敗しました。"
"The body read back matches its digest." = "再読込した本体がダイジェストと一致しました。"
"The body verified and the header written and read back: the slot holds an image." = "本体を検証し、ヘッダを書込して再読込しました。スロットにイメージがあります。"
"The boot core rolled the slot back (attempts exhausted, or the pending image failed its check) and started `to`. `version` names the image rolled back: the marker is that image's (a new image in the slot clears it), so a consumer tells a new rollback from the one replayed at every start." = "ブートローダがスロットをロールバックし（試行回数の上限に到達したか、待機中のイメージが検査に失敗しました）、`to`を起動しました。`version`はロールバック対象のイメージの版です。ロールバック表示は該当イメージ専用で（スロットへの新規イメージ書込で解除）、消費側は新規のロールバックと起動ごとに再生される既存のロールバックを識別可能です。"
"The boot core started the pending slot on trial (`attempt` boots so far, of the `max` its boot core allows)." = "ブートローダが待機中のスロットを試行として起動しました（これまでのブート回数は`attempt`回で、ブートローダの許可する上限は`max`回）。"
"The boot core stays here for good." = "ブートローダはこの状態で恒久的に停止します。"
"The boot core's sequence from the armed watchdog to the jump or the halt. Its events reach the boot core's extensions as they happen; nothing an extension does changes the decision." = "ウォッチドッグの有効化からジャンプか停止までの、ブートローダの手順です。そのイベントは発生時にブートローダの拡張へ到達します。拡張の動作に関係なく、判断は変化しません。"
"The confirmed slot had been set pending again; another slot was set pending, or the boot core ended its trial: it is the confirmed slot again." = "確定済のスロットが再度待機状態に設定されていました。別のスロットが待機状態になったか、ブートローダがその試行を終了したので、確定済のスロットに復帰します。"
"The core is the one stage0 tries at the next reset." = "次回のリセットでstage0が試行するコアになりました。"
"The core's body verified and its header written and read back." = "コアの本体を検証し、そのヘッダを書込して再読込しました。"
"The header was refused (signature, key, compatibility, size)." = "ヘッダを拒否しました（署名、キー、互換性、サイズ）。"
"The header's signature, key and compatibility checked out." = "ヘッダの署名、キー、互換性を検証しました。"
"The idle boot core slot was erased for a new core; the running and confirmed core's slot only when it is the MCU's one boot core slot." = "新規のコアのために、未使用のブートローダのスロットを消去しました。動作中かつ確定済のコアのスロットを消去するのは、マイコンにブートローダのスロットが1つしかない場合だけです。"
"The last event before control leaves DAGON." = "制御がDAGONから離脱する直前の最終イベント。"
"The last event before the decision is made." = "判断の直前の最終イベント。"
"The lifecycle of one boot core slot of a self-boot MCU with a stage0 (its definition's `bootcore` slots), kept in the boot core records of the state log. The agent writes a new core into the idle slot (into the only one when the MCU has one) and sets it pending; stage0 tries it and the core settles the trial itself: `confirmed` by the new core after its own check, `rolled_back` by the old one when stage0 gave the new one up. The app sees those at its next start." = "stage0のあるself-bootのマイコンの、ブートローダのスロット1つのライフサイクルです（定義の`bootcore`のスロット）。状態ログのブートローダの記録に保持します。エージェントが新規のコアを未使用のスロット（マイコンにスロットが1つだけの場合はそのスロット）に書込して待機状態にし、stage0がそのコアを試行し、コアが自身で試行を決着させます。新規のコアが自身の検査の後に`confirmed`、stage0が新規のコアを断念した場合は旧コアが`rolled_back`を記録します。アプリは次回の起動でそれらを参照します。"
"The lifecycle of one image slot (each APP slot the MCU definition gives). The slot store's mutators run only inside these transitions. `trial_started` and `rolled_back` are the boot core's changes, replayed at start from the slot store." = "イメージのスロット1つのライフサイクルです（マイコンの定義が付与するAPPのスロットそれぞれ）。スロットのストアの変更メソッドは、これらの遷移の内部だけで動作します。`trial_started`と`rolled_back`はブートローダの変更で、起動時にスロットのストアからリプレイします。"
"The new core passed its own check and confirmed itself." = "新規のコアが自身の検査に合格し、自身を確定しました。"
"The node's start and its DAGON links: what the MCU package's start and serving loop report through the agent." = "ノードの起動とそのDAGONのリンクです: マイコン定義のコードの起動処理と応答ループが、エージェント経由で報告します。"
"The other slot was confirmed; this one is no longer." = "他方のスロットが確定しました。このスロットは確定状態ではなくなりました。"
"The reply has left; the reset follows." = "返答を送信しました。その後にリセットします。"
"The host told the node its write's one progress number, the one the host's caller shows for this node." = "ホストが、書込の進捗率（1つの数値）をノードに通知しました。ホストの呼出側がこのノードについて表示する数値と同一です。"
"The reply to the last request left, `ms` after it arrived." = "最後のリクエストへの返答を、リクエストの到着から`ms`の経過後に送信しました。"
"The slot is erased and the header (where the target has one) accepted: body chunks are taken from here." = "スロットを消去し、ヘッダ（ターゲットにヘッダがある場合）を受理しました。以降は本体のチャンクを受信します。"
"The slot is the one tried on the next boot." = "次回のブートで試行するスロットになりました。"
"The slot on trial was confirmed after its self-check." = "試行中のスロットを、自己検査の後に確定しました。"
"The slot store was read at start." = "起動時にスロットのストアを読込しました。"
"The slot to start is final (`trial`: the pending slot on a counted attempt)." = "起動するスロットが確定しました（`trial`: 計数対象の試行での待機中のスロット）。"
"The slot was erased for a new image (never the slot the writer runs from; the app never erases its confirmed slot either)." = "新規のイメージのためにスロットを消去しました（書込側が動作しているスロットは消去しません。アプリは確定済のスロットも消去しません）。"
"The start took over the boot core's watchdog: its period, and what the guard does with it while the image is on trial." = "起動処理がブートローダのウォッチドッグを継承しました: その周期と、イメージの試行中にガードが実施する処理。"
"The state log was read (`ok: false`: no valid face)." = "状態ログを読込しました（`ok: false`: 有効な面が不在）。"
"The transfer was dropped." = "転送を破棄しました。"
"The write session: an offer, the header, the body, the end." = "書込のセッションです: 申し出からヘッダ、本体、終了までを扱います。"
"The watchdog runs with the trial period; from here extensions run." = "ウォッチドッグが試行の周期で動作します。以降は拡張が動作します。"
"The whole body arrived; it is hashed and read back next." = "本体全体が到着しました。次にハッシュを計算して再読込します。"
"USB CDC, UART, I2C target, PIO UART" = "USB CDC、UART、I2Cターゲット、PIO UART"
"`RebootRequest` -> `Delay`" = "`RebootRequest` -> `Delay`"
"`TrialInfo` -> `Health`" = "`TrialInfo` -> `Health`"
"`UpdateOffer` -> `Accept`" = "`UpdateOffer` -> `Accept`"
"`max_attempts` from the definition, pending before confirmed" = "定義の`max_attempts`、確定より待機を優先"
"a decision point, 3" = "判断点、3"
"an extension adds a path, never removes DAGON's" = "拡張は経路の追加だけが可能で、DAGONの経路は削除不可です"
"a program or request run after a host event" = "ホストのイベントの後に実行するプログラムやリクエスト"
"accept" = "受理"
"accepting what DAGON refused (not asked then)" = "DAGONが拒否したものの受理（その場合は照会しません）"
"an additional recovery path: a service window for a transport, a vendor download mode" = "追加の復旧経路: 転送用のサービスの時間枠、ベンダーのダウンロードモード"
"an external agent the CLI and the page hand requests to" = "CLIとページがリクエストを委託する外部のエージェント"
"ask" = "照会"
"at boot it runs in the sandbox with the declared pins and buses" = "ブート時は宣言済のピンとバスを使用してサンドボックス内で動作します"
"attempt limit, which slot wins" = "試行の上限、優先するスロット"
"board package, libraries, user (first answer wins)" = "ボードの定義、ライブラリ、利用者（最初の応答が優先）"
"body hash" = "本体のハッシュ"
"building node images" = "ノードのイメージのビルド"
"bytes in and out of a link" = "リンクに入出力するバイト"
"cargo" = "cargo"
"confirming a slot not on trial; confirming outside the `confirmed` transition" = "試行中以外のスロットの確定。`confirmed`の遷移の外部での確定"
"data-defined (action definitions)" = "データ定義（アクションの定義）"
"data-defined (agent definitions)" = "データ定義（エージェントの定義）"
"each call within `DECISION_BOUND_MS` (a later answer is ignored); `Pending` keeps the \"state\" status and the host retries" = "呼出ごとに`DECISION_BOUND_MS`以内（遅延した応答は無視します）。`Pending`は\"state\"のステータスを維持し、ホストが再試行します"
"each call within `DECISION_BOUND_MS` (a later answer is ignored); asked after every DAGON guard passed, before erase" = "呼出ごとに`DECISION_BOUND_MS`以内（遅延した応答は無視します）。DAGONの全部のガードに合格した後、消去の直前に照会します"
"each call within `DECISION_BOUND_MS`; `Now` or `After(ms)`, ms capped at half the shorter watchdog period of the MCU definition; DAGON replies first and keeps feeding while it waits" = "呼出ごとに`DECISION_BOUND_MS`以内。`Now`か`After(ms)`で、msの上限はマイコン定義の短期側ウォッチドッグ周期の半分。DAGONは最初に返答し、待機中もキックを継続します"
"every protocol's triggers pass the same guards; replacing them would let a transport write what DAGON refuses" = "全プロトコルのトリガーが同一のガードを経由します。置換すると、DAGONが拒否するものを転送が書込可能になります"
"extra VERSION TLVs, extra status, a UDS DID table" = "追加のVERSIONのTLV、追加のステータス、UDSのDIDの表"
"file key pair" = "ファイルのキーの組"
"header signature, key lookup" = "ヘッダの署名、キーの検索"
"healthy" = "健全"
"how a node reaches another node over a link, through `dagon_port::NodeLink`" = "`dagon_port::NodeLink`による、リンク経由での別ノードへの到達方法"
"it cannot skip a guard: the session machine runs the guards, not the protocol" = "ガードの省略は不可能です。ガードを実行するのはセッションの状態機械で、プロトコルではありません"
"it is what keeps extensions away from DAGON's state" = "拡張をDAGONの状態から隔離する機構です"
"it is what makes every extension see every event and keeps answers bounded" = "全部の拡張に全部のイベントを配信し、応答を有界に維持する機構です"
"its format is DAGON's retained contract and it is never an input to a boot or confirm decision" = "その形式はDAGONの保持の規約で、ブートや確定の判断の入力にはなりません"
"messages ↔ session triggers: identity, status, transfer, switch, reboot, confirm" = "メッセージ ↔ セッションのトリガー: 識別、ステータス、転送、切替、再起動、確定"
"none" = "なし"
"now" = "即時"
"refusing a reboot; a delay beyond the cap" = "再起動の拒否。上限を超過する遅延"
"serial" = "シリアル"
"signing images and releases" = "イメージとリリースの署名"
"skipping the key check and image verification, done before the listing is shown" = "一覧の表示前に実施する、キーの確認とイメージの検証の省略"
"software" = "ソフトウェア"
"the DAGON wire" = "DAGONのリンク"
"the MCU definition's flash layout" = "マイコン定義のフラッシュの配置"
"the MCU's" = "マイコンの定義"
"the `[boot] led` and `halt` of the board definition through the action program" = "アクションプログラム経由の、ボード定義の`[boot] led`と`halt`"
"the board definition's" = "ボードの定義"
"the board's power, pins and buses at app start" = "アプリ起動時のボードの電源、ピン、バス"
"the deploy listing -> yes or no" = "デプロイの一覧 -> はいかいいえ"
"the entry gate, the service calls, the protection map and the lockup fuse" = "入口のゲート、サービスの呼出、保護マップ、ロックアップヒューズ"
"the health answer when a slot on trial is confirmed" = "試行中スロットの確定時における健全性の応答"
"the host is trusted by definition; the device verifies" = "ホストは定義上信頼されます。検証の担当はデバイスです"
"the image-lifecycle machine over the slot store and the state log" = "スロットのストアと状態ログの上位にある、イメージのライフサイクルの状態機械"
"the interactive user (terminal, page) or `--yes`; never actions or host extensions" = "対話する利用者（ターミナル、ページ）か`--yes`。アクションやホストの拡張は応答しません"
"the only writer of persistent image state; every change emits its event and keeps the confirm rule" = "永続イメージ状態の唯一の書込元。どの変更もイベントを発行し、確定の規則を維持します"
"the order of a layer's chain (publisher, board definition, libraries, user) and the decision bounds" = "レイヤーのチェーンの順番（公開元、ボードの定義、ライブラリ、利用者）と判断の上限"
"the primitives the verifier and digest use; hardware acceleration, HSM" = "検証器とダイジェストが使用する基本要素。ハードウェアによる高速化、HSM"
"the retained record of boot events the app replays" = "アプリがリプレイするブートのイベントの保持記録"
"the write session's guards: target, slot, header signature and compatibility, body digest" = "書込のセッションのガード: ターゲット、スロット、ヘッダの署名と互換性、本体のダイジェスト"
"the watchdog that guards boot and trial" = "ブートと試行を保護するウォッチドッグ"
"until the user answers" = "利用者の応答まで"
"what a phase or a boot outcome looks like" = "段階やブートの結果の表示方法"
"where `Recent` overflow and extension logs go" = "`Recent`の溢れと拡張のログの出力先"
"where images live" = "イメージの格納先"
"receives the signing key from where the user chose to keep it (an environment variable, the OS key store, 1Password and so on)" = "利用者が選択した格納先（環境変数、OSのキーストア、1Passwordなど）から署名のキーを受信"
"where the state log lives" = "状態ログの格納先"
"There is no sandbox at run time (Service ABI, Entry Gate, Operation Cancellation, Fault Unwind, Lockup Fuse, Reset Cleanup, SandboxArch). Definitions are checked and protection maps are generated." = "実行時のサンドボックスは存在しません（Service ABI、Entry Gate、Operation Cancellation、Fault Unwind、Lockup Fuse、Reset Cleanup、SandboxArch）。定義の検査と保護マップの生成は実装済みです。"
"The firmware writes no boot record: its format exists only in the executable model (`dagon-retained-model`)." = "ファームウェアはブート記録を保存しません。その形式の存在箇所は実行可能モデル（`dagon-retained-model`）のみです。"
"The CLI reads the signing key only from a file: `--key` and `DAGON_SIGNING_KEY` each name a file's path." = "CLIの署名キーの取得元はファイルのみです。`--key`と`DAGON_SIGNING_KEY`はいずれもファイルのパスの指定です。"
