[package]
name = "dagon-mcu-esp32s3"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Id in the topology board table; `dagon gen` finds this package by it.
[package.metadata.dagon]
mcu = "esp32s3"
# Firmware clippy runs in CI (scripts/ci_crates.py --firmware-lint); the
# target is .cargo/config.toml's, the toolchain rust-toolchain.toml's.
lint = { features = ["", "conform"] }

# DAGON on the ESP32-S3 (kind V, behind the ESP-IDF 2nd stage with rollback):
# flash and otadata slot store, watchdog and liveness, boot selection, link
# serving on a UART and USB Serial/JTAG, ROM entry, the partition table.
# Nothing board-specific: pins, IO expanders and power managers come from a
# board crate (`targets/boards/*`) through `board::Board`.
# Standalone workspace, built with the espup Xtensa toolchain; the pure
# modules also build and test on the host.
[workspace]

[features]
default = ["hal", "panic-reset"]
# The firmware side on esp-hal (flash, boot selection, clock, watchdog,
# reset, links, the node task). Off for stage0, which uses the pure
# modules and the ROM's functions only.
hal = [
    "dep:esp-hal",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-rtos",
    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:embassy-time",
    "dep:embedded-io-async",
    "dep:static_cell",
]
# Reset on panic (so a trial image that panics rolls back).
panic-reset = ["hal"]
# Conformance build: answers CONF_RUN (node-side tests) in front of the agent.
conform = ["dep:dagon-conform"]

[dependencies]
dagon-agent = { path = "../../../crates/dagon-agent" }
# The verifier the node's agent checks images with.
dagon-ed25519 = { path = "../../../crates/dagon-ed25519", features = ["compact"] }
dagon-events = { path = "../../../crates/dagon-events" }
dagon-conform = { path = "../../../crates/dagon-conform", optional = true }
dagon-format = { path = "../../../crates/dagon-format" }
dagon-mcu-common = { path = "../common" }
dagon-node = { path = "../node" }
dagon-port = { path = "../../../crates/dagon-port" }
dagon-proto = { path = "../../../crates/dagon-proto" }

[build-dependencies]
# The constants of dagon-mcu.toml (build.rs).
dagon-mcu-build = { path = "../build" }

[dev-dependencies]
dagon-agent = { path = "../../../crates/dagon-agent", features = ["store-tests"] }
ed25519-compact = { version = "2.6", default-features = false }

# tests/peripheral_map.rs: the definition's register blocks against the
# chip data esp-hal builds on (the esp32s3 PAC, generated from Espressif's
# SVD). Host tests only: the PAC is esp-hal's own dependency on the target.
[target.'cfg(not(target_arch = "xtensa"))'.dev-dependencies]
esp32s3 = { version = "0.36", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"], optional = true }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"], optional = true }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy"], optional = true }
embassy-executor = { version = "0.10", optional = true }
embassy-futures = { version = "0.1", optional = true }
embassy-time = { version = "0.5", optional = true }
embedded-io-async = { version = "0.7", optional = true }
static_cell = { version = "2", optional = true }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

# Size-tuned Ed25519: at "s" the field arithmetic is inlined into one
# function of several hundred KiB.
[profile.release.package.ed25519-compact]
opt-level = "z"

[profile.dev]
opt-level = "s"

# esp-bootloader-esp-idf computes `ota_seq - 1` for any counted seq, 0 included
# (otadata written by older tools); release builds already wrap.
[profile.dev.package.esp-bootloader-esp-idf]
overflow-checks = false
