[connection]
label = "USB-C"
hint = "USB-C でつないでから、書き込んでください（つながらないときは BOOT を押しながら）。"

[[doctor]]
what = "espup"
probe = ["espup", "--version"]
expect = "runs"
fix = ["cargo", "install", "espup", "--locked"]

[[doctor]]
what = "esp toolchain"
probe = ["rustup", "toolchain", "list"]
expect = { prefix = "esp" }
fix = ["espup", "install"]
slow = true

[[doctor]]
what = "espflash"
probe = ["espflash", "--version"]
expect = "runs"
fix = ["cargo", "install", "espflash", "--locked"]
