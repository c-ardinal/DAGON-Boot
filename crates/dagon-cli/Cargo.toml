[package]
name = "dagon-cli"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "DAGON Boot command line tool"
repository = "https://github.com/c-ardinal/DAGON-Boot"

# cargo binstall dagon-cli: the archives scripts/release.py makes, attached
# to the GitHub release of the tag v<version>.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dagon-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "dagon"
path = "src/main.rs"

[dependencies]
dagon-format = { path = "../dagon-format" }
ed25519-compact = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dagon-topology = { path = "../dagon-topology" }
dagon-sign = { path = "../dagon-sign" }
dagon-proto = { path = "../dagon-proto" }
dagon-sim = { path = "../dagon-sim" }
dagon-host = { path = "../dagon-host", features = ["defs"] }
dagon-port = { path = "../dagon-port" }
dagon-conform = { path = "../dagon-conform" }
# MPL-2.0. No libudev: Linux builds need no system library.
serialport = { version = "4.10", default-features = false }
# MIT OR Apache-2.0. Blocking HTTPS for the Claude API (rustls, no system TLS library).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
serde_json = "1"
# dagon serve. All MIT OR Apache-2.0 and already in the lock file except
# sha1 (RustCrypto, same family as sha2): request parsing, the WebSocket
# accept key, the passphrase and editing dagon.toml without losing comments.
httparse = "1"
sha1 = "0.11"
base64 = "0.23"
getrandom = "0.4"
toml_edit = "0.22"
