[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# --nmagic: keeps the ELF headers out of the 512-byte image header gap.
rustflags = ["-C", "link-arg=--nmagic", "-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x"]

[env]
# The folder `dagon gen` writes this node's MCU definition into
# (`mcu.toml`): the app builds from the definition every image of the
# node builds from, the project's overrides included.
DAGON_BOOT_CRATE = { value = "../../boot/{{node}}", relative = true, force = true }
# This node's image target tag: the app announces it, and the boot core
# for this node must be built with the same DAGON_TARGET_TAG.
DAGON_TARGET_TAG = { value = "{{tag}}", force = true }
DEFMT_LOG = "info"
