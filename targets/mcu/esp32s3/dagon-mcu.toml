[connection]
label = "USB-C"
hint = "USB-C で接続後、書込してください（接続できない場合は BOOT 押下）。"

[[doctor]]
what = "espup"
probe = ["espup", "--version"]
expect = "runs"
fix = ["cargo", "install", "espup", "--locked"]

[[doctor]]
what = "esp toolchain"
probe = ["rustup", "toolchain", "list"]
expect = { prefix = "esp" }
fix = ["espup", "install"]
slow = true

[[doctor]]
what = "espflash"
probe = ["espflash", "--version"]
expect = "runs"
fix = ["cargo", "install", "espflash", "--locked"]
