[package]
name = "dagon-relay"
edition.workspace = true
license.workspace = true
version = "0.1.0"

[dependencies]
dagon-port = { path = "../dagon-port" }
dagon-proto = { path = "../dagon-proto" }
embassy-futures = "0.1"
# The link ports' channels.
embassy-sync = "0.8"
heapless = "0.9"

[dev-dependencies]
# The relay names no agent type: the agent crate reaches dagon-events, whose
# crates each register their machines (dagon-catalog), and the relay has no
# machine of its own. The host test drives a real agent.
dagon-agent = { path = "../dagon-agent" }
# The host test: the agent's chain and verifier, the simulator's nodes,
# store and bus.
dagon-ed25519 = { path = "../dagon-ed25519", features = ["compact"] }
dagon-events = { path = "../dagon-events" }
# The SHOW the host test sends carries a version.
dagon-format = { path = "../dagon-format" }
dagon-sim = { path = "../dagon-sim" }
