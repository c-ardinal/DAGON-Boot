# Words scripts/ja_wording.py looks for in Japanese text.
#
# pattern: a Python regular expression. Unless raw = true, it matches only where
#   the character before it is not a kanji, so a native word is not found inside
#   a Sino-Japanese compound (使う matches 使います, not 使用). A verb is written as
#   its kanji stem and the kana that may follow it (使[わいうえおっ]); a noun that
#   ends in a kanji says what may not follow it (印(?![一-鿿]) leaves 印刷 alone).
# word: the dictionary form shown in the report.
# suggest: the Sino-Japanese compound or katakana word to use instead.
#
# Retired terms come first, then native words, then conjunctions. Entries are tried in order and a
# character is reported once, so a longer entry (書き換える) comes before a
# shorter one it contains (書く).

# Terms the wording rule replaces by a defined term.
retired = [
  { pattern = '書き込[まみむめもん]|書き込め', word = "書き込む", suggest = "書込（書込中/書込済/書込不可）" },
  { pattern = '(?<![電原分因粒量])[親子孫]機(?![器能械構種関材])', word = "親機/子機/孫機", suggest = "ノード", raw = true },
  { pattern = '作[らりるれろっ]', word = "作る", suggest = "作成/生成" },
]

# Conjunctions the wording rule replaces.
joint = [
  { pattern = 'ながら', word = "ながら", suggest = "同時に", raw = true },
  { pattern = 'てから', word = "てから", suggest = "後に", raw = true },
  { pattern = '(?<=ん)でから', word = "でから", suggest = "後に", raw = true },
]

