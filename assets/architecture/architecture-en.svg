="308" height="59.7" rx="6" class="dg-box"/><text x="950.0" y="273.85" class="dg-t" text-anchor="middle">dagon-sign</text><text x="950.0" y="291.85" class="dg-s" text-anchor="middle">keys, signing, packages</text><rect x="796" y="314.7" width="308" height="59.7" rx="6" class="dg-box"/><text x="950.0" y="341.55" class="dg-t" text-anchor="middle">dagon-topology</text><text x="950.0" y="359.55" class="dg-s" text-anchor="middle">checks the setup</text><rect x="796" y="382.3" width="308" height="59.7" rx="6" class="dg-box"/><text x="950.0" y="409.15000000000003" class="dg-t" text-anchor="middle">dagon-sim</text><text x="950.0" y="427.15000000000003" class="dg-s" text-anchor="middle">a partner without boards</text><rect x="796" y="462" width="308" height="116" rx="6" class="dg-box"/><text x="950.0" y="525.0" class="dg-t" text-anchor="middle">USB</text><path d="M796 520.0H766" class="dg-a"/><text x="16" y="626" class="dg-s" text-anchor="start">On the ESP32-S3 the vendor's 2nd stage starts the app, in place of stage0 and the boot loader.</text></svg>
