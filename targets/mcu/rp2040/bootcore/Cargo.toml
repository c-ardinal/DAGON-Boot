[package]
name = "dagon-rp2040-bootcore"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.0.0"
publish = false

# Standalone: built for thumbv6m only, so it stays out of the host workspace.
# Its memory.x and verifying key come from dagon-mcu-rp2040.
[workspace]

[features]
# Backlight patterns at each step and on panic (bring-up diagnostics).
diag = ["dagon-mcu-rp2040/diag-panic"]

[dependencies]
dagon-mcu-rp2040 = { path = "..", features = ["hal", "image-bootcore"] }
dagon-core = { path = "../../../../crates/dagon-core" }
dagon-format = { path = "../../../../crates/dagon-format" }
embassy-rp = { version = "0.10.0", features = ["rp2040", "critical-section-impl", "boot2-none", "unstable-pac"] }
embassy-time = "0.5"
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
