# Words scripts/ja_wording.py looks for in Japanese text.
#
# A verb or adjective is written as its stem and its conjugation class (stem, conj);
# the class, from [conjugation] at the end, gives the kana that may follow the stem,
# so every form is found from one table (使 + godan_wa finds 使う, 使って, 使わない,
# 使います, 使えば). Any other word is a Python regular expression (pattern).
# Unless raw = true, a match starts only where the character before it is not a
# kanji, so a native word is not found inside a Sino-Japanese compound (使う finds
# 使います, not 使用). A noun that ends in a kanji says what may not follow it
# (印(?![一-鿿]) leaves 印刷 alone).
# word: the dictionary form shown in the report.
# suggest: the Sino-Japanese compound or katakana word to use instead.
#
# A character is reported once: where entries overlap, the longest match wins
# (書き換える over 書く); on equal length, retired terms, then native words, then
# conjunctions, each in file order. scripts/test_ja_wording.py counts the entries.

# Terms the wording rule replaces by a defined term.
retired = [
  { stem = '書き込', conj = "godan_ma", word = "書き込む", suggest = "書込（書込中/書込済/書込不可）" },
  { pattern = '(?<![電原分因粒量])[親子孫]機(?![器能械構種関材])', word = "親機/子機/孫機", suggest = "ノード", raw = true },
  { stem = '作', conj = "godan_ra", word = "作る", suggest = "作成/生成" },
]

# Conjunctions the wording rule replaces.
joint = [
  { pattern = 'ながら', word = "ながら", suggest = "同時に", raw = true },
  { pattern = 'てから', word = "てから", suggest = "後に", raw = true },
  { pattern = '(?<=ん)でから', word = "でから", suggest = "後に", raw = true },
]

