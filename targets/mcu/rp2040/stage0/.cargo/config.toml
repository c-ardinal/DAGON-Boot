[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
# The default (unrolled) SHA-256, as in the boot core and app: the compact
# variant was the one stage0-only difference when stage0 refused a boot core
# the host accepted.
rustflags = ["-C", "link-arg=--nmagic", "-C", "link-arg=-Tlink.x"]
