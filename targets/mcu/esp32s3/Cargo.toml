[package]
name = "dagon-mcu-esp32s3"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# DAGON on the ESP32-S3 (kind V, behind the ESP-IDF 2nd stage with rollback):
# flash and otadata slot store, watchdog and liveness, boot selection, link
# serving on a UART and USB Serial/JTAG, ROM entry, the partition table.
# Nothing board-specific: pins, IO expanders and power managers come from a
# board crate (`targets/boards/*`) through `board::Board`.
# Standalone workspace, built with the espup Xtensa toolchain; the pure
# modules also build and test on the host.
[workspace]

[features]
default = ["panic-reset"]
# Reset on panic (so a trial image that panics rolls back).
panic-reset = []
# Conformance build: answers CONF_RUN (node-side tests) in front of the agent.
conform = ["dep:dagon-conform"]

[dependencies]
dagon-agent = { path = "../../../crates/dagon-agent" }
dagon-conform = { path = "../../../crates/dagon-conform", optional = true }
dagon-format = { path = "../../../crates/dagon-format" }
dagon-port = { path = "../../../crates/dagon-port" }
dagon-proto = { path = "../../../crates/dagon-proto" }

[dev-dependencies]
ed25519-compact = { version = "2.6", default-features = false }

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy"] }
embassy-executor = "0.10"
embassy-futures = "0.1"
embassy-time = "0.5"
embedded-io-async = "0.7"
static_cell = "2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

# Size-tuned Ed25519: at "s" the field arithmetic is inlined into one
# function of several hundred KiB.
[profile.release.package.ed25519-compact]
opt-level = "z"

[profile.dev]
opt-level = "s"

# esp-bootloader-esp-idf computes `ota_seq - 1` for any counted seq, 0 included
# (otadata written by older tools); release builds already wrap.
[profile.dev.package.esp-bootloader-esp-idf]
overflow-checks = false
