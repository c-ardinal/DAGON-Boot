# The Japanese of what gen.py copies from English sources, keyed by that English. gen.py fails on a missing or unused key.

"A layout of this format, written whole." = "この形式の配置ファイル。全体を一括で記述します。"
"A device on a board bus: `id` (`a-z 0-9 - _`), `bus`, `addr`, `max_transfer` (required: the most data bytes it takes in one transfer, from its datasheet; the bus port and boot programs keep to it), `regs = [{ name, reg }]` (its registers by name, `a-z 0-9 _`), `writable` (registers anything outside DAGON may write: numbers or names of `regs`)." = "ボードのバス上のデバイス: `id`（`a-z 0-9 - _`）、`bus`、`addr`、`max_transfer`（必須: 1回の転送で受信可能なデータの最大バイト数。データシートの値を使用します。バスのポートとブートプログラムはこの値を遵守します）、`regs = [{ name, reg }]`（名称付きのレジスタ、`a-z 0-9 _`）、`writable`（DAGON外部からの書込を許可するレジスタ: `regs`の番号か名称）。"
"A folder with a dagon.toml." = "dagon.tomlのあるフォルダ。"
"A job's state, stage, progress, log lines, question and result." = "作業の状態、段階、進捗、ログの行、質問、結果。"
"A job; the model's questions go to the page." = "作業。モデルからの質問はページへ送信します。"
"A kept package's bytes, once they verify." = "保存済のパッケージのバイト列。検証に合格した場合だけ返却します。"
"A name looked up on PATH, or a path." = "PATHで検索する名称、またはパス。"
"A release of the project's out/release by name, once it verifies with the project's key." = "プロジェクトのout/releaseにあるリリースを名称で返却します。プロジェクトのキーで検証に合格した場合だけです。"
"An environment variable that overrides `model`, if set." = "`model`を上書きする環境変数（設定時）。"
"Before the user text on stdin." = "stdinで、ユーザーの文に先行して送信します。"
"Board `[[bus]]` ids, reached through the bus service." = "ボードの`[[bus]]`のid。バスのサービス経由で使用します。"
"Board `[[peripheral]]` ids: windows onto window-eligible blocks." = "ボードの`[[peripheral]]`のid: ウィンドウ化が可能なブロックへのウィンドウ。"
"Board `[[pin]]` names, reached through the pin service." = "ボードの`[[pin]]`の名称。ピンのサービス経由で使用します。"
"Board id used in `nodes[].board`." = "`nodes[].board`で使用するボードのid。"
"Board names for MCU blocks extensions may declare: `id`, `mcu` (the MCU `[[peripheral]]` id; never the controller of a `dagon = true` bus)." = "拡張が宣言可能なマイコンのブロックの、ボードでの名称: `id`、`mcu`（マイコンの`[[peripheral]]`のid。`dagon = true`のバスのコントローラは指定不可）。"
"Board-independent DAGON logic over the port contract: the state log (fold, load, append, compaction), the kind S boot decision (verify, trial, rollback), the boot core slot rules of a stage0 MCU and build-time key helpers." = "ポートの規約上で動作する、ボード非依存のDAGONのロジック: 状態ログ（集約、読込、追記、コンパクション）、kind Sのブート判断（検証、試行、ロールバック）、stage0のあるマイコンのブートローダのスロット規則、ビルド時のキーの補助。"
"Browser build of the shared Rust rules: MCU and board definitions, topology check and compile, release verification, HELLO payloads and version text. Each export is a thin wrapper so the page and the CLI apply the same code." = "共有するRustの規則のブラウザ向けビルド: マイコンとボードの定義、構成の確認とコンパイル、リリースの検証、HELLOのペイロードとバージョンの文字列。公開する関数はいずれも薄いラッパーで、ページとCLIが同一のコードを使用します。"
"Builds a release from every signed image, each of the version its node's crate gave it (`version`, if given, must be every image's)." = "全部の署名付きイメージからリリースを作成します。各イメージのバージョンは、ノードのcrateが付与したバージョンです（`version`を指定する場合、全イメージのバージョンと一致する必要があります）。"
"Builds the applications of `nodes` (all when left out) as a job; the answer lists each built slot and its size." = "`nodes`（省略時は全部）のアプリケーションを作業としてビルドします。応答にはビルドした各スロットとそのサイズを列挙します。"
"Byte layouts shared by every DAGON component: image header, manifest, release bundle (`.dgb`), state log, topology canonical binary, plus CRC-32, SHA-256 and the signature verifier interface ([`SigVerifier`]). All multi-byte fields are little-endian." = "DAGONの全部品が共有するバイトのレイアウト: イメージのヘッダ、マニフェスト、リリースのバンドル（`.dgb`）、状態ログ、構成の正規のバイナリ、さらにCRC-32、SHA-256、署名検証のインターフェース（[`SigVerifier`]）。複数バイトの欄は全部リトルエンディアンです。"
"DAGON Boot command line tool" = "DAGON Bootのコマンドラインツール"
"DAGON agent: a node's update session, the same in its application and in its boot core. It answers HELLO/STATUS/VERSION, receives images into a slot its writer does not run from, checks them with the verifier it is built with, switches the boot target and confirms." = "DAGONのエージェント: ノードの書込のセッションで、アプリケーションでもブートローダでも同一です。HELLO/STATUS/VERSIONに応答し、書込側が動作していないスロットにイメージを受信し、組込の検証器で検証し、ブート対象を切替して確定します。"
"DAGON conformance tests: the 12 normal-path checks a port must pass." = "DAGONの適合試験: ポートの合格が必要な、正常経路の12の検査。"
"DAGON extension manifests (dagon-extension.toml), their validation against the port and event catalogs and the node's definitions, the protection-kind map generators, and the files dagon gen writes from them" = "DAGONの拡張のマニフェスト（dagon-extension.toml）、ポートとイベントのカタログとノードの定義との照合による検証、保護の種類ごとのマップの生成器、それらからdagon genが出力するファイル"
"DAGON lifecycle events: state machines whose transitions emit events, extensions, ports and the published event state" = "DAGONのライフサイクルイベント: 遷移がイベントを発行する状態機械、拡張、ポート、公開するイベントの状態"
"DAGON link v2: frame format (shared by USB CDC, UART and I2C), the command table, status codes, the field grammar of every payload with its one reader and writer, the typed payloads and the I2C mailbox state." = "DAGONのリンクv2: フレームの形式（USB CDC、UART、I2Cで共通）、コマンドの表、ステータスコード、全ペイロードの欄の文法とその唯一の読取側と書込側、型付きのペイロード、I2Cのメールボックスの状態。"
"DAGON parts built from this package for a first write: `name`, `sub` (folder in the package), `bin`." = "最初の書込のために、この定義のフォルダからビルドするDAGONの部品: `name`、`sub`（定義のフォルダ内のフォルダ）、`bin`。"
"DAGON simulator: deterministic stand-ins for the hardware so the host tools, the browser UI and tests have a partner without boards." = "DAGONのシミュレータ: ハードウェアの決定的な代役です。ホストのツール、ブラウザのUI、テストは、ボードなしでも対向側を確保します。"
"Dagon.toml in a folder that has a 構成 but none, for that YAML (`yaml`, or the folder's only one); key pair in ~/.dagon/keys/<folder> when none. Then opens it." = "構成はあるがdagon.tomlが不在のフォルダに、そのYAML（`yaml`、またはフォルダ内の唯一のYAML）用のdagon.tomlを作成します。キーの組が不在なら~/.dagon/keys/<folder>に作成します。その後にオープンします。"
"Decision points asked in one of the listed layers; a trusted extension answers none." = "一覧のいずれかのレイヤーで照会する判断点。信頼された拡張はどれにも応答しません。"
"Definition format number (`3`; left out means 1). A dagon that does not read the number refuses the file (site/src/content/docs/explanation/versioning.md)." = "定義の形式番号（`3`。省略時は1）。その番号を解釈しないdagonは、ファイルを拒否します（site/src/content/docs/explanation/versioning.md）。"
"Device layers: `max_run_us` 1 to the decision bound (50 ms) for an untrusted extension and for every one that observes events (each handler call is timed against it); untrusted only: `stack_bytes` at least 256, `text_bytes` above 0 (the `[limits]` keys below)." = "デバイスのレイヤー: 信頼されていない拡張と、イベントを観測する全部の拡張では、`max_run_us`は1から判断の上限（50 ms）まで（ハンドラの呼出ごとにこの値と照合して計測します）。信頼されていない拡張のみ: `stack_bytes`は256以上、`text_bytes`は0超（以下の`[limits]`のキー）。"
"Display name (`STM32F401RE`)." = "表示名（`STM32F401RE`）。"
"ESP-IDF partition table CSV in the package (rows need explicit offset and size)." = "定義フォルダ内にあるESP-IDFパーティションテーブルのCSV（各行にオフセットとサイズの明示が必要です）。"
"Ed25519 signature verification (RFC 8032) for DAGON's signed structures, as [`SigVerifier`] implementations. Verify only: nothing here signs or holds a secret." = "DAGONの署名付き構造を検証するEd25519（RFC 8032）の署名検証。[`SigVerifier`]の実装です。検証だけを実行し、署名せず、秘密の値も保持しません。"
"Environment variables passed on besides [`BASE_ENV`] (names only)." = "[`BASE_ENV`]以外に送付する環境変数（名称のみ）。"
"Every DAGON state machine's catalog in one registry, and the generated Events and Ports pages of the documentation" = "DAGONの全状態機械のカタログを1つに集約した登録簿と、文書のイベントとポートの生成ページ"
"Every processor core, `id`; DAGON runs on the first." = "プロセッサのコアごと、`id`。DAGONは最初のコアで動作します。"
"Every register block: `id`, `base`, `size`, `window_eligible` (an extension may get it as a window), `bus_master` (it can write memory), `privileged_why` (one or a list of `dma`, `flash`, `watchdog`, `clock`, `reset`, `irq-routing`, `pinmux`, `power`, `rom`, `core-control`, `protection`, `shared`), `dma = { streams, channels }` (a DMA controller, a bus master: its streams, each selecting one of `channels` requests), `dma_requests = [{ signal, controller, stream, channel }]` (the block's rows of the MCU's DMA request mapping table: `signal` `a-z 0-9` such as `tx`, `rx`, `ch1`, `up`; one cell serves one block). Board packages and MCU templates take DMA streams from these (first row of the request on a free stream)." = "レジスタブロックごと: `id`、`base`、`size`、`window_eligible`（拡張がウィンドウとして取得可能）、`bus_master`（メモリへの書込が可能）、`privileged_why`（`dma`、`flash`、`watchdog`、`clock`、`reset`、`irq-routing`、`pinmux`、`power`、`rom`、`core-control`、`protection`、`shared`の1つか一覧）、`dma = { streams, channels }`（DMAコントローラ、つまりバスマスタ: そのストリーム。各ストリームは`channels`個の要求から1つを選択します）、`dma_requests = [{ signal, controller, stream, channel }]`（マイコンのDMA要求の割当表のうち、このブロックの行: `signal`は`a-z 0-9`で`tx`、`rx`、`ch1`、`up`など。1つのセルは1つのブロック専用です）。ボードの定義とマイコンのテンプレートは、この情報からDMAのストリームを取得します（未使用のストリームのうち、その要求の最初の行）。"
"Executable model of DAGON's retained and persistent formats under fault injection" = "障害注入下での、DAGONの保持と永続の形式の実行可能なモデル"
"First-write tool: `kind` and its parameters (below)." = "最初の書込のツール: `kind`とそのパラメータ（下記）。"
"Flash size (must hold one of the MCU's flash maps)." = "フラッシュのサイズ（マイコンのフラッシュマップのいずれかを収容可能なこと）。"
"GPIO0..n-1 checked for nodes without a board; 0 when pins are named by port." = "ボード未指定のノードで確認するGPIO0..n-1。ピンをポートで命名する場合は0。"
"Hardware facts of the execution model (site/src/content/docs/en/explanation/lifecycle-events.md, \"Execution model\"): `masked_max_us` (longest DAGON's own code masks interrupts, 1..=1000), `flash_op` (what an erase or program stops: `fetch-stall`, `xip-off-masked`, `cache-off-masked`), `write_unit` (required: the bytes one flash write covers, a power of two dividing every erase unit), `erased_value` (required: the byte erased flash reads as), `erase_regions = [{ start, len, unit, unit_max_ms }]` (the flash DAGON erases in: each region's erase unit and that unit's datasheet maximum erase time; whole units, not overlapping; 2 x `unit_max_ms` at most `watchdog.trial_ms` and `watchdog.confirmed_ms`). A fact is a number checked against its source (cite it in a comment), `{ unverified = N }` or `\"unmeasured\"` (no value; not for `unit_max_ms`)." = "実行モデルのハードウェアの事実（site/src/content/docs/en/explanation/lifecycle-events.mdの「Execution model」）: `masked_max_us`（DAGON自身のコードが割込を禁止する最長時間、1..=1000）、`flash_op`（消去や書込で停止するもの: `fetch-stall`、`xip-off-masked`、`cache-off-masked`）、`write_unit`（必須。フラッシュへの1回の書込の対象バイト数。2のべき乗で、全消去単位の約数であること）、`erased_value`（必須。消去済のフラッシュの読出値）、`erase_regions = [{ start, len, unit, unit_max_ms }]`（DAGONが消去するフラッシュ: 領域ごとの消去単位と、その単位の消去に要するデータシート上の最大時間。単位の整数倍で、重複しないこと。`unit_max_ms`の2倍が`watchdog.trial_ms`と`watchdog.confirmed_ms`以下であること）。事実とは、出典と照合した数値（コメントで出典を明示します）、`{ unverified = N }`、または`\"unmeasured\"`（値なし。`unit_max_ms`には使用不可）です。"
"Every XFER target and slot the node receives into: `target` (`app`, `bootcore`, `agent`; the removed `topology` is refused), `slot` (`a`, `b`, `factory`), `start`, `capacity` (largest body, header excluded), `header` (`\"inline\"` at `start`, or `{ detached = <address> }`), `partition` (optional: the partition the body region is, checked against the table). One per target and slot, with `[execution]`; each `[[slot]]` image has its own, and an erase of the largest body lies in `erase_regions`. The node and the host plan every erase from these." = "ノードが受信するXFERの対象とスロットの全部: `target`（`app`、`bootcore`、`agent`。廃止した`topology`は拒否します）、`slot`（`a`、`b`、`factory`）、`start`、`capacity`（ヘッダを除外した本体の最大サイズ）、`header`（`start`の位置の`\"inline\"`か、`{ detached = <address> }`）、`partition`（任意: 本体の領域に該当するパーティション。パーティションの表と照合します）。対象とスロットごとに1つで、`[execution]`と同時に記述します。`[[slot]]`のイメージはそれぞれ固有の項目を保持し、最大の本体の消去範囲は`erase_regions`の範囲内です。ノードもホストも、全部の消去をこの情報から計画します。"
"Host-side procedures shared by the CLI and the browser: discover, status, apply, rollback, confirm, recover." = "CLIとブラウザが共有するホスト側の手順: 検出、状態、適用、ロールバック、確定、復旧。"
"How DAGON keeps extensions away from itself (below). Left out: `kind = \"none\"`, `level = \"none\"`." = "DAGONが拡張を自身から隔離する方法（下記）。省略時は`kind = \"none\"`、`level = \"none\"`です。"
"How DAGON reaches the agent this way: one of the transport kinds and its keys." = "この接続方法でDAGONがエージェントに到達する手段: 転送の種類の1つとそのキー。"
"How a node board is wired unless the topology says otherwise: `kind` (`i2c`, `uart`, `can`, `ethernet`), `iface` (`hw-uart0`, `pio-uart`), `addr`, `baud`, `control` (`full`, `cooperative`), `rom_entry` (`force-download-boot`, `m5pm1`, `stm32-i2c-rom`). Left out for the coordinator." = "構成で別途指定しない場合の、ノードのボードの配線: `kind`（`i2c`、`uart`、`can`、`ethernet`）、`iface`（`hw-uart0`、`pio-uart`）、`addr`、`baud`、`control`（`full`、`cooperative`）、`rom_entry`（`force-download-boot`、`m5pm1`、`stm32-i2c-rom`）。コーディネータでは省略します。"
"The I2C bus speeds the MCU package's firmware runs DAGON's I2C link at, as controller or target: `hzs`. The topology check (V-20) refuses a bus `speed_hz` that any node's list does not name, and DAGON Console offers only the speeds every node on the bus names. Required on an MCU whose `[links]` has `i2c`: without it, every I2C bus that MCU's firmware is on is refused, since no speed on it is known to work. `[link_i2c.controller]` states how the firmware makes SCL when the node drives the bus, as its HAL computes it: its clock divided by the bus speed's period rounded to the nearest whole cycle, which the HAL refuses under `min_period` cycles. The clock is `clock_hz` or `clock = \"app\"`, as `[link_uart]`'s, exactly one of them; `fast_ppm` and `slow_ppm` bound how far SCL may run above and below `speed_hz`, its clock's tolerance included. V-20 refuses a bus whose controller (the end its target does not reach at an address) runs SCL outside those bounds on its node's clock, cannot make the speed, or runs on an internal setup without `tolerance_ppm`, and a bus driven by a node whose MCU states no `[link_i2c.controller]`." = "マイコンの定義のファームウェアが、コントローラとしてもターゲットとしても、DAGONのI2Cリンクに使用するバスの速度の一覧: `hzs`。構成の確認（V-20）は、バス上のいずれかのノードの一覧に不在のバスの`speed_hz`を拒否します。DAGON Consoleは、バス上の全ノードの一覧にある速度だけを選択肢に表示します。`[links]`に`i2c`があるマイコンでは必須です。この項目が不在の場合、そのマイコンのファームウェアが接続する全部のI2Cバスを拒否します。動作が判明している速度が不在のためです。`[link_i2c.controller]`は、ノードがバスを駆動する場合のSCLの生成方法で、HALの計算と同一です: そのクロックを、バスの速度の周期を最近接の整数のサイクル数に丸めた値で除算します。HALは`min_period`サイクル未満の周期を拒否します。クロックは`[link_uart]`と同様に`clock_hz`か`clock = \"app\"`のどちらか1つです。`fast_ppm`と`slow_ppm`は、`speed_hz`に対するSCLの上側と下側の許容誤差で、クロックの許容誤差を加算した値です。構成の確認（V-20）は、バスのコントローラ（ターゲットがアドレスで到達しない側の端）が、ノードのクロックで許容範囲外のSCLを生成するか、その速度を生成不可能か、`tolerance_ppm`が不在のinternalの設定で動作するバスを拒否します。`[link_i2c.controller]`が不在のマイコンのノードが駆動するバスも拒否します。"
"How the UART the MCU package runs DAGON's UART links on makes a bit rate, as its HAL computes it: its clock divided by `clocks_per_bit` times a divider with `frac_bits` fraction bits, rounded down. The clock is `clock_hz` (a frequency no clock setup changes) or `clock = \"app\"` (the core clock of the node's `[[app.clock]]` setup, which V-26 takes for each node; a node on an internal setup without `tolerance_ppm` runs no UART link), exactly one of them. `bauds` lists the bit rates the firmware runs its link at; `fast_ppm` and `slow_ppm` (required) bound how far its bit rate may run above and below a link's `baud`, its clock's tolerance included (`slow_ppm` at most 1000000). The topology check (V-26) refuses a link `baud` that either end's list does not name or that either end makes outside its bounds, and DAGON Console offers only the speeds both ends name. Required on an MCU whose `[links]` has `uart`: without it, every UART link that MCU's firmware runs is refused, since no speed on it is known to work." = "マイコンの定義のコードがDAGONのUARTリンクに使用するUARTの、ビットレートの算出方法。HALの計算と同一です: そのクロックを、`clocks_per_bit`と`frac_bits`ビットの小数部付きの分周比との積で除算します。端数処理は切捨です。クロックは`clock_hz`（クロック設定に依存しない周波数）か`clock = \"app\"`（ノードの`[[app.clock]]`設定のコアクロック。V-26はノードごとにこの値を使用します。`tolerance_ppm`が不在のinternalの設定で動作するノードは、UARTリンクを使用しません）のどちらか1つです。`bauds`は、そのコードがリンクに使用するビットレートの一覧です。`fast_ppm`と`slow_ppm`（必須）は、リンクの`baud`に対するビットレートの上側と下側の許容誤差で、クロックの許容誤差を加算した値です（`slow_ppm`は1000000以下）。構成の確認（V-26）は、どちらかの端の一覧に不在か、どちらかの端で許容範囲外の誤差を生じるリンクの`baud`を拒否します。DAGON Consoleは両端の一覧にある速度だけを選択肢に表示します。`[links]`に`uart`があるマイコンでは必須です。この項目が不在の場合、そのマイコンのファームウェアが使用する全部のUARTリンクを拒否します。動作が判明している速度が不在のためです。"
"How the system text reaches the program." = "システムの文をプログラムへ送付する方法。"
"How the user connects it for a write: `label`, `hint`." = "書込時に利用者が接続する方法: `label`、`hint`。"
"Image header `mcu_id`; unique." = "イメージのヘッダの`mcu_id`。重複しないこと。"
"In a file in the call's folder, named by the `{system_file}` arg." = "呼出のフォルダ内のファイルに格納し、`{system_file}`の引数で指定します。"
"Keeps a package about to be written, once it verifies with the project's key; answers its id." = "これから書込するパッケージを保存します。プロジェクトのキーで検証に合格した場合だけです。そのidを応答します。"
"Link kinds the MCU package's firmware implements (its `LINK_KINDS`)." = "マイコンの定義のファームウェアが実装するリンクの種類（その`LINK_KINDS`）。"
"How the boot stage that writes the app (`[writers] app` names a kind other than `app`) receives when the app does not answer (left out: no link kind takes part in a listen window, and the boot stage receives only in update or recovery mode): `listen_window_ms` (0 to 200, 50 when left out; 0 opens no window), how long after its start it waits for STAY before it boots, and `kinds = { <link kind> = true | false, ... }`, whether each link kind takes part in the listen window (a kind left out does not). A kind the other end enumerates first (`usb-cdc`) cannot. The boot stage receives on every link of a kind of `[links]`, none above another: on a kind that takes part from its start, on the others in update or recovery mode. A project changes the window with `[mcu_override.<id>.boot_receive]`." = "アプリを書込するブート段階（`[writers] app`が`app`以外の種類を指定する場合）が、アプリの無応答時に受信する方法（省略時は、どのリンクの種類も待受時間に参加せず、ブート段階は書込モードか復旧モードでのみ受信します）: `listen_window_ms`（0から200。省略時は50。0は待受時間を開始しません）は、起動からブートまでにSTAYを待機する時間です。`kinds = { <link kind> = true | false, ... }`は、リンクの種類ごとの待受時間への参加の有無です（記述しない種類は不参加）。対向側が先行して列挙する種類（`usb-cdc`）は参加不可です。ブート段階は`[links]`の種類の全リンクで受信し、リンク間の優先順位はありません。参加する種類では起動直後から、他の種類では書込モードか復旧モードで受信します。プロジェクトは`[mcu_override.<id>.boot_receive]`で待受時間を変更します。"
"MCU id (must be defined)." = "マイコンのid（定義済であること）。"
"MCU id used in topologies (`stm32f401re`)." = "構成で使用するマイコンのid（`stm32f401re`）。"
"Most RAM the sandboxed extensions of one image take, regions rounded up (required when `kind` is not `none`)." = "1つのイメージのサンドボックスの拡張が使用するRAMの上限。リージョンのサイズは切上で計算します（`kind`が`none`以外の場合は必須）。"
"One question to DAGON, answered in this request." = "DAGONへの1つの質問。このリクエストで応答します。"
"Only for an MCU that can be the coordinator: `pio_state_machines`, `pio_uart_state_machines` (per link), `uart0_tx`, `uart0_rx`. A topology may make the MCU its coordinator only when `[coordinator]` is defined (V-25)." = "コーディネータに指定可能なマイコン専用: `pio_state_machines`、`pio_uart_state_machines`（リンクごと）、`uart0_tx`、`uart0_rx`。構成がそのマイコンをコーディネータに指定可能なのは、`[coordinator]`が定義済の場合だけです（V-25）。"
"Optional fixed regions: `stage0 = { at, size }`, `bootcore_log` / `app_log = { faces = [a, b], face_size }`; a `bootcore_log` equal to `app_log` is one log holding both the boot core and the APP records." = "任意の固定リージョン: `stage0 = { at, size }`、`bootcore_log` / `app_log = { faces = [a, b], face_size }`。`bootcore_log`が`app_log`と同一の場合は、ブートローダとAPPの両方の記録を保持する1つのログです。"
"The MCU's DAGON stage0, exactly when `[layout]` has `stage0`: `key` (where stage0 reads the key it checks a boot core's signature with: `\"flash\"`, the default and the only place, a constant in stage0's own flash written when stage0 is built; any other place is refused), `region_bytes` (the whole region, equal to `[layout] stage0` size; stage0's image leaves 1/16 of it free, which its link checks) and `head_bytes` (required: the bytes at the region start the boot ROM reads before stage0, such as the RP2040's boot2; 0 for none; less than `region_bytes`). `[[stage0.clock]]` lists the clock setups stage0 may run on: exactly one `{ source = \"internal\", out_hz }` (the MCU's own oscillator as it runs from reset) and any number of `{ source = \"crystal\" | \"external\", in_hz, out_hz, pll = { ... } }`, where `pll` holds the MCU's own fields (RP2040: `refdiv`, `fbdiv`, `postdiv1`, `postdiv2`, from a crystal; STM32F401: `m`, `n`, `p`, `q`, `flash_wait_states`, from a crystal or an external clock), which name the PLL whose rules check them; a `pll` whose fields name no PLL DAGON knows is refused. For a node, stage0 runs on the setup of the board's `[clock]` source (same source and `in_hz`) with the highest `out_hz`, else on the internal one; two setups of one source and `in_hz` with the same `out_hz` are refused." = "マイコンのDAGONのstage0。`[layout]`に`stage0`がある場合だけ記述します: `key`（stage0がブートローダの署名の検証に使用するキーの格納先。既定で唯一の格納先は`\"flash\"`で、stage0のビルド時にstage0自身のフラッシュに書込する定数です。他の格納先は拒否します）、`region_bytes`（領域の全体で、`[layout] stage0`のサイズと同一です。stage0のイメージはその1/16を未使用領域として確保し、リンク処理がその確保を検証します）と`head_bytes`（必須。領域の先頭で、ブートROMがstage0に先行して読込するバイト数。RP2040のboot2などです。不要なら0。`region_bytes`未満であること）。`[[stage0.clock]]`はstage0が動作するクロックの設定を列挙します: `{ source = \"internal\", out_hz }`（リセット直後から動作するマイコン自身の発振器）を1つだけと、`{ source = \"crystal\" | \"external\", in_hz, out_hz, pll = { ... } }`を任意の数。`pll`はマイコン固有の項目を保持し（RP2040: `refdiv`、`fbdiv`、`postdiv1`、`postdiv2`で、水晶から。STM32F401: `m`、`n`、`p`、`q`、`flash_wait_states`で、水晶または外部クロックから）、その項目に該当するPLLの規則で検証します。DAGONが認識するどのPLLにも該当しない項目の`pll`は拒否します。ノードのstage0は、ボードの`[clock]`の供給元（同一の種類と`in_hz`）に一致する設定のうち`out_hz`が最大の設定で動作し、一致する設定が不在ならinternalの設定で動作します。種類と`in_hz`が同一で`out_hz`も同一の設定が2つあれば拒否します。"
"Parts built from the board package itself (`name`, `sub`, `bin`)." = "ボードの定義自体からビルドする部品（`name`、`sub`、`bin`）。"
"Per handler call." = "ハンドラの呼出ごと。"
"Pins the page wires new links to when this board is the coordinator: `i2c = { controller, sda, scl }` (a new I2C bus; `controller` is one of the board's `i2c`) and `pio_uart = { tx, rx }` (a new PIO UART link), numbered GPIOs below the MCU's `gpio_count`. Only on boards whose MCU has `[coordinator]`." = "このボードがコーディネータの場合に、ページが新規リンクを配線するピン: `i2c = { controller, sda, scl }`（新規I2Cバス。`controller`はボードの`i2c`のいずれか）と`pio_uart = { tx, rx }`（新規PIO UARTリンク）。番号がマイコンの`gpio_count`未満のGPIOです。マイコンに`[coordinator]`があるボード専用です。"
"Port contract: what a board provides to DAGON." = "ポートの規約: ボードがDAGONに提供するもの。"
"Porting DAGON to a board: answers 501." = "DAGONのボード移植: 応答は501です。"
"Ports that exist in every listed layer; a trusted-only port needs `trusted = true`." = "一覧の全レイヤーにあるポート。信頼された拡張専用のポートには`trusted = true`が必要です。"
"Product name." = "製品名。"
"ROM I2C bootloader (`stm32-i2c-rom`): `name` (as check messages call it), `addr`, `max_hz`, `erase_sectors`, `pairs = [{ controller, sda, scl }]` it listens on." = "ROMのI2Cブートローダ（`stm32-i2c-rom`）: `name`（確認のメッセージでの名称）、`addr`、`max_hz`、`erase_sectors`、待受対象の`pairs = [{ controller, sda, scl }]`。"
"Read first; a number this dagon does not read is refused with both numbers." = "最初に読込します。このdagonが解釈しない番号は、両方の番号を明示して拒否します。"
"Records the user's consent to send to that agent that way; anything short of an explicit yes for a defined agent and way records nothing." = "そのエージェントにその接続方法で送信することへの利用者の同意を記録します。定義済のエージェントと接続方法への明示的な同意以外は、何も記録しません。"
"Registers the way's key in the OS credential store. The answer is GET /v1/agent's body (whether a key is registered, never the key)." = "接続方法のキーをOSの資格情報ストアに登録します。応答はGET /v1/agentの本文です（キーの登録の有無で、キー自体は対象外です）。"
"Removes the way's key (fine when none was registered)." = "接続方法のキーを削除します（未登録の場合も成功します）。"
"Replaces `[build.<id>]` in dagon.toml, keeping the rest of the file." = "dagon.tomlの`[build.<id>]`を置換します。ファイルの他の部分は変更しません。"
"Required (at least [`STACK_MIN`]) for a sandboxed extension; a trusted one runs on DAGON's stack." = "サンドボックスの拡張には必須です（[`STACK_MIN`]以上）。信頼された拡張はDAGONのスタックで動作します。"
"Root-image protection `dagon provision` may set: `rdp1` (reversible), `rdp2` (permanent), `wrp` (reversible), `esp-secure-boot`, `esp-flash-encryption` (permanent)." = "`dagon provision`が設定可能なルートイメージの保護: `rdp1`（復元可能）、`rdp2`（永久）、`wrp`（復元可能）、`esp-secure-boot`、`esp-flash-encryption`（永久）。"
"ST-LINK probe connected" = "ST-LINKのプローブを接続済"
"STM32 system-memory boot loader on I2C (ST AN4221), driven from the host through the hub's NRST/BOOT0 lines and raw I2C transactions." = "I2CのSTM32システムメモリのブートローダ（ST AN4221）。ホストから、コーディネータのNRST/BOOT0の信号線と未加工のI2Cの通信で駆動します。"
"Signing for DAGON: keys, signed images, release bundles and first-install flash contents." = "DAGONの署名: キー、署名付きのイメージ、リリースのバンドル、初回インストールのフラッシュの内容。"
"Signs the built applications of `nodes` with the CLI's key." = "`nodes`のビルド済のアプリケーションに、CLIのキーで署名します。"
"Stage0's bytes for the ROM path's full rewrite of an MCU with a stage0, as provision wrote them: <provision_dir>/<node>/stage0.bin. Stage0 carries no signature; the host checks it fits the MCU's stage0 region before writing it." = "stage0のあるマイコンをROMの経路で全体再書込する際のstage0のバイト列。provisionが出力したもので、<provision_dir>/<node>/stage0.binです。stage0に署名はありません。ホストは書込前に、マイコンのstage0の領域に収容可能かを確認します。"
"Stops a running job." = "実行中の作業を停止します。"
"The 12 conformance tests on `node` through the hub, after the page hands over the port." = "ページによるポートの受渡後に、PC接続ノード経由で`node`に12の適合試験を実施します。"
"The MCU has a DAGON boot stage that runs extensions (`port = \"self-boot\"` only)." = "マイコンが、拡張を実行するDAGONのブート段階を保持します（`port = \"self-boot\"`の場合のみ）。"
"The `anthropic-version` header." = "`anthropic-version`のヘッダ。"
"The agent's id: lower-case letters, digits and '-', up to 32; unique among all agents." = "エージェントのid: 小文字、数字、'-'で32文字まで。全エージェントの中で重複しないこと。"
"The agents and their ways (whether each can be used here; never a key, path or command), the consent, what linking sends." = "エージェントとその接続方法（それぞれの使用可否。キー、パス、コマンドは対象外）、同意、接続時の送信内容。"
"The arguments, in order; `{system_file}` is replaced by the system text's file when `system = \"file\"`." = "引数を順番に。`system = \"file\"`の場合は`{system_file}`をシステムの文のファイルに置換します。"
"The board's buses: `id` (`a-z 0-9 - _`), `kind` (`i2c`, `spi`, `uart`, `can`), `controller` (an MCU `[[peripheral]]`), its pins by signal (`sda`, `scl` for i2c; `tx` and/or `rx` for uart; `tx`, `rx` for can; `sck` and `mosi` and/or `miso` for spi), `hz` (i2c, spi) or `baud` (uart, can; on a `dagon = true` UART bus the link speed of a build dagon does not give the topology's, see below), `dagon` (`true`: DAGON's own link runs on it, so neither the bus nor its controller is ever an extension's), `dma` (`true`: the board package opens or hands out the bus with DMA; i2c, spi, uart; its tx and rx streams come from the MCU's `dma_requests`, buses in order, and the board package's build writes them as `<Bus>TxDma`/`<Bus>RxDma`, `take_dma!` and `bind_<bus>_dma!`)." = "ボードのバス: `id`（`a-z 0-9 - _`）、`kind`（`i2c`、`spi`、`uart`、`can`）、`controller`（マイコンの`[[peripheral]]`）、信号ごとのピン（i2cは`sda`、`scl`。uartは`tx`と`rx`の両方かどちらか。canは`tx`、`rx`。spiは`sck`と、`mosi`と`miso`の両方かどちらか）、`hz`（i2c、spi）または`baud`（uart、can。`dagon = true`のUARTバスでは、dagonが構成の速度を指定しないビルドのリンクの速度。後述）、`dagon`（`true`: DAGON自身のリンクがこのバスで動作するので、バスもそのコントローラも拡張の所有にはなりません）、`dma`（`true`: ボードの定義のコードはバスをDMA経由でオープンするか受渡します。i2c、spi、uart。txとrxのストリームは、マイコンの`dma_requests`からバスの順番に取得し、ボードの定義のビルドが`<Bus>TxDma`/`<Bus>RxDma`、`take_dma!`、`bind_<bus>_dma!`として出力します）。"
"The board's pins: `pin`, `name` (what the board package's code takes it by, `a-z 0-9 _`), `boot` (a boot program may drive it), `levels` (allowed levels; all when left out)." = "ボードのピン: `pin`、`name`（ボードの定義のコードが参照する名称、`a-z 0-9 _`）、`boot`（ブートプログラムが駆動可能）、`levels`（許可するレベル。省略時は全部）。"
"The boot core's sequence as a state machine: every step from the armed watchdog to the jump or the halt is an event the boot core's extensions observe" = "状態機械としてのブートローダの手順: ウォッチドッグの有効化からジャンプか停止までの各ステップが、ブートローダの拡張が観測するイベントです"
"The boot stage's board values: `led` (a `[[pin]]`), `led_active` (`high`, `low`), `halt = { pattern, period_ms }` (`blink`, `code`, `off`; with `led` on an MCU with a DAGON stage0, a `blink` period is at least 10 ms, since stage0 blinks its code in tenths of it), `power_hold = { pin, level }`. Its boot action programs, `[[boot.action]]`: A boot action program (`boot-program` format 1): `on` (a boot event the event catalog marks action-capable) and `ops`: `{ op = \"led\", state }` (`on`, `off`, `toggle`), `{ op = \"gpio\", pin, level }` (a `[[pin]]` with `boot = true`; the power hold pin takes only its hold level), `{ op = \"delay\", ms }` (1 to 20), `{ op = \"bus_write\", device, reg, bytes }` (a `[[device]]` register in its `writable` list, 1 to 8 bytes, only on an MCU with `boot_capabilities = [\"i2c\"]`). At most 32 ops and 50 ms per event, a bus write counting 5 ms." = "ブート段階のボードの値: `led`（`[[pin]]`）、`led_active`（`high`、`low`）、`halt = { pattern, period_ms }`（`blink`、`code`、`off`。DAGONのstage0があるマイコンで`led`がある場合は、stage0が周期の10分の1単位でコードを点滅させるため、`blink`の周期は10 ms以上です）、`power_hold = { pin, level }`。ブートのアクションプログラムは`[[boot.action]]`です。ブートのアクションプログラム（`boot-program`形式1）: `on`（イベントのカタログがアクション対応と明示するブートイベント）と`ops`: `{ op = \"led\", state }`（`on`、`off`、`toggle`）、`{ op = \"gpio\", pin, level }`（`boot = true`の`[[pin]]`。電源保持のピンは保持のレベルのみ）、`{ op = \"delay\", ms }`（1から20）、`{ op = \"bus_write\", device, reg, bytes }`（`writable`の一覧にある`[[device]]`のレジスタ、1から8バイト。`boot_capabilities = [\"i2c\"]`のマイコンのみ）。イベントごとに最大32の操作と50 msで、バスの書込は5 msとして計算します。"
"The definition format, [`FORMAT`]." = "定義の形式、[`FORMAT`]。"
"The definitions in use as `Registry::to_json` gives them, for the page's dagon-wasm (`load_definitions`)." = "使用中の定義を`Registry::to_json`の形式で。ページのdagon-wasm用です（`load_definitions`）。"
"The extension is part of DAGON for the project: it runs privileged, in DAGON's own memory, and nothing of the sandbox holds against it. A trusted-only port needs it; an extension that only observes may say it too (code of the project's own that runs in the boot core)." = "この拡張は、そのプロジェクトにとってDAGONの一部です。特権で、DAGON自身のメモリ内で動作し、サンドボックスの制限はどれも無効です。信頼された拡張専用のポートには必要です。観測専用の拡張も指定可能です（ブートローダで動作する、プロジェクト自身のコード）。"
"The extension's id: `a-z 0-9 -`, 1 to 32 characters." = "拡張のid: `a-z 0-9 -`、1から32文字。"
"The file's text: a plain relative path from the folder of the definition (`~/.dagon/agents/` for the user's own agents), up to 64 KiB of UTF-8." = "ファイルの内容: 定義のフォルダ（利用者独自のエージェントは`~/.dagon/agents/`）からの単純な相対パス。UTF-8で64 KiBまでです。"
"The files `dagon new` writes into a new project for this agent (its instructions and skills), in order; none when left out." = "`dagon new`がこのエージェント用に新規プロジェクトへ出力するファイル（指示とスキル）を順番に。省略時は出力しません。"
"The folders in a folder under home (default: home), each marked when it holds a dagon.toml. Key folders are left out." = "ホーム配下のフォルダ内のフォルダ（既定はホーム）。dagon.tomlがあるフォルダにマークを付与します。キーのフォルダは除外します。"
"The kind's capability record, read back from the hardware at boot (a mismatch turns the level to `none`). `armv6m-mpu`: `mpu_regions` 0 or 8, `min_region` at least 256, `subregions_from`; `armv7m-mpu`: `mpu_regions` 8 or 16, `min_region` at least 32, `subregions_from`; `armv8m-mpu`: `mpu_regions` 0, 4, 8, 12 or 16; `armv8m-tz`: `sau_regions` (0, 4, 8), `s_mpu_regions`, `ns_mpu_regions`, `idau = [{ base, size, attribution }]`; `riscv-pmp`, `riscv-epmp`: `pmp_entries` (0, 16, 64), `grain`, `na4`, `tor`; `esp-pms`: `worlds`, `gdma_channels`, `memory_regions`, `peripheral_slots`. Every kind: `critical_section` (`primask` on armv6m, `basepri` on armv7m and armv8m, `mstatus-mie` on RISC-V, `xtensa-level` on esp-pms), `unwind` (`cortex-m-exception`, `armv8m-tz`, `riscv-trap`, `xtensa-world`, by kind), `timer` (`systick`, `riscv-mtime`, `timer-group`), `reset_cleanup` (`peripheral-reset`, `reinit`), `background_privileged`, `fault_address`; optionally `np_max_us` and `dma_stop_max_us`, which may only lower DAGON's bounds (50 and 20)." = "その種類の能力の記録。ブート時にハードウェアから再読込します（不一致の場合はレベルが`none`になります）。`armv6m-mpu`: `mpu_regions`は0か8、`min_region`は256以上、`subregions_from`。`armv7m-mpu`: `mpu_regions`は8か16、`min_region`は32以上、`subregions_from`。`armv8m-mpu`: `mpu_regions`は0、4、8、12、16。`armv8m-tz`: `sau_regions`（0、4、8）、`s_mpu_regions`、`ns_mpu_regions`、`idau = [{ base, size, attribution }]`。`riscv-pmp`、`riscv-epmp`: `pmp_entries`（0、16、64）、`grain`、`na4`、`tor`。`esp-pms`: `worlds`、`gdma_channels`、`memory_regions`、`peripheral_slots`。全種類共通: `critical_section`（armv6mは`primask`、armv7mとarmv8mは`basepri`、RISC-Vは`mstatus-mie`、esp-pmsは`xtensa-level`）、`unwind`（種類ごとに`cortex-m-exception`、`armv8m-tz`、`riscv-trap`、`xtensa-world`）、`timer`（`systick`、`riscv-mtime`、`timer-group`）、`reset_cleanup`（`peripheral-reset`、`reinit`）、`background_privileged`、`fault_address`。任意で`np_max_us`と`dma_stop_max_us`。これらはDAGONの上限（50と20）の引下げだけが可能です。"
"The layers it runs in: `boot`, `app`, `relay`, `host`." = "動作するレイヤー: `boot`、`app`、`relay`、`host`。"
"The messages endpoint, https only." = "messagesのエンドポイント。httpsのみです。"
"The model named in each request." = "各リクエストで指定するモデル。"
"The name the linking texts show for this way." = "接続時の文に表示する、この接続方法の名称。"
"The name the linking texts show." = "接続時の文に表示する名称。"
"The newest .dgb of the project's out/release." = "プロジェクトのout/releaseで最新の.dgb。"
"The node's `[build.<id>]` table of dagon.toml (404 when it has none)." = "dagon.tomlにあるノードの`[build.<id>]`テーブル（不在の場合は404）。"
"The node's last conformance result (404 before the first run)." = "ノードの直近の適合試験結果（初回実行前は404）。"
"The node's signed boot core (the ROM path): [provision.<node>] bootcore, else <provision_dir>/<node>/bootcore.img." = "ノードの署名付きのブートローダ（ROMの経路）: [provision.<node>] bootcore、不在の場合は<provision_dir>/<node>/bootcore.img。"
"The open project and the recent ones." = "オープン中のプロジェクトと、最近のプロジェクト。"
"The packages kept in the project (out/deploy), newest version first, each with the version it gives each node." = "プロジェクトに保存済のパッケージ（out/deploy）。最新バージョンから順番に、各ノードに付与するバージョンと同時に返却します。"
"The project's 構成 YAML as it is on disk (404 before the first save)." = "ディスク上の、プロジェクトの構成のYAML（初回保存前は404）。"
"The protection hardware: `armv6m-mpu`, `armv7m-mpu`, `armv8m-mpu`, `armv8m-tz`, `riscv-pmp`, `riscv-epmp`, `esp-pms`, `none`." = "保護のハードウェア: `armv6m-mpu`、`armv7m-mpu`、`armv8m-mpu`、`armv8m-tz`、`riscv-pmp`、`riscv-epmp`、`esp-pms`、`none`。"
"The relay: how a node reaches the nodes linked to it, independent of any MCU." = "リレー: ノードが、リンクで接続した他のノードに到達する機構。どのMCUにも依存しません。"
"The time service." = "時間のサービス。"
"The tools the project's MCUs need, by its definitions. Nobody can confirm a command here, so a check the project itself defines is reported as one for the terminal's `dagon doctor`." = "定義に準拠した、プロジェクトのマイコンに必要なツール。ここではコマンドの確認が不可能なので、プロジェクト自身が定義する確認は、ターミナルの`dagon doctor`で実施する確認として報告します。"
"The way's id, unique within its agent (same characters as an agent id)." = "接続方法のid。そのエージェントの中で重複しないこと（文字はエージェントのidと同一）。"
"The ways to reach the agent, in order; the first is the default." = "エージェントへの接続方法を順番に。最初の接続方法が既定です。"
"Tightly coupled memories, `[{ at, size }]`." = "密結合メモリ、`[{ at, size }]`。"
"Tool check: `what`, `probe` (command), `expect` (`\"runs\"`, `{ line = \"...\" }`, `{ prefix = \"...\" }`), `fix` (command), `hint`, `slow` (`true`: `dagon doctor --fix` says the install takes a while before it starts)." = "ツールの確認: `what`、`probe`（コマンド）、`expect`（`\"runs\"`、`{ line = \"...\" }`、`{ prefix = \"...\" }`）、`fix`（コマンド）、`hint`、`slow`（`true`: `dagon doctor --fix`が、インストールに時間を要することを開始前に通知します）。"
"Topology YAML: schema, validation rules and the supported-board table. Shared by the CLI and the browser build so both apply the same rules." = "構成のYAML: スキーマ、検証の規則、対応ボードの表。CLIとブラウザ向けのビルドが共有し、同一の規則を使用します。"
"UI drawing." = "UIの図。"
"Versions, work area, abilities; whether keys exist (never the keys)." = "バージョン、作業領域、可能な操作。キーの有無（キー自体は対象外）。"
"What DAGON enforces: `none`, `mpu`, `pms`, `tz`. A kind gives `none` or one level (`mpu` for the MPU and PMP kinds, `pms` for `esp-pms`, `tz` for `armv8m-tz`)." = "DAGONが強制するもの: `none`、`mpu`、`pms`、`tz`。種類は`none`か1つのレベルを付与します（MPUとPMPの種類は`mpu`、`esp-pms`は`pms`、`armv8m-tz`は`tz`）。"
"What DAGON hands the extension (the `[capabilities]` keys below)." = "DAGONが拡張に付与するもの（以下の`[capabilities]`のキー）。"
"What a board's boot action program may use besides pins: `[\"i2c\"]` allows `bus_write`." = "ボードのブートのアクションプログラムが、ピン以外に使用可能なもの: `[\"i2c\"]`で`bus_write`を使用可能です。"
"What the MCU's firmware can write: each image kind a `[[slot]]` names, mapped to the kinds that write it (`app = [\"app\"]`, `bootcore = [\"app\"]`), each of them a kind with a slot here. A kind writes another kind's slots from its own; a kind that lists itself writes its own slot it is not running from, which counts only when it has two. A kind has one slot (`a`) or two (`a` and `b`); one slot loads only when a kind other than itself writes it." = "マイコンのファームウェアの書込範囲: `[[slot]]`が命名するイメージの種類ごとに、その種類を書込する種類を列挙します（`app = [\"app\"]`、`bootcore = [\"app\"]`）。列挙する種類はいずれも、ここにスロットを保持する種類です。ある種類は自身のスロットで動作して、別の種類のスロットに書込します。自身を列挙した種類は、自身が動作していない自身のスロットに書込します。この記述はその種類のスロットが2つの場合だけ有効です。種類ごとのスロットは1つ（`a`）か2つ（`a`と`b`）です。スロットが1つの種類は、自身以外の種類による書込の場合だけロード可能です。"
"Where the file goes in the project: a plain relative path, unique within the agent, not one of the files `dagon new` writes itself (`dagon.toml`, `topology.yaml`, `.gitignore`); both compared without case." = "プロジェクト内の出力先: 単純な相対パス。そのエージェントの中で重複しないこと。`dagon new`自身が出力するファイル（`dagon.toml`、`topology.yaml`、`.gitignore`）は指定不可です。いずれも大文字と小文字を同一視して比較します。"
"Whether the board can be an I2C target." = "ボードがI2Cのターゲットになれるか。"
"Who makes the agent, shown after its name." = "エージェントの作成者。名称の後に表示します。"
"Withdraws the consent (done also when none was)." = "同意を取消します（同意が不在の場合も完了します）。"
"Writes the topology YAML after the same check `dagon topo check` runs." = "`dagon topo check`と同一の確認の後に、構成のYAMLを保存します。"
"`.ext.data` + `.ext.bss`." = "`.ext.data` + `.ext.bss`。"
"`.ext.text` + `.ext.rodata` + the `.ext.data` load image." = "`.ext.text` + `.ext.rodata` + `.ext.data`のロードイメージ。"
"`[boot.record]`, for MCUs with a DAGON boot stage: where the boot record and the lockup fuse live. `kind` (`noinit-ram` inside `ram`, `retained-registers` inside a `[[peripheral]]`), `at`, `size` (at most 4096), `survives` (`reset-random`, `reset-cleared`, `power`: what a power loss leaves), `entropy = { source, min_bits }` (required; the start-up word a new record sequence mixes in: `source` one of `rng`, `ring-osc`, `osc-capture`, `adc-noise`; `min_bits` its min-entropy per word, a fact, at least 16 when it has a value), `rings = [{ writer, at, size }]` (one per boot stage, in boot order, inside the record), `fuse = { cells = [{ image, at, size }] }` (`bootcore`, `app`; outside the record), `reserved` (addresses the record never stores to). The byte layout inside is the `boot-record` contract's." = "`[boot.record]`、DAGONのブート段階を保持するマイコン用: ブート記録とロックアップヒューズの格納先。`kind`（`ram`の中の`noinit-ram`、`[[peripheral]]`の中の`retained-registers`）、`at`、`size`（最大4096）、`survives`（`reset-random`、`reset-cleared`、`power`: 電断後に残存するもの）、`entropy = { source, min_bits }`（必須。新規の記録のシーケンスが混合する起動時のワード: `source`は`rng`、`ring-osc`、`osc-capture`、`adc-noise`のいずれか。`min_bits`はワードあたりの最小エントロピーで、事実です。値がある場合は16以上）、`rings = [{ writer, at, size }]`（ブート段階ごとに1つ、ブートの順番に、記録の内部）、`fuse = { cells = [{ image, at, size }] }`（`bootcore`、`app`。記録の外部）、`reserved`（記録が一切ストアしないアドレス）。内部のバイトのレイアウトは`boot-record`の規約に準拠します。"
"`[{ controller, sda, scl }]` pairs usable from the header." = "ヘッダから使用可能な`[{ controller, sda, scl }]`の組。"
"`[{ pin, label }]`; `label` left out when not confirmed on the board. Every pin a topology may name on this board, as a link end on it (a hub's `pins`, `control`, bus `sda`/`scl`; a node's `node_pins` come from `i2c`): the check (V-07) refuses any other, and DAGON Console offers only these." = "`[{ pin, label }]`。ボード上で確認実績のない`label`は省略します。構成がこのボードで指定可能なピンの全部です（コーディネータ側の`pins`・`control`・バスの`sda`/`scl`。ノード側の`node_pins`は`i2c`から選択します）。構成の確認（V-07）はそれ以外を拒否し、DAGON Consoleはこれらのピンだけを選択肢に表示します。"
"`dagon gen` for the open project; dagon.toml is edited under the files lock." = "オープン中のプロジェクトで`dagon gen`を実行します。dagon.tomlはファイルのロック下で編集します。"
"`dagon new` there (empty 構成 unless from_sample), key pair in ~/.dagon/keys/<name> when none." = "その位置で`dagon new`を実行します（from_sampleが不在ならノードなしの構成）。キーの組が不在なら~/.dagon/keys/<name>に作成します。"
"`device` names one of the candidates the writer reports; with several and none named, the job ends with the candidates (written: false) and writes nothing." = "`device`は、書込の手段が報告する候補の1つを指定します。候補が複数で指定が不在の場合、作業は候補を提示して終了し（written: false）、何も書込しません。"
"`image` (`app`, `bootcore`, `agent`, `stage0`), `binding` (`a`, `b`, `any`), `header` (`inline`, `trailer`, `detached`); the region is `at` + `size` or `partition`; a detached header is at `header_at` or `header_partition` + `header_offset`." = "`image`（`app`、`bootcore`、`agent`、`stage0`）、`binding`（`a`、`b`、`any`）、`header`（`inline`、`trailer`、`detached`）。領域は`at` + `size`か`partition`です。分離したヘッダの位置は`header_at`か`header_partition` + `header_offset`です。"
"`kind` (`iwdg`, `rp-watchdog`, `rtc-wdt`), `trial_ms` (armed on a trial boot), `confirmed_ms` (armed otherwise), `trial_attempts` (boots the boot stage gives a pending image before it rolls back: the boot core's limit, or the vendor second stage's). An app may delay a reboot by at most half the shorter period. The MCU package's build turns `trial_attempts` into the constant its boot core and its agent use. `flag` (required): the watchdog-reset flag the lockup fuse needs (set by a watchdog reset, kept over every later reset but power-on, cleared when a start acknowledges it), a fact of `none`, `register` (a reset-flag register; name it and its source in a comment) or `package` (the MCU package keeps it): `\"register\"`, `{ unverified = \"package\" }`, `\"unmeasured\"`. Without a flag with a source the MCU has no lockup fuse. `range_ms` (required): `{ min, max }`, the periods the MCU's watchdog can run, ms, with its source in a comment; a definition whose `trial_ms` or `confirmed_ms` lies outside it is refused, when the definitions load and when the firmware layout is generated." = "`kind`（`iwdg`、`rp-watchdog`、`rtc-wdt`）、`trial_ms`（試行のブートで有効化）、`confirmed_ms`（それ以外で有効化）、`trial_attempts`（ブート段階がロールバックまでに待機中のイメージに許可するブートの回数: ブートローダの上限か、ベンダーの第2段階の上限）。アプリが再起動を遅延可能な時間は、短期側の周期の半分までです。マイコンの定義のビルドが、`trial_attempts`をブートローダとエージェントが使用する定数に変換します。`flag`（必須）: ロックアップヒューズに必要なウォッチドッグによるリセットのフラグ（ウォッチドッグによるリセットで設定され、電源投入以外の以降のリセットでも保持され、起動処理の確認で消去される）で、`none`、`register`（リセットのフラグのレジスタ。名称と出典をコメントで明示します）、`package`（マイコンの定義のコードが保持）のいずれかの事実です: `\"register\"`、`{ unverified = \"package\" }`、`\"unmeasured\"`。出典のあるフラグが不在のマイコンには、ロックアップヒューズはありません。`range_ms`（必須）: `{ min, max }`。そのマイコンのウォッチドッグが動作可能な周期（ms）で、出典をコメントで明示します。`trial_ms`か`confirmed_ms`がその範囲外の定義は、定義の読込時と、ファームウェアの配置の生成時に拒否します。"
"`layer.kind`, `layer.prefix*` (matching at least one kind of the catalog) or `layer.*`." = "`layer.kind`、`layer.prefix*`（カタログの種類の最低1つに一致すること）、または`layer.*`。"
"`name` (unique), `base` (address of flash byte 0), `bytes`, `xip` (required; `true`: the CPU reads flash at `base`, so flash shares the address space with RAM and register blocks; `false`: `base` and the slots are flash offsets an MMU maps elsewhere). The first is the default." = "`name`（重複しないこと）、`base`（フラッシュのバイト0のアドレス）、`bytes`、`xip`（必須。`true`: CPUがフラッシュを`base`で読込するので、フラッシュはRAMやレジスタブロックとアドレス空間を共有します。`false`: `base`とスロットは、MMUが別の位置に割当するフラッシュのオフセットです）。最初の項目が既定です。"
"`none`, `i-cache`, `id-cache` (instruction and data)." = "`none`、`i-cache`、`id-cache`（命令とデータ）。"
"`scratch = { at, size }`: flash a conformance build erases and writes; apart from every slot, header, log face and stage0." = "`scratch = { at, size }`: 適合試験のビルドが消去と書込を実行するフラッシュ。どのスロット、ヘッダ、ログの面、stage0とも分離します。"
"`self-boot` or `vendor-stage2`." = "`self-boot`か`vendor-stage2`。"
"`true`: the board a node naming only its MCU is checked against (a project cannot replace the default of a builtin MCU that already has one: two marked boards do not load). At most one board of an MCU says so; an MCU's only board is its default without it; an MCU with several boards and none marked has no default (its nodes are checked without board facts). Definition order never decides it." = "`true`: マイコンだけを指定したノードの確認に使用するボード（既定のボードが設定済の組込のマイコンについて、プロジェクトはその既定を置換不可です。マークを付与したボードが2つあると読込しません）。マイコンごとに、この指定が可能なボードは最大1つです。マイコンの唯一のボードは、この指定が不在でも既定です。ボードが複数でマークが不在のマイコンには既定がありません（そのノードはボードの事実なしで確認します）。定義の順番で決定することはありません。"
"`{ at, size }`: all of the MCU's RAM. Images get the RAM below the boot record, the fuse cells and the extension regions." = "`{ at, size }`: マイコンのRAMの全体。イメージは、ブート記録、ヒューズのセル、拡張のリージョンより下位のRAMを取得します。"
"`{answer}` to the job's open question (409 when it has none)." = "作業の未回答の質問への`{answer}`（質問が不在の場合は409）。"
"`{state: \"released\"}`: the page has closed the hub's port, so the CLI job waiting for it can use it." = "`{state: \"released\"}`: ページがPC接続ノードのポートをクローズしたので、そのポートを待機中のCLIの作業が使用可能です。"
"boot action program ops in a board's [boot]: the generated BOOT_PROGRAM_FORMAT (dagon-topology defs::board_boot::BOOT_PROGRAM_FORMAT)" = "ボードの[boot]にあるブートのアクションプログラムの操作: 生成されるBOOT_PROGRAM_FORMAT（dagon-topology defs::board_boot::BOOT_PROGRAM_FORMAT）"
"boot core and app state log faces: offset 0x004 (dagon-format statelog::FORMAT_VERSION)" = "ブートローダとアプリの状態ログの面: オフセット0x004（dagon-format statelog::FORMAT_VERSION）"
"compiled topology: offset 4 (dagon-format topology::TP_VERSION)" = "コンパイル済の構成: オフセット4（dagon-format topology::TP_VERSION）"
"dagon serve HTTP API: GET /v1/hello `api` (dagon-cli versions::SERVE_API)" = "dagon serveのHTTP API: GET /v1/helloの`api`（dagon-cli versions::SERVE_API）"
"dagon-extension.toml: its `format` key (dagon-extension MANIFEST_FORMAT)" = "dagon-extension.toml: その`format`キー（dagon-extension MANIFEST_FORMAT）"
"dagon-mcu.toml / dagon-board.toml / [board.<id>]: `format` key, left out = 1 (dagon-topology defs::FORMAT)" = "dagon-mcu.toml / dagon-board.toml / [board.<id>]: `format`キー。省略時は1（dagon-topology defs::FORMAT）"
"esp toolchain" = "espツールチェーン"
"espflash" = "espflash"
"espup" = "espup"
"frames and payloads between host, hub and nodes: byte 2 of every frame, HELLO proto_ver (dagon-proto PROTO_VERSION)" = "ホスト、コーディネータ、他のノード間のフレームとペイロード: 全フレームのバイト2、HELLOのproto_ver（dagon-proto PROTO_VERSION）"
"lifecycle event kinds, codes, payloads and EventRecord (dagon-events EVENT_FORMAT)" = "ライフサイクルイベントの種類、コード、ペイロード、EventRecord（dagon-events EVENT_FORMAT）"
"plug in the ST-LINK; on Windows install the ST-LINK USB driver from st.com" = "ST-LINKを接続してください。Windowsではst.comからST-LINKのUSBドライバをインストールしてください"
"probe-rs" = "probe-rs"
"release file .dgb: offset 4 (dagon-format bundle::BN_VERSION)" = "リリースのファイル.dgb: オフセット4（dagon-format bundle::BN_VERSION）"
"release manifest: offset 4 (dagon-format manifest::MF_VERSION)" = "リリースのマニフェスト: オフセット4（dagon-format manifest::MF_VERSION）"
"signed 512-byte image header: offset 0x004 (dagon-format header::HDR_VERSION)" = "署名付きの512バイトのイメージのヘッダ: オフセット0x004（dagon-format header::HDR_VERSION）"
"target thumbv6m-none-eabi" = "ターゲットthumbv6m-none-eabi"
"target thumbv7em-none-eabihf" = "ターゲットthumbv7em-none-eabihf"
"topology source: its `dagon:` key (dagon-topology SCHEMA_VERSION)" = "構成のソース: その`dagon:`キー（dagon-topology SCHEMA_VERSION）"
"表示名 and editor positions (an empty layout before the first save)." = "表示名とエディタの位置（初回保存前は未設定の配置）。"
"dagon.toml: its `format` key, required (dagon-topology project::FORMAT)" = "dagon.toml: その`format`キー、必須（dagon-topology project::FORMAT）"
"the layout file beside the 構成: its `format` (dagon-cli versions::LAYOUT_FORMAT)" = "構成の隣の配置ファイル: その`format`（dagon-cli versions::LAYOUT_FORMAT）"
"The flash part the board carries, for an MCU whose flash is a board part: `part` (cite its datasheet in a comment) and `erase_regions` in the shape of the MCU's `[execution]` `erase_regions` (`start`, `len`, `unit`, `unit_max_ms`). They replace the MCU's regions whole for nodes on this board; checked with the MCU's watchdog and slot layouts. Left out: the MCU's regions. The node and the host plan every erase from the same regions." = "フラッシュがボードの部品であるマイコンで、ボードが搭載するフラッシュの部品: `part`（コメントでデータシートの出典を明示します）と、マイコンの`[execution]` `erase_regions`と同一の形式の`erase_regions`（`start`、`len`、`unit`、`unit_max_ms`）。このボードのノードでは、マイコンの領域を全体置換します。マイコンのウォッチドッグとスロットの配置と照合して確認します。省略時はマイコンの領域です。ノードもホストも同一の領域から全部の消去を計画します。"
"What drives the MCU's clock input on this board: `source` is `\"internal\"`, `{ crystal_hz = N }` or `{ external_hz = N }` (cite the schematic or datasheet that gives N in a comment). Left out: internal. Stage0, the DAGON boot loader and the app each run on their MCU's setup for this source (`[[stage0.clock]]`, `[[bootcore.clock]]`, `[[app.clock]]`), or on the internal one when none matches; an MCU without those stages does not use it." = "このボードでマイコンのクロック入力を駆動するもの: `source`は`\"internal\"`、`{ crystal_hz = N }`、`{ external_hz = N }`のいずれかです（Nの出典の回路図かデータシートをコメントに記述します）。省略時はinternalです。stage0、DAGONのブートローダ、アプリは、それぞれマイコンのこの供給元に一致する設定（`[[stage0.clock]]`、`[[bootcore.clock]]`、`[[app.clock]]`）で動作し、一致する設定が不在ならinternalの設定で動作します。それらの段階のないマイコンでは使用しません。"
"The DAGON boot loader's clock, exactly when the MCU has a `bootcore` slot: `[[bootcore.clock]]` lists the setups the boot loader runs on, as `[[stage0.clock]]` does for stage0 and checked by the same PLL rules, and the boot loader's HAL sets the chosen one up. Its internal setup may run a PLL from the MCU's own oscillator: `{ source = \"internal\", in_hz, out_hz, pll = { ... } }`, `in_hz` that oscillator's frequency (the STM32F401's HSI); without a `pll` it takes only `out_hz`. For a node, the boot loader runs on the setup the board's `[clock]` picks, as stage0 does, else on the internal one." = "DAGONのブートローダのクロック。マイコンに`bootcore`のスロットがある場合だけ記述します: `[[bootcore.clock]]`は、`[[stage0.clock]]`のstage0用の設定と同様に、ブートローダが動作する設定を列挙し、同一のPLLの規則で検証します。ブートローダのHALが選択した設定を構成します。internalの設定は、マイコン自身の発振器からPLLを駆動可能です: `{ source = \"internal\", in_hz, out_hz, pll = { ... } }`で、`in_hz`はその発振器の周波数です（STM32F401のHSI）。`pll`が不在の場合は`out_hz`だけを記述します。ノードのブートローダは、stage0と同様に、ボードの`[clock]`が選択する設定で動作し、一致する設定が不在ならinternalの設定で動作します。"
"The app's clock, exactly when the MCU has a `bootcore` slot: `[[app.clock]]`, as `[[bootcore.clock]]` for the app, which `dagon gen` writes into the node's `wiring.rs` and a board package into its definition module; the MCU package's app start-up sets it up. On the RP2040 a setup with the USB PLL (`usb_refdiv`, `usb_fbdiv`, `usb_postdiv1`, `usb_postdiv2`, giving 48 MHz) gives the app its USB clock; an app without one builds only without a USB uplink. The internal setup may state `tolerance_ppm`, how far the oscillator may run from `out_hz`; a node whose app runs on an internal setup without it runs no UART link (V-26) and drives no I2C bus (V-20) on that clock." = "アプリのクロック。マイコンに`bootcore`のスロットがある場合だけ記述します: `[[app.clock]]`は、アプリ用の`[[bootcore.clock]]`です。選択した設定は`dagon gen`がノードの`wiring.rs`に出力し、ボードの定義は自身の定義のモジュールに出力します。マイコン定義側のアプリ起動処理がその設定を構成します。RP2040ではUSBのPLL（`usb_refdiv`、`usb_fbdiv`、`usb_postdiv1`、`usb_postdiv2`で、48MHzを生成します）を保持する設定が、アプリにUSBのクロックを付与します。USBのPLLが不在の設定のアプリは、USBの上りのリンクが不在の場合だけビルド可能です。internalの設定には`tolerance_ppm`（発振器の`out_hz`からの許容偏差）を記述可能です。この項目が不在のinternalの設定でアプリが動作するノードは、そのクロックでUARTリンクを使用せず（V-26）、I2Cのバスも駆動しません（V-20）。"
"The MCU's link interfaces a topology link end names: `index` (0 to 255), `name` (`a-z`, `0-9`, `-`) and `kind` (a link kind: `i2c`, `uart`, `can`, `ethernet`, `usb-cdc`, `ble`, `wifi-tcp`); `index` and `name` each unique. A link end's `port` is one of these names, of the link's kind (topology check V-27), and the compiled topology carries its `index`." = "構成のリンクの端が名称で指定する、マイコンのリンクのインタフェース: `index`（0から255）、`name`（`a-z`、`0-9`、`-`）、`kind`（リンクの種類: `i2c`、`uart`、`can`、`ethernet`、`usb-cdc`、`ble`、`wifi-tcp`）。`index`と`name`はそれぞれ重複しません。リンクの端の`port`はリンクの種類に該当するこれらの名称のいずれかです（構成の確認V-27）。コンパイル済の構成はその`index`を保持します。"
"The links a node of this MCU relays over, one per `[[link_port]]` at most: `id` (RELAY's link id, 1 to 254, unique), `port` (a `[[link_port]]` name), `addressing` (`\"seven-bit\"`: the reached end's address from the topology, on a kind with addresses; `{ fixed = N }`, N 0 to 255: the one peer of a kind without addresses) and `max_payload` (1 up to the protocol maximum of the port's kind). An MCU package's build generates them as its `RELAY_LINKS`, and the PC reads the same entries. The relay keeps, per link, a buffer of one frame of its `max_payload` (`RELAY_LINK_BUFFERS`) and no more; the build stops when that buffer cannot hold the largest frame of the link's kind. Data longer than the buffer (a RELAY's inner frame, the data I2C_RAW writes and the length it reads) is refused with `E_ARG`, never cut. The I2C_RAW limit is the buffer of the link the recovered node is on." = "このマイコンのノードが中継に使用するリンク。`[[link_port]]`ごとに最大1つです: `id`（RELAYのリンクの番号。1から254で、重複しません）、`port`（`[[link_port]]`の名称）、`addressing`（`\"seven-bit\"`: 構成が到達側の端に記述するアドレス。アドレスのある種類で使用します。`{ fixed = N }`（Nは0から255）: アドレスのない種類の、唯一の対向ノード）、`max_payload`（1から、ポート種別のプロトコル上の最大値まで）。マイコンごとのファームウェアのビルドがこの情報を`RELAY_LINKS`として生成し、PCも同一の項目を読込します。リレーはリンクごとに、`max_payload`の1フレーム分（`RELAY_LINK_BUFFERS`）のバッファだけを保持します。そのバッファにリンク種別で最大のフレームを収容不可の場合は、ビルドが停止します。バッファを超過するデータ（RELAYの内部のフレーム、I2C_RAWで書込するデータと読出のサイズ）は`E_ARG`で拒否し、切除しません。I2C_RAWの上限は、復旧の対象のノードが接続するリンクのバッファです。"
"The budget of the relaying app firmware: `ram_bytes` (static RAM, `.bss` plus `.data`, in bytes; 1 up to the MCU's RAM size). Only an MCU with `[[relay_link]]` gives it. CI builds the MCU package's `examples/relay.rs`, measures it and fails above this value (`scripts/relay_ram.py`)." = "中継するアプリのファームウェアの予算: `ram_bytes`（静的なRAM、`.bss`と`.data`の合計のバイト数。1から、マイコンのRAMのサイズまで）。`[[relay_link]]`のあるマイコンだけが記述します。CIはマイコンごとのファームウェアの`examples/relay.rs`をビルドして計測し、この値を超過すると失敗にします（`scripts/relay_ram.py`）。"
"The wire codec's budgets: `bootcore` (every boot core of the MCU) and `relay` (the relay firmware), each `{ flash_bytes, stack_bytes, ram_bytes }`: the codec's (`dagon_proto`) functions and named read-only data in flash, the deepest stack from any of its functions, and its static data in RAM, in bytes. `bootcore` only with a `[[slot_layout]]` of target `bootcore`, `relay` only with `[[relay_link]]`; an MCU with such an image gives its budget. CI builds each image with rustc's stack frame records, measures it, and fails above a value, and when the call graph has an indirect call other than a handler row's dispatch, a call it cannot follow or recursion (`scripts/codec_budget.py`)." = "通信コーデックの予算です。`bootcore`（マイコンの全ブートローダ）と`relay`（中継ファームウェア）に、それぞれ`{ flash_bytes, stack_bytes, ram_bytes }`を記述します。各値はコーデック（`dagon_proto`）の関数と名称付きの読出専用データのフラッシュ使用量、全関数起点の最大スタック使用量、RAM上の静的データ量で、単位はバイトです。`bootcore`は対象`bootcore`の`[[slot_layout]]`があるマイコン限定、`relay`は`[[relay_link]]`があるマイコン限定で、該当イメージがあるマイコンは記述必須です。CIは各イメージをrustcのスタックフレーム記録付きでビルドして計測し、値の超過時と、呼出グラフにハンドラ行の分岐以外の間接呼出、追跡不能な呼出、再帰が存在する時に失敗します（`scripts/codec_budget.py`）。"
"The medium: `i2c`, `uart`, `can`, `ethernet`, `usb-cdc`, `ble`, `wifi-tcp`." = "媒体: `i2c`、`uart`、`can`、`ethernet`、`usb-cdc`、`ble`、`wifi-tcp`。"
"The two nodes it joins, each with the port it uses there (V-04, V-27)." = "接続する2つのノード。各ノードについて、そのノードで使用するポートも記述します（V-04、V-27）。"
"An I2C link's bus: an `id` of `buses` (V-01)." = "I2Cのリンクのバス: `buses`の`id`（V-01）。"
"A UART link's UART: `hw-uart0` or `pio-uart` (V-01)." = "UARTのリンクのUART: `hw-uart0`か`pio-uart`（V-01）。"
"A UART link's bit rate; 115200 when left out (V-26)." = "UARTのリンクのビットレート。省略時は115200です（V-26）。"
"How a node is put into its ROM loader over this link: `kind` (`full`, `cooperative`) and `rom_entry` (`force-download-boot`, `m5pm1`, `stm32-i2c-rom`). An I2C or UART link needs `rom_entry` when it is cooperative, the default (V-11)." = "このリンクでノードをROMのローダーに移行させる方法: `kind`（`full`、`cooperative`）と`rom_entry`（`force-download-boot`、`m5pm1`、`stm32-i2c-rom`）。I2CかUARTのリンクは、既定のcooperativeの場合に`rom_entry`が必要です（V-11）。"
"A node `id`." = "ノードの`id`。"
"A `[[link_port]]` name of the node's MCU definition, of the link's kind (V-27)." = "ノードのマイコン定義にある`[[link_port]]`の名称。リンクの種類に該当する名称です（V-27）。"
"The 7-bit address (0x08 to 0x77) the other end reaches this node at, on a kind with addresses (I2C); refused on any other kind (V-18). No two ends on one bus share one, and none takes the address of a ROM loader reached over that bus (V-18)." = "対向側の端がこのノードへ到達する7ビットのアドレス（0x08から0x77）。アドレスのある種類（I2C）専用で、他の種類では拒否します（V-18）。1つのバスで2つの端が同一のアドレスを使用することは不可で、そのバス経由で到達するROMのローダーのアドレスも使用不可です（V-18）。"
"This node's I2C pins by MCU pin name (`{ sda: PB4, scl: PA8 }`), on an end with `addr` (V-01): one of its board's I2C pairs (V-07)." = "このノードのI2Cのピン。マイコンのピン名で記述します（`{ sda: PB4, scl: PA8 }`）。`addr`のある端に記述します（V-01）。ボードのI2Cの組のいずれかです（V-07）。"
"This node's UART pins as GPIO numbers (`{ tx: 26, rx: 27 }`); a UART link names them on at least one end, and a link of any other kind on none (V-01)." = "このノードのUARTのピン。GPIOの番号で記述します（`{ tx: 26, rx: 27 }`）。UARTのリンクは最低1つの端に記述し、他の種類のリンクはどの端にも記述しません（V-01）。"
"This node's GPIO driving the other node's reset, for `control.kind: full`." = "対向ノードのリセットを駆動する、このノードのGPIO。`control.kind: full`の場合に使用します。"
"This node's GPIO driving the other node's boot pin, for `control.kind: full`." = "対向ノードの起動ピンを駆動する、このノードのGPIO。`control.kind: full`の場合に使用します。"
